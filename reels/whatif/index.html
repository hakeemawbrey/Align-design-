<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stars Align</title>
<style>
@font-face { font-family: Fredoka; src: url(assets/fredoka-latin.woff2) format('woff2'); font-weight: 300 700; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="build/timeline.js"></script>
<script>
'use strict';
// "What if two stars could align?" — every frame is a pure function of time:
// window.seek(t) draws frame t. Ambient time (twinkle, spin, bob) is t itself;
// the story (camera, events) runs on a separate story clock so the rewind
// near the end replays the story without disturbing the ambient motion.

const W = 1920, H = 1080, FPS = 30;
const TL = window.TL;
const E = TL.events, LINES = TL.lines;
const lineStart = i => LINES[i].t0;

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eoq = t => 1 - Math.pow(1 - clamp(t), 5);
const eoc = t => 1 - Math.pow(1 - clamp(t), 3);
const eic = t => Math.pow(clamp(t), 3);
const prog = (s, t0, d) => clamp((s - t0) / d);
const win = (s, a, b, fi = .3, fo = .3) => clamp((s - a) / fi) * (1 - clamp((s - b) / fo));
const TAU = Math.PI * 2;
// damped spring step response, damping .42–.5, frequency 12–16
function spring(dt, z = .45, w = 14) {
  if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + z * w / wd * Math.sin(wd * dt));
}
// a decaying wobble (0 → kick → settles), for squash and stretch
const wobble = (dt, w = 14, z = .45) => dt <= 0 ? 0 : Math.exp(-z * w * dt) * Math.sin(w * Math.sqrt(1 - z * z) * dt);
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const mod = (a, n) => ((a % n) + n) % n;

// ---------- world layout (1x frame = 1920 × 1080) ----------
const FAR = { x: 0, y: 540, r: 300 };       // far star, half off the left edge
const NEAR = { x: 850, y: 540, r: 82 };     // the lens star, halfway
const EARTH = { x: 1660, y: 540, r: 150 };
const ASTRO = { x: 1440, y: 836 };
const RING_R = 132;                          // the Einstein ring, schematic

// ---------- story clock ----------
const RW = E.rewind, RWD = .8;
const TITLE = E.title;
// replay starts so the replayed flash lands just before the title word
const FLASH_AFTER = .55;
const A0 = Math.min(E.align - .6, E.align + FLASH_AFTER - (TITLE - .12 - RW - RWD));
function storyTime(t) {
  if (t < RW) return t;
  if (t < RW + RWD) return lerp(RW, A0, eio((t - RW) / RWD));
  return A0 + (t - RW - RWD);
}
const TOTAL = TITLE + 3.2;

// ---------- camera ----------
const CAM0 = { x: 850, y: 452, z: 2.25 };
const MOVES = [
  { t: E.pullback - .15, d: 1.5, x: 960, y: 540, z: 1 },
  { t: E.ruler, d: 2.6, x: 930, y: 505, z: 1.07 },
  { t: E.halfway - .1, d: 1.8, x: 880, y: 540, z: 1.13 },
  { t: E.dive - .1, d: 1.25, x: 850, y: 540, z: 2.3 },
  { t: E.ring, d: 1.3, x: 860, y: 536, z: 2.45 },
  { t: lineStart(5) - .08, d: 1.05, x: 1610, y: 520, z: 2.3 },
  { t: E.brighten, d: 1.4, x: 1600, y: 512, z: 2.4 },
  { t: E.pullout - .05, d: 3.0, x: 980, y: 560, z: .3 },
  { t: E.reveal - .05, d: 1.1, x: 950, y: 560, z: .34 },
  { t: E.counter, d: 2.6, x: 1020, y: 500, z: .38 },
  { t: lineStart(10) - .05, d: 1.3, x: 1500, y: 690, z: 1.5 },
  { t: E.shades - .1, d: .7, x: 1475, y: 760, z: 1.85 },
  { t: lineStart(11) - .05, d: 1.15, x: 850, y: 420, z: 1.5 },
  { t: E.planet, d: 1.2, x: 870, y: 440, z: 1.62 },
  { t: E.zoomout - .05, d: 2.1, x: 850, y: 540, z: .085 },
  { t: E.million, d: 2.4, x: 850, y: 540, z: .1 },
];
MOVES.sort((a, b) => a.t - b.t);
function camMix(a, b, p) { return { x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), p)) }; }
for (let i = 0; i < MOVES.length; i++) {
  MOVES[i].from = i === 0 ? CAM0 : camAtIdx(i - 1, MOVES[i].t);
}
function camAtIdx(i, s) { const m = MOVES[i]; return camMix(m.from, m, eio(prog(s, m.t, m.d))); }
function cameraAt(s) {
  let c = CAM0;
  for (let i = MOVES.length - 1; i >= 0; i--) if (s >= MOVES[i].t) { c = camAtIdx(i, s); break; }
  // nothing ever holds still: a slow drift on top of every shot
  return { x: c.x + 7 * Math.sin(s * .37), y: c.y + 5 * Math.sin(s * .29 + 1), z: c.z * (1 + .012 * Math.sin(s * .23)) };
}
let CAM = CAM0;
const sx = x => (x - CAM.x) * CAM.z + W / 2;
const sy = y => (y - CAM.y) * CAM.z + H / 2;
const sz = r => r * CAM.z;

// ---------- canvases ----------
const out = document.getElementById('c');
const octx = out.getContext('2d');
const scene = document.createElement('canvas'); scene.width = W; scene.height = H;
const ctx = scene.getContext('2d');

// ---------- background: stars and nebulae ----------
const STAR_LAYERS = [.12, .35, .6].map((d, li) => {
  const r = rng(101 + li), P = { x: 2600, y: 1700 };
  const n = [520, 300, 170][li];
  const stars = [];
  for (let i = 0; i < n; i++) stars.push({
    x: r() * P.x, y: r() * P.y, s: [0.7, 1.1, 1.6][li] * (0.6 + r() * .8),
    a: .35 + r() * .55, f: .6 + r() * 2.2, ph: r() * TAU,
    sparkle: li === 2 && r() < .4, hue: r(),
  });
  return { d, P, stars };
});
const NEBULAE = [
  { x: -300, y: 200, r: 1300, c: [24, 150, 160], a: .20 },
  { x: 1500, y: -100, r: 1200, c: [40, 95, 195], a: .16 },
  { x: 900, y: 1100, r: 1100, c: [220, 95, 110], a: .10 },
  { x: 2400, y: 700, r: 1400, c: [60, 70, 175], a: .15 },
  { x: 300, y: 900, r: 1000, c: [24, 150, 160], a: .14 },
];

function drawBackground(t, s, boost) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#081d2c'); g.addColorStop(1, '#102348');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // nebula blobs, deep parallax
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [i, n] of NEBULAE.entries()) {
    const d = .07, zl = Math.pow(CAM.z, .1);
    const x = W / 2 + (n.x + 60 * Math.sin(t * .05 + i) - CAM.x * d - 500) * zl;
    const y = H / 2 + (n.y + 40 * Math.cos(t * .04 + i * 2) - CAM.y * d - 300) * zl;
    const r = n.r * zl;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${n.c},${n.a})`); rg.addColorStop(.5, `rgba(${n.c},${n.a * .45})`); rg.addColorStop(1, `rgba(${n.c},0)`);
    ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  ctx.restore();
  // three star layers
  for (const L of STAR_LAYERS) {
    const zl = Math.pow(CAM.z, L.d);
    const Px = L.P.x * zl, Py = L.P.y * zl;
    for (const st of L.stars) {
      const bx = mod((st.x - CAM.x * L.d) * zl + W / 2, Px), by = mod((st.y - CAM.y * L.d) * zl + H / 2, Py);
      const tw = .62 + .38 * Math.sin(t * st.f + st.ph);
      const a = clamp(st.a * tw * (1 + boost));
      const size = st.s * Math.max(.7, Math.pow(zl, .5)) * (1 + boost * .4);
      const col = st.hue < .7 ? '230,244,255' : st.hue < .85 ? '255,226,170' : '170,230,240';
      for (let X = bx - Px; X < W + 20; X += Px) {
        if (X < -20) continue;
        for (let Y = by - Py; Y < H + 20; Y += Py) {
          if (Y < -20) continue;
          if (st.sparkle) sparkle(X, Y, size * 4.2, a, col, t * .3 + st.ph);
          else { ctx.fillStyle = `rgba(${col},${a})`; ctx.beginPath(); ctx.arc(X, Y, size, 0, TAU); ctx.fill(); }
        }
      }
    }
  }
}
function sparkle(x, y, r, a, col, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(rot) * .2);
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * .9);
  g.addColorStop(0, `rgba(${col},${a * .5})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  ctx.fillStyle = `rgba(${col},${a})`;
  ctx.beginPath();
  const k = r * .13;
  ctx.moveTo(0, -r); ctx.quadraticCurveTo(k, -k, r, 0); ctx.quadraticCurveTo(k, k, 0, r);
  ctx.quadraticCurveTo(-k, k, -r, 0); ctx.quadraticCurveTo(-k, -k, 0, -r); ctx.fill();
  ctx.restore();
}

// ---------- stars (the Sun look) ----------
const GRAN = (() => { const r = rng(7); return Array.from({ length: 28 }, () => ({ a: r() * TAU, d: Math.sqrt(r()) * .82, s: .05 + r() * .07, v: (r() - .5) * .08, ph: r() * TAU })); })();
const PAL_WARM = { core: ['#fff7dc', '#ffc857', '#ff8f4a'], halo: '255,190,100', ray: '255,215,140', gran: '255,248,215' };
const PAL_COOL = { core: ['#ffffff', '#e6f7ff', '#8fd8e6'], halo: '150,225,240', ray: '200,240,255', gran: '255,255,255' };
function drawStar(x, y, r, t, pal, glow = 1, rayRot = 0) {
  if (x + r * 2.4 < 0 || x - r * 2.4 > W || y + r * 2.4 < 0 || y - r * 2.4 > H) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // 18 faint rotating ray wedges
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * .025 + rayRot);
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * TAU, w = .055 + .02 * Math.sin(i * 1.7);
    const len = r * (2.2 + .5 * Math.sin(i * 2.3 + t * .2));
    const g = ctx.createRadialGradient(0, 0, r * .9, 0, 0, len);
    g.addColorStop(0, `rgba(${pal.ray},${.05 * glow})`); g.addColorStop(1, `rgba(${pal.ray},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, a - w, a + w); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // additive halo rings
  for (const [k, a] of [[2.1, .045], [1.76, .055], [1.48, .07], [1.23, .09]]) {
    ctx.fillStyle = `rgba(${pal.halo},${a * glow})`;
    ctx.beginPath(); ctx.arc(x, y, r * k, 0, TAU); ctx.fill();
  }
  const sg = ctx.createRadialGradient(x, y, r * .9, x, y, r * 3.2);
  sg.addColorStop(0, `rgba(${pal.halo},${.18 * glow})`); sg.addColorStop(1, `rgba(${pal.halo},0)`);
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, TAU); ctx.fill();
  ctx.restore();
  // body, offset highlight
  const bg = ctx.createRadialGradient(x - r * .32, y - r * .3, r * .05, x, y, r);
  bg.addColorStop(0, pal.core[0]); bg.addColorStop(.55, pal.core[1]); bg.addColorStop(1, pal.core[2]);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  // 28 drifting glowing granules
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r * .97, 0, TAU); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  for (const g of GRAN) {
    const a = g.a + t * g.v, d = g.d + .04 * Math.sin(t * .3 + g.ph);
    const gx = x + Math.cos(a) * d * r, gy = y + Math.sin(a) * d * r, gr = g.s * r * (1 + .25 * Math.sin(t * .7 + g.ph));
    const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    gg.addColorStop(0, `rgba(${pal.gran},.22)`); gg.addColorStop(1, `rgba(${pal.gran},0)`);
    ctx.fillStyle = gg; ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
  }
  ctx.restore();
}

// ---------- Earth (WebGL) ----------
const MW = 2048, MH = 1024;
const LAND = {
  na: [[-168, 66], [-162, 70], [-140, 70], [-125, 70], [-110, 73], [-95, 72], [-82, 68], [-78, 62], [-64, 60], [-56, 52], [-66, 45], [-70, 42], [-76, 38], [-81, 31], [-80, 25], [-84, 30], [-90, 29], [-97, 27], [-97, 21], [-92, 18], [-87, 21], [-84, 15], [-80, 9], [-78, 8], [-83, 8], [-90, 14], [-96, 16], [-105, 20], [-110, 24], [-113, 31], [-117, 33], [-121, 36], [-124, 41], [-124, 48], [-130, 55], [-138, 59], [-150, 60], [-158, 58], [-165, 62]],
  gl: [[-50, 60], [-42, 60], [-20, 70], [-18, 77], [-30, 83], [-55, 82], [-70, 78], [-56, 70]],
  sa: [[-80, 8], [-72, 12], [-62, 10], [-50, 0], [-35, -5], [-38, -13], [-40, -22], [-48, -27], [-53, -34], [-58, -38], [-65, -42], [-68, -50], [-72, -54], [-75, -48], [-73, -38], [-71, -30], [-70, -18], [-76, -14], [-81, -5], [-80, 0], [-77, 4]],
  eu: [[-10, 36], [-9, 43], [-2, 44], [-5, 48], [2, 51], [8, 54], [10, 58], [5, 62], [14, 67], [22, 70], [30, 70], [40, 67], [55, 69], [70, 73], [80, 73], [100, 77], [115, 74], [130, 72], [150, 71], [170, 70], [180, 67], [180, 64], [170, 60], [162, 58], [156, 51], [142, 53], [140, 46], [132, 43], [128, 39], [126, 35], [121, 31], [122, 25], [118, 23], [110, 21], [108, 16], [109, 12], [104, 9], [100, 13], [100, 7], [103, 1], [98, 8], [97, 16], [94, 17], [90, 22], [86, 20], [80, 15], [77, 8], [73, 17], [72, 21], [67, 25], [58, 25], [56, 27], [50, 30], [48, 29], [51, 25], [56, 24], [59, 22], [52, 16], [44, 12], [42, 16], [35, 28], [33, 31], [35, 36], [28, 36], [26, 40], [24, 38], [22, 37], [20, 40], [14, 45], [12, 44], [16, 41], [16, 38], [12, 38], [12, 42], [8, 44], [3, 43], [-1, 37], [-6, 36]],
  af: [[-17, 21], [-16, 28], [-10, 30], [-6, 35], [10, 37], [11, 33], [20, 31], [30, 31], [32, 31], [34, 28], [38, 22], [43, 12], [51, 12], [51, 10], [45, 2], [40, -3], [40, -10], [40, -15], [35, -23], [33, -27], [27, -34], [20, -35], [18, -32], [15, -27], [12, -18], [13, -10], [12, -5], [9, -1], [9, 4], [5, 6], [-5, 5], [-8, 4], [-12, 7], [-15, 11], [-17, 15]],
  au: [[114, -22], [114, -30], [116, -35], [123, -34], [130, -32], [135, -35], [138, -35], [141, -38], [146, -39], [150, -37], [153, -31], [153, -25], [150, -22], [146, -19], [145, -15], [142, -11], [141, -14], [136, -12], [132, -11], [129, -15], [125, -14], [122, -18]],
  mg: [[44, -25], [47, -25], [50, -15], [49, -12], [44, -17]],
  uk: [[-5, 50], [1, 51], [0, 53], [-3, 56], [-5, 58], [-6, 56], [-4, 54], [-5, 52]],
  jp: [[130, 31], [135, 34], [140, 36], [142, 40], [141, 45], [140, 42], [136, 36], [131, 34]],
  bo: [[109, 1], [114, 4], [118, 6], [119, 1], [116, -4], [110, -3]],
  su: [[95, 5], [98, 4], [104, -3], [106, -6], [101, -3]],
  ng: [[131, -1], [138, -2], [147, -6], [150, -10], [143, -9], [137, -5], [132, -3]],
  nz: [[172, -35], [178, -38], [175, -41], [168, -46], [166, -45], [172, -41]],
  ic: [[-24, 64], [-18, 63], [-13, 65], [-16, 67], [-22, 66]],
};
const ANT = (() => { const p = [[-180, -90]]; for (let lo = -180; lo <= 180; lo += 10) p.push([lo, -68 + 3 * Math.sin(lo * .07) + 2 * Math.sin(lo * .19)]); p.push([180, -90]); return p; })();
const ll = (lo, la) => [(lo + 180) / 360 * MW, (90 - la) / 180 * MH];
function poly(c, pts) { c.beginPath(); pts.forEach(([lo, la], i) => { const [x, y] = ll(lo, la); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); }
function blob(c, lo, la, rx, ry, rot = 0) { const [x, y] = ll(lo, la); c.beginPath(); c.ellipse(x, y, rx / 360 * MW, ry / 180 * MH, rot, 0, TAU); }
function makeMaps() {
  const r = rng(42);
  // land with biomes
  const land = document.createElement('canvas'); land.width = MW; land.height = MH;
  const lc = land.getContext('2d');
  lc.fillStyle = '#5fc47a';
  for (const k in LAND) { poly(lc, LAND[k]); lc.fill(); }
  lc.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 260; i++) { lc.fillStyle = r() < .5 ? '#48ad6b' : '#6bcd84'; blob(lc, r() * 360 - 180, r() * 140 - 60, 2 + r() * 6, 1.5 + r() * 4, r() * 3); lc.fill(); }
  lc.fillStyle = '#48ad6b';
  for (let lo = -170; lo < 180; lo += 6) { blob(lc, lo, 56 + 5 * Math.sin(lo * .1), 7, 6); lc.fill(); }
  lc.fillStyle = '#3a9d62';
  for (const [lo, la, rx, ry] of [[-62, -5, 14, 9], [20, 0, 9, 6], [112, 0, 13, 6], [-85, 12, 5, 4], [80, 22, 5, 4], [102, 18, 6, 5]]) { blob(lc, lo, la, rx, ry); lc.fill(); }
  lc.fillStyle = '#f5c75f';
  poly(lc, [[-16, 18], [-12, 28], [8, 32], [32, 30], [36, 20], [25, 15], [10, 14], [-5, 15]]); lc.fill();
  poly(lc, [[36, 29], [48, 30], [57, 24], [53, 16], [44, 14], [38, 20]]); lc.fill();
  for (const [lo, la, rx, ry] of [[133, -25, 13, 8], [100, 42, 12, 5], [-112, 33, 6, 5], [21, -23, 6, 5], [60, 40, 8, 5], [-69, -24, 3, 7]]) { blob(lc, lo, la, rx, ry); lc.fill(); }
  lc.fillStyle = '#f1f8ff';
  poly(lc, LAND.gl); lc.fill();
  lc.fillRect(0, 0, MW, (90 - 71) / 180 * MH);
  lc.globalCompositeOperation = 'source-over';
  lc.fillStyle = '#f1f8ff'; poly(lc, ANT); lc.fill();
  // day map
  const day = document.createElement('canvas'); day.width = MW; day.height = MH;
  const dc = day.getContext('2d');
  const og = dc.createLinearGradient(0, 0, 0, MH);
  og.addColorStop(0, '#1a66b8'); og.addColorStop(.32, '#3aa9df'); og.addColorStop(.5, '#4dc7eb'); og.addColorStop(.68, '#3aa9df'); og.addColorStop(1, '#1a66b8');
  dc.fillStyle = og; dc.fillRect(0, 0, MW, MH);
  // a lighter shelf around the coasts
  dc.save(); dc.filter = 'blur(14px)'; dc.globalAlpha = .45; dc.drawImage(land, 0, 0); dc.restore();
  dc.drawImage(land, 0, 0);
  dc.fillStyle = 'rgba(241,248,255,.92)'; dc.fillRect(0, 0, MW, (90 - 82) / 180 * MH);
  // white capsule clouds
  for (let i = 0; i < 120; i++) {
    const lo = r() * 360 - 180, la = (r() - .5) * 120, len = 40 + r() * 170, w = 9 + r() * 16;
    const [x, y] = ll(lo, la);
    dc.fillStyle = `rgba(255,255,255,${.5 + r() * .4})`;
    for (const off of [-MW, 0, MW]) { dc.beginPath(); dc.roundRect(x + off - len / 2, y - w / 2, len, w, w / 2); dc.fill(); }
  }
  // night: r,g = city lights, b = ocean mask
  const night = document.createElement('canvas'); night.width = MW; night.height = MH;
  const nc = night.getContext('2d');
  nc.fillStyle = 'rgb(0,0,255)'; nc.fillRect(0, 0, MW, MH);
  nc.fillStyle = '#000'; for (const k in LAND) { poly(nc, LAND[k]); nc.fill(); } poly(nc, ANT); nc.fill();
  const lpx = lc.getImageData(0, 0, MW, MH).data;
  const okLand = (x, y) => { const i = ((y | 0) * MW + (x | 0)) * 4; return lpx[i + 3] > 200 && !(lpx[i] > 230 && lpx[i + 2] > 230) && !(lpx[i] > 230 && lpx[i + 2] < 120); };
  nc.globalCompositeOperation = 'lighter';
  let placed = 0, guard = 0;
  while (placed < 380 && guard++ < 50000) {
    const cx = r() * MW, cy = (90 - (r() * 105 - 42)) / 180 * MH;

    for (const [w, al] of [[sz(26), .12], [sz(12), .3], [sz(4.5), .95]]) {
      ctx.strokeStyle = `rgba(255,217,138,${al * ringA})`; ctx.lineWidth = w;
      ctx.beginPath(); ctx.arc(sx(NEAR.x), sy(NEAR.y), R, -Math.PI / 2 - Math.PI * ringP, -Math.PI / 2 + Math.PI * ringP); ctx.stroke();
      ctx.beginPath(); ctx.arc(sx(NEAR.x), sy(NEAR.y), R, Math.PI / 2 - Math.PI * ringP, Math.PI / 2 + Math.PI * ringP); ctx.stroke();
    }
    ctx.restore();
  }
  // shockwave and flash on "align" (and its replay)
  const sw = s - (E.align + FLASH_AFTER);
  if (sw > 0 && sw < 1.1 && !rewinding) {
    const p = eoc(sw / 1.05);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(200,245,255,${.85 * (1 - p)})`; ctx.lineWidth = lerp(46, 3, p);
    ctx.beginPath(); ctx.arc(sx(NEAR.x), sy(ny), sz(NEAR.r) + p * 1500, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  // Earth
  const lx = sx(NEAR.x), ly = sy(ny);
  drawSphere(sx(EARTH.x), sy(EARTH.y), sz(EARTH.r), lx, ly, { rot: .35 + t * .55 * Math.PI / 180, tilt: .26, bright: .3 * mag + .5 * win(s, E.photon, E.photon + .4, .05, .5) });
  // planet found by the blip
  const pd = s - E.planet;
  if (pd > -0.01 && !replay) {
    const blipP = blipWorld();
    const oa = t * .45 + 2.2, orb = [NEAR.x + Math.cos(oa) * 205, NEAR.y + Math.sin(oa) * 205 * .55];
    const u = eio(pd / .9);
    const P = [lerp(blipP[0], orb[0], u), lerp(blipP[1], orb[1], u)];
    const pr = sz(22) * spring(pd, .42, 14);
    drawSphere(sx(P[0]), sy(P[1]), pr, lx, ly, { rot: t * .3, tilt: .2, mode: 1 });
  }
  // astronaut
  drawAstronaut(t, s);

  if (!replay) overlays(t, s, z);
  else titleBeat(t, s);

  // brightness flood
  const flood = 1.0 * eoc(prog(s, E.meter, 1.1)) * (1 - eic(prog(s, E.shades + .9, 1.4)));
  if (flood > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(-200, 380, 50, -200, 380, 2100);
    fg.addColorStop(0, `rgba(255,246,220,${.3 * flood})`); fg.addColorStop(1, 'rgba(255,240,210,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  // white flash
  const fl = s - (E.align + FLASH_AFTER);
  if (fl > 0 && fl < .6 && !rewinding) { ctx.fillStyle = `rgba(255,255,255,${.95 * (1 - eoc(fl / .55))})`; ctx.fillRect(0, 0, W, H); }
  if (rewinding) rewindBadge(t);
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .38, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(4,4,20,0)'); vg.addColorStop(1, 'rgba(4,4,20,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function blipWorld() { return [420 + .6 * 860, 330 - 210 * (curveA(.6) + .32)]; }
function curveA(u) { return 1 / Math.sqrt(1 + Math.pow((u - .5) / .1, 2)); }

function overlays(t, s, z) {
  // ruler: 26,000 light years, slams in from 1.7× to 1×
  const rd = s - E.ruler, rEnd = E.dive - .2;
  if (rd > 0 && s < rEnd + .8) {
    const k = 1.7 - .7 * spring(rd, .45, 14);
    const y = sy(318), x0 = sx(FAR.x + 40), x1 = sx(EARTH.x);
    const draw = eoc(rd / .6) * (1 - eic((s - rEnd) / .5));
    ctx.save(); ctx.strokeStyle = 'rgba(255,217,138,.8)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const mid = (x0 + x1) / 2, hw = (x1 - x0) / 2 * draw;
    ctx.beginPath(); ctx.moveTo(mid - hw, y); ctx.lineTo(mid + hw, y); ctx.stroke();
    for (const xx of [mid - hw, mid + hw]) { ctx.beginPath(); ctx.moveTo(xx, y - 16); ctx.lineTo(xx, y + 16); ctx.stroke(); }
    ctx.restore();
    const n = 26000 * eoc(rd / 1.5);
    ctx.save(); ctx.translate(mid, y); ctx.scale(k, k); ctx.translate(-mid, -y);
    caption(mid, y, [{ text: `${fmt(Math.round(n / 100) * 100)} LIGHT YEARS`, color: COL.gold, size: 50, w: measure('26,000 LIGHT YEARS', 50) }], s, E.ruler, rEnd);
    ctx.restore();
  }
  // halfway tag rides the line
  const hd = s - E.halfway;
  if (hd > 0 && s < E.dive + .8) {
    const u = eio(hd / 1.0);
    const wx = lerp(EARTH.x - 220, NEAR.x, u);
    caption(sx(wx), sy(NEAR.y) - sz(NEAR.r) * 1.1 - 70, [{ text: 'HALFWAY', color: COL.teal, size: 36 }], s, E.halfway, E.dive - .1);
  }
  // ring caption
  caption(sx(NEAR.x), sy(NEAR.y) + sz(RING_R) + 80, [{ text: 'A RING OF LIGHT', color: COL.gold, size: 40 }], s, E.ring + .1, lineStart(5) - .1);
  // YOU pin
  const pd = s - E.pin;
  if (pd > 0 && s < E.pullout + 1.2) drawPin(sx(PIN_W[0]), sy(PIN_W[1]), pd, s);
  caption(sx(EARTH.x) - 30, sy(EARTH.y) + sz(EARTH.r) + 70, [{ text: 'TOO SMALL TO SEE', color: COL.teal, size: 36 }], s, E.pin + .25, E.brighten - .05);
  // photon lands on the pin
  const ph = s - (E.photon - .65);
  if (ph > 0 && ph < .8) {
    const [wx, wy] = photonWorld(s);
    photon(sx(wx), sy(wy), 1, -1);
  }
  if (s > E.photon && s < E.photon + .7) ringGlow(sx(PIN_W[0]), sy(PIN_W[1]) - 60, eoc((s - E.photon) / .6) * 90, 1 - (s - E.photon) / .7, 4, '255,240,200');
  caption(sx(EARTH.x) - 40, Math.min(H - 110, sy(EARTH.y + EARTH.r) + 95), [{ text: 'THIS LIGHT LEFT ITS STAR', color: COL.white, size: 38 }, { text: '26,000 YEARS AGO', color: COL.gold, size: 46 }], s, E.photon + .05, E.pullout + .3);
  // pull-out labels riding the sightline and the bent light
  if (s > E.pullout + .9 && s < E.dotted + .2) {
    const u = eio(prog(s, E.pullout + .9, 2.2));
    caption(sx(lerp(EARTH.x - 300, FAR.x + 900, u)), sy(NEAR.y) - 54, [{ text: 'EINSTEIN 1936', color: COL.gold, size: 34 }], s, E.pullout + .9, E.dotted - .1);
    const P = PATHS[1], q = .25 + .5 * u, [bx, by] = bez(P.p0, P.c, P.p2, q);
    caption(sx(bx), sy(by) - 46, [{ text: 'GRAVITY', color: COL.teal, size: 30 }], s, E.pullout + 1.1, E.dotted - .1);
  }
  // dotted circle where an alignment should be
  const dd = s - E.dotted;
  if (dd > 0 && s < E.counter + .4) {
    const cx = sx(NEAR.x), cy = sy(NEAR.y), R = 92 * spring(dd, .45, 14) * (1 - eic((s - E.counter) / .4));
    const fill = eoc(prog(s, E.reveal, .5));
    ctx.save(); ctx.strokeStyle = `rgba(143,216,230,${.9 * (1 - fill)})`; ctx.lineWidth = 4; ctx.setLineDash([3, 14]); ctx.lineCap = 'round';
    ctx.lineDashOffset = -t * 30; ctx.beginPath(); ctx.arc(cx, cy, Math.max(0, R), 0, TAU); ctx.stroke(); ctx.restore();
    if (fill > 0) {
      const pop = spring(s - E.reveal, .42, 14);
      ringGlow(cx, cy, Math.max(0, R * (.6 + .4 * pop)), fill * (1 - eic((s - E.counter) / .4)), 5);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 420);
      const ba = .5 * (1 - eoc((s - E.reveal) / 1.2));
      bg.addColorStop(0, `rgba(255,240,200,${ba})`); bg.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = bg; ctx.fillRect(cx - 420, cy - 420, 840, 840); ctx.restore();
    }
  }
  caption(sx(NEAR.x), sy(NEAR.y) + 170, [{ text: 'NEVER SEEN', color: COL.teal, size: 38 }], s, E.dotted + .1, E.reveal - .05);
  caption(sx(NEAR.x), sy(NEAR.y) + 170, [{ text: 'FIRST SEEN 1993', color: COL.gold, size: 42 }], s, E.reveal + .1, E.counter - .1);
  // live counter and rings popping across the sky
  const cd = s - E.counter;
  if (cd > 0 && s < lineStart(10) + .9) {
    const out = eic(prog(s, lineStart(10), .6));
    for (const c of COUNTER_RINGS) {
      const d = cd - c.d * 2.2; if (d <= 0) continue;
      const R = (16 + 8 * Math.sin(t * 2 + c.x)) * c.s * spring(d, .45, 14) * (1 - out);
      ringGlow(sx(c.x), sy(c.y), Math.max(0, R), .9 * (1 - out), 2.5, c.gold ? '255,217,138' : '143,216,230');
    }
    const n = 3000 * eoc(cd / 2.3);
    caption(W / 2, 150, [{ text: 'ALIGNMENTS SEEN PER YEAR', color: COL.teal, size: 32 }, { text: fmt(n), color: COL.gold, size: 74, w: measure('3,000', 74) + 30 }], s, E.counter, lineStart(10) + .05);
  }
  // brightness meter
  const md = s - E.meter;
  if (md > 0 && s < lineStart(11) + .6) {
    const out = eic(prog(s, lineStart(11) - .05, .45));
    const g = spring(md, .45, 14) * (1 - out);
    const x = 250, y0 = 830, hgt = 560;
    const lv = eoc(md / 1.1);
    const val = Math.pow(1000, lv);
    ctx.save(); ctx.translate(x, y0 - hgt / 2); ctx.scale(g, g); ctx.translate(-x, -(y0 - hgt / 2));
    rr(x - 34, y0 - hgt, 68, hgt, 34, 'rgba(6,20,40,.62)');
    const fh = (hgt - 20) * lv;
    const fgr = ctx.createLinearGradient(0, y0, 0, y0 - hgt); fgr.addColorStop(0, '#ff8f4a'); fgr.addColorStop(1, '#fff7dc');
    ctx.save(); ctx.shadowColor = 'rgba(255,217,138,.8)'; ctx.shadowBlur = 30; rr(x - 24, y0 - 10 - fh, 48, fh, 24, fgr); ctx.restore();
    ctx.restore();
    caption(x + 10, y0 + 80, [{ text: 'BRIGHTNESS', color: COL.teal, size: 28 }], s, E.meter + .05, lineStart(11) - .05);
    caption(x + 10, y0 - hgt - 70, [{ text: '×' + fmt(val), color: COL.gold, size: 52, w: measure('×1,000', 52) + 20 }], s, E.meter + .1, lineStart(11) - .05);
  }
  // light curve with a blip, then the planet
  const cs = lineStart(11);
  if (s > cs && s < E.zoomout + .9) {
    const out = eic(prog(s, E.zoomout, .6));
    const p = eio(prog(s, cs + .1, E.blip - cs + .35));
    const bl = spring(s - E.blip, .42, 15);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [w, a] of [[sz(18), .12], [sz(8), .3], [sz(3.5), 1]]) {
      ctx.strokeStyle = `rgba(255,217,138,${a * (1 - out)})`; ctx.lineWidth = w;
      ctx.beginPath();
      for (let i = 0; i <= 240 * p; i++) {
        const u = i / 240;
        const A = curveA(u) + .32 * bl * Math.exp(-Math.pow((u - .6) / .012, 2));
        const X = sx(420 + u * 860), Y = sy(330 - 210 * A + 210 * .1);
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke();
    }
    ctx.restore();
    caption(sx(850), sy(330) + 70, [{ text: 'BRIGHTNESS OVER WEEKS', color: COL.teal, size: 28 }], s, cs + .2, E.blip - .1);
    caption(sx(blipWorld()[0]) + 150, sy(blipWorld()[1]) + 60, [{ text: 'BLIP', color: COL.gold, size: 36 }], s, E.blip + .1, E.planet - .1);
    caption(sx(NEAR.x), sy(NEAR.y) + sz(RING_R) + 100, [{ text: '200+ PLANETS', color: COL.gold, size: 46 }, { text: 'FOUND THIS WAY', color: COL.white, size: 34 }], s, E.planet + .2, E.zoomout - .05);
  }
  // one in a million
  if (s > E.million - .1) {
    const pr = spring(s - E.million, .45, 14);
    const R = (26 + 5 * Math.sin(t * 4)) * pr;
    ringGlow(sx(NEAR.x), sy(NEAR.y), R, 1, 3.5);
    caption(W / 2, H / 2 + 150, [{ text: '1 IN 1,000,000', color: COL.gold, size: 64 }], s, E.million + .05, RW - .05);
    caption(W / 2, 150, [{ text: 'STARS LINED UP RIGHT NOW', color: COL.teal, size: 32 }], s, E.zoomout + .25, RW - .05);
  }
}

function drawPin(x, y, d, s) {
  const out = eic(prog(s, E.pullout + .2, .5));
  const k = (1 - out);
  const drop = -260 * (1 - spring(d, .45, 14));
  const sq = .18 * wobble(d - .12, 14, .45);
  ctx.save(); ctx.translate(x, y + drop); ctx.scale(k * (1 + sq * .6), k * (1 - sq));
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 4, 18, 6, 0, 0, TAU); ctx.fill();
  const g = ctx.createLinearGradient(0, -130, 0, 0); g.addColorStop(0, '#ff9a8a'); g.addColorStop(1, '#dc5f6e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-18, -32, -54, -58, -54, -92); ctx.arc(0, -92, 54, Math.PI, 0); ctx.bezierCurveTo(54, -58, 18, -32, 0, 0); ctx.fill();
  ctx.font = FONT(700, 34); ctx.letterSpacing = '3px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.fillText('YOU', 2, -90);
  ctx.restore();
}
function photon(x, y, a, dir) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, 60);
  g.addColorStop(0, `rgba(255,255,240,${a})`); g.addColorStop(.25, `rgba(255,217,138,${.6 * a})`); g.addColorStop(1, 'rgba(255,217,138,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 60, y - 60, 120, 120);
  const tg = ctx.createLinearGradient(x, y, x + dir * 320, y);
  tg.addColorStop(0, `rgba(255,230,170,${.7 * a})`); tg.addColorStop(1, 'rgba(255,230,170,0)');
  ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + dir * 320, y - 1); ctx.lineTo(x + dir * 320, y + 1); ctx.lineTo(x, y + 7); ctx.fill();
  ctx.restore();
}
function rewindBadge(t) {
  const p = (t - RW) / RWD;
  const g = Math.sin(Math.PI * clamp(p * 1.4));
  if (g <= 0) return;
  ctx.save(); ctx.translate(W / 2, 130); ctx.scale(g, g);
  rr(-90, -46, 180, 92, 46, 'rgba(6,20,40,.62)');
  ctx.fillStyle = '#ffd98a';
  for (const o of [-34, 6]) { ctx.beginPath(); ctx.moveTo(o + 30, -24); ctx.lineTo(o - 8, 0); ctx.lineTo(o + 30, 24); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function titleBeat(t, s) {
  // a photon tagged with its age crosses toward the lens, then the title
  const flashT = RW + RWD + (E.align + FLASH_AFTER - A0);
  const l0 = lineStart(15) - .1;
  if (t > l0 && t < flashT + .05) {
    const u = eio(prog(t, l0, flashT - l0));
    const x = lerp(-80, sx(NEAR.x), u), y = sy(nearY(s));
    photon(x, y, 1, -1);
    caption(x, y - 90, [{ text: '26,000 YEARS OLD', color: COL.gold, size: 34 }], t, l0 + .05, flashT - .1);
  }
  const td = t - TITLE;
  if (td > -0.2) {
    ctx.save(); ctx.fillStyle = `rgba(4,8,22,${.42 * eoc(prog(t, TITLE - .2, .6))})`; ctx.fillRect(0, 0, W, H); ctx.restore();
    const grow = 1 + .035 * eoc(prog(t, TITLE, 3.2));
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(grow, grow); ctx.translate(-W / 2, -H / 2);
    riseText('WHAT IF STARS COULD', W / 2, H / 2 - 150, 52, COL.teal, t, TITLE - .05, 1e9, { spacing: 6 });
    riseText('ALIGN', W / 2, H / 2 + 30, 270, '#ffffff', t, TITLE + .08, 1e9, { spacing: 36, dur: .8, glow: 'rgba(255,217,138,.45)', glowBlur: 50 });
    ctx.restore();
  }
}

// ---------- grain ----------
const GRAIN = Array.from({ length: 24 }, (_, i) => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256), r = rng(900 + i);
  for (let k = 0; k < im.data.length; k += 4) { const v = 128 + (r() - .5) * 2 * 7.7; im.data[k] = im.data[k + 1] = im.data[k + 2] = v; im.data[k + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
function grain(t) {
  const c = GRAIN[Math.floor(t * 24) % 24];
  const pat = octx.createPattern(c, 'repeat');
  octx.save(); octx.globalCompositeOperation = 'overlay'; octx.fillStyle = pat;
  const r = rng(Math.floor(t * 24) + 1); octx.translate(-r() * 256, -r() * 256);
  octx.fillRect(0, 0, W + 256, H + 256); octx.restore();
}

// ---------- public API ----------
window.TOTAL = TOTAL; window.FPS = FPS;
window.storyTime = storyTime;
// draw frame t; blend 2 subframes (shutter .6) for motion blur
window.seek = (t, blur = true) => {
  if (blur) {
    const off = .6 / FPS * .25;
    draw(Math.max(0, t - off)); octx.globalAlpha = 1; octx.drawImage(scene, 0, 0);
    draw(t + off); octx.globalAlpha = .5; octx.drawImage(scene, 0, 0); octx.globalAlpha = 1;
  } else { draw(t); octx.drawImage(scene, 0, 0); }
  grain(t);
};
window.ready = document.fonts.load(FONT(700, 80) + '').then(() => document.fonts.load(FONT(600, 80))).then(() => { window.seek(0); return true; });
</script>
</body>
</html>

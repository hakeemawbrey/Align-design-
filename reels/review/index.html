<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Align Gradient Reels — Review</title>
<style>
  :root {
    --bg: #0d0b14; --card: #17131f; --line: #2a2438; --text: #f2eefa;
    --dim: #9a8fb0; --ok: #22c55e; --bad: #ef4444; --accent: #b86bff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, "Helvetica Neue", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,11,20,.92);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
           padding: 14px 20px; display: flex; align-items: center; gap: 16px;
           flex-wrap: wrap; }
  header h1 { font-size: 17px; }
  header h1 span { background: linear-gradient(90deg,#ff5fa2,#b86bff,#00c2ff);
                   -webkit-background-clip: text; background-clip: text;
                   -webkit-text-fill-color: transparent; }
  .tabs { display: flex; gap: 6px; }
  .tab { border: 1px solid var(--line); background: none; color: var(--dim);
         padding: 6px 14px; border-radius: 99px; cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .gen { display: flex; gap: 8px; align-items: center; }
  .gen select { background: #100d18; color: var(--text); border: 1px solid var(--line);
                border-radius: 10px; padding: 7px 10px; font-size: 13px; }
  .gen button { background: linear-gradient(90deg,#ff5fa2,#b86bff); color: #fff;
                border: none; border-radius: 10px; padding: 8px 16px;
                font-weight: 700; font-size: 13px; cursor: pointer; }
  .gen button:disabled { opacity: .5; cursor: wait; }
  .gen button.inspo { background: #262033; border: 1px solid var(--line); }
  .chip.mode-inspo { background: #0d9488; }
  .regen { flex: 0 0 auto !important; padding: 10px 14px !important;
           background: #262033 !important; color: var(--dim) !important; }
  .counts { margin-left: auto; color: var(--dim); font-size: 13px; }
  .counts b { color: var(--ok); }
  #grid { display: grid; gap: 18px; padding: 20px; justify-content: center;
          grid-template-columns: repeat(auto-fill, 330px); }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 16px; overflow: hidden; display: flex;
          flex-direction: column; }
  .card.approved { border-color: rgba(34,197,94,.55); }
  .card.rejected { border-color: rgba(239,68,68,.45); opacity: .6; }
  video, .still { width: 100%; aspect-ratio: 9/16; background: #000;
                  display: block; object-fit: cover; }
  .meta { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
          padding: 3px 10px; border-radius: 99px; font-weight: 700; color: #fff; }
  .chip.mode-brainrot { background: #7b2ff7; } .chip.mode-delu { background: #ff5fa2; }
  .chip.mode-nonsense { background: #cc7000; } .chip.mode-spiritual { background: #5b3fb8; }
  .chip.mode-dating { background: #ff2d55; } .chip.mode-random { background: #4b5563; }
  .chip.mode-yapping { background: #ff6a3d; } .chip.mode-short { background: #0072ff; }
  .chip.mode-hater { background: #8b0000; }
  .chip.mode-houston { background: #eb6e1f; }
  .chip.sign { background: #262033; color: var(--dim); }
  .folder { font-size: 11px; color: var(--dim); margin-left: auto; }
  .status-pill { font-size: 11px; font-weight: 700; }
  .status-pill.approved { color: var(--ok); } .status-pill.rejected { color: var(--bad); }
  textarea { width: 100%; min-height: 96px; background: #100d18; color: var(--text);
             border: 1px solid var(--line); border-radius: 10px; padding: 9px;
             font: 13px/1.4 inherit; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
           color: var(--dim); }
  .btns { display: flex; gap: 8px; padding: 0 14px 14px; }
  .btns button { flex: 1; padding: 10px 0; border-radius: 10px; border: none;
                 font-weight: 700; font-size: 14px; cursor: pointer; color: #fff; }
  .approve { background: var(--ok); } .reject { background: #3a2430; color: #ff9caa; }
  .undo { background: #262033; color: var(--dim); }
  .download { background: var(--ok); color: #fff; }
  .btns2 { padding: 0 14px 14px; display: flex; gap: 8px; }
  .btns2 .more { flex: 1; padding: 9px 0; border-radius: 10px; border: 1px
                 solid var(--line); background: none; color: var(--accent);
                 font-weight: 700; font-size: 13px; cursor: pointer; }
  .btns2 .more:disabled { opacity: .5; cursor: wait; }
  #copyAllBtn { border: 1px solid var(--line); background: none; color: var(--text);
                border-radius: 99px; padding: 7px 16px; font-weight: 700;
                font-size: 13px; cursor: pointer; }
  #dlAllBtn { border: none; border-radius: 99px; padding: 7px 16px;
              font-weight: 700; font-size: 13px; cursor: pointer; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--dim); padding: 60px 0; }
  .hint { padding: 0 20px 30px; color: var(--dim); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>✨ <span>Align Gradient Reels</span> review</h1>
  <div class="gen">
    <select id="genMode">
      <option value="brainrot">brainrot</option>
      <option value="delu">delu</option>
      <option value="nonsense">nonsense</option>
      <option value="spiritual">spiritual</option>
      <option value="dating">dating</option>
      <option value="yapping">yapping / oversharing</option>
      <option value="short">short / random blurt</option>
      <option value="hater">hater / shade</option>
      <option value="houston">houston / oddly specific</option>
      <option value="random">random</option>
    </select>
    <select id="genSign">
      <option value="all">all signs</option>
      <option value="aries">aries</option><option value="taurus">taurus</option>
      <option value="gemini">gemini</option><option value="cancer">cancer</option>
      <option value="leo">leo</option><option value="virgo">virgo</option>
      <option value="libra">libra</option><option value="scorpio">scorpio</option>
      <option value="sagittarius">sagittarius</option><option value="capricorn">capricorn</option>
      <option value="aquarius">aquarius</option><option value="pisces">pisces</option>
    </select>
    <button id="genBtn" onclick="generate()">⚡ Generate</button>
    <button id="mixBtn" onclick="mixAll()" title="one fresh post for each of the 12 signs, in this genre">🎲 Mix all 12</button>
    <button id="inspoBtn" class="inspo" onclick="document.getElementById('inspoFile').click()">🖼 Inspo</button>
    <input type="file" id="inspoFile" accept="image/*" hidden onchange="uploadInspo(this)">
  </div>
  <div class="tabs" id="tabs"></div>
  <button id="copyAllBtn" style="display:none" onclick="copyAllApproved(this)">📋 Copy all approved text</button>
  <button id="dlAllBtn" class="download" style="display:none" onclick="downloadAllApproved()">⬇ Download all approved</button>
  <div class="counts" id="counts"></div>
</header>
<div id="grid"></div>
<script>
let reels = [], filter = "pending";
const TABS = ["pending", "approved", "rejected", "all"];

async function load() {
  reels = await (await fetch("/api/reels")).json();
  draw();
}

function draw() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = TABS.map(t =>
    `<button class="tab ${t===filter?"active":""}" onclick="filter='${t}';draw()">${t}</button>`).join("");
  const n = s => reels.filter(r => r.status === s).length;
  document.getElementById("counts").innerHTML =
    `<b>${n("approved")} approved</b> · ${n("pending")} pending · ${n("rejected")} rejected`;
  document.getElementById("dlAllBtn").style.display =
    (filter === "approved" && n("approved") > 0) ? "" : "none";
  document.getElementById("copyAllBtn").style.display =
    (filter === "approved" && n("approved") > 0) ? "" : "none";

  const shown = reels.filter(r => filter === "all" || r.status === filter);
  const grid = document.getElementById("grid");
  if (!shown.length) {
    grid.innerHTML = `<div class="empty">nothing ${filter === "all" ? "here" : filter} —
      render more with <b>python3 render.py --batch 21 --days 7 --cta</b></div>`;
    return;
  }
  grid.innerHTML = shown.map((r, i) => `
    <div class="card ${r.status}" id="card${i}">
      ${r.type === "image"
        ? `<img class="still" src="/video?id=${encodeURIComponent(r.id)}&v=${r.mtime}" loading="lazy">`
        : `<video src="/video?id=${encodeURIComponent(r.id)}&v=${r.mtime}#t=0.1" controls muted loop playsinline preload="auto"></video>`}
      <div class="meta">
        <div class="chips">
          <span class="chip mode-${r.mode}">${r.mode}</span>
          ${r.sign && r.sign !== "all" ? `<span class="chip sign">${r.sign}</span>` : ""}
          ${r.status !== "pending" ? `<span class="status-pill ${r.status}">${r.status.toUpperCase()}</span>` : ""}
          <span class="folder">${r.folder}</span>
        </div>
        <div class="label">IG caption (editable)</div>
        <textarea id="cap${i}">${r.caption}</textarea>
      </div>
      <div class="btns">
        ${r.status === "pending" ? `
          <button class="approve" onclick="decide(${i},'approved')">✓ Approve</button>
          <button class="reject" onclick="decide(${i},'rejected')">✕ Reject</button>
          <button class="regen" onclick="regen(${i}, this)" title="new gradient">🎨</button>`
        : `<button class="undo" onclick="decide(${i},'pending')">↩ Undo</button>
          ${r.status === "approved" ? `<button class="download" onclick="downloadReel(${i})">⬇ Download</button>` : ""}`}
      </div>
      <div class="btns2">
        <button class="more" onclick="copyReelText(${i}, this)" title="copy the words on the gradient">📋 Copy text</button>
        <button class="more" onclick="moreLikeThis(${i}, this)" title="riff on this exact caption, same sign">🔁 More like this</button>
      </div>
    </div>`).join("");
  reels.forEach((r, gi) => { /* indices in shown != reels; fix via map below */ });
  // rebind indices: store shown list globally for decide()
  window._shown = shown;
}

async function generate() {
  const btn = document.getElementById("genBtn");
  const mode = document.getElementById("genMode").value;
  const sign = document.getElementById("genSign").value;
  btn.disabled = true;
  btn.textContent = sign === "all" ? "generating…" : "writing 12 unique captions… (~1 min)";
  try {
    const res = await fetch("/api/generate", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode, sign }) });
    const data = await res.json();
    filter = "pending";
    await load();
    btn.textContent = data.claude ? `✓ ${data.count} unique` : `✓ made ${data.count}`;
  } catch (e) {
    btn.textContent = "error — retry";
  }
  setTimeout(() => { btn.textContent = "⚡ Generate"; btn.disabled = false; }, 3000);
}

async function mixAll() {
  const btn = document.getElementById("mixBtn");
  const mode = document.getElementById("genMode").value;
  btn.disabled = true;
  btn.textContent = "writing one for every sign… (~1 min)";
  try {
    const res = await fetch("/api/mix", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode }) });
    const data = await res.json();
    filter = "pending";
    await load();
    btn.textContent = data.claude ? `✓ ${data.count} signs, all new` : `✓ ${data.count} signs from library`;
  } catch (e) {
    btn.textContent = "error — retry";
  }
  setTimeout(() => { btn.textContent = "🎲 Mix all 12"; btn.disabled = false; }, 3000);
}

async function uploadInspo(input) {
  const file = input.files[0];
  if (!file) return;
  const btn = document.getElementById("inspoBtn");
  const sign = document.getElementById("genSign").value;
  const mode = document.getElementById("genMode").value;
  btn.disabled = true;
  btn.textContent = "studying inspo… (can take a minute)";
  const data = await new Promise(res => {
    const rd = new FileReader();
    rd.onload = () => res(rd.result);
    rd.readAsDataURL(file);
  });
  try {
    const res = await fetch("/api/inspo", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: file.name, data, sign, mode }) });
    const out = await res.json();
    filter = "pending";
    await load();
    btn.textContent = out.claude ? `✓ ${out.count} from inspo` : `✓ ${out.count} (inspo colors)`;
  } catch (e) {
    btn.textContent = "error — retry";
  }
  input.value = "";
  setTimeout(() => { btn.textContent = "🖼 Inspo"; btn.disabled = false; }, 3000);
}

async function regen(i, el) {
  const r = window._shown[i];
  el.textContent = "…";
  el.disabled = true;
  await fetch("/api/regen", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: r.id }) });
  await load();
}

async function moreLikeThis(i, el) {
  const r = window._shown[i];
  el.disabled = true;
  el.textContent = "riffing on this one… (~30-60s)";
  try {
    const res = await fetch("/api/more", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: r.id }) });
    const data = await res.json();
    filter = "pending";
    await load();
    el.textContent = data.claude ? `✓ ${data.count} more added` : `✓ ${data.count} added`;
  } catch (e) {
    el.textContent = "error — retry";
  }
  setTimeout(() => {
    if (el.isConnected) { el.textContent = "🔁 More like this"; el.disabled = false; }
  }, 3000);
}

function downloadReelObj(r) {
  const ext = r.type === "image" ? "png" : "mp4";
  const suffix = r.id.match(/_(\d+)\.(png|mp4)$/)?.[1];
  const name = `${r.mode}_${r.sign}${suffix ? "_" + suffix : ""}.${ext}`;
  const a = document.createElement("a");
  a.href = `/video?id=${encodeURIComponent(r.id)}&dl=1`;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function downloadReel(i) {
  downloadReelObj(window._shown[i]);
}

async function copyToClipboard(text) {
  // navigator.clipboard only works on https or localhost; fall back to a
  // hidden textarea so a dashboard hosted over plain http still copies
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
    return ok;
  }
}

function flash(el, ok, msg) {
  const label = el.textContent;
  el.textContent = ok ? msg : "copy blocked — select it by hand";
  setTimeout(() => { if (el.isConnected) el.textContent = label; }, 1500);
}

async function copyReelText(i, el) {
  const r = window._shown[i];
  if (!r.text) { flash(el, false); return; }
  flash(el, await copyToClipboard(r.text), "✓ copied");
}

async function copyAllApproved(el) {
  // same order as the grid, one post per paragraph
  const texts = reels.filter(r => r.status === "approved" && r.text).map(r => r.text);
  flash(el, await copyToClipboard(texts.join("\n\n")), `✓ copied ${texts.length}`);
}

async function downloadAllApproved() {
  const approved = reels.filter(r => r.status === "approved");
  for (const r of approved) {
    downloadReelObj(r);
    await new Promise(res => setTimeout(res, 250));
  }
}

async function decide(i, status) {
  const r = window._shown[i];
  const caption = document.getElementById("cap" + i).value;
  await fetch("/api/decide", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: r.id, status, caption }) });
  r.status = status; r.caption = caption;
  draw();
}
load();
</script>
</body>
</html>

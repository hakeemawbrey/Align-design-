<style>
/* Layout: a sticky studio bar (what to make) over a queue of 9:16 post cards (what to keep); one post opens full size in a sheet. */
:root {
  --bg: #f6f3fb; --surface: #ffffff; --sunk: #eee9f6; --line: #ddd5ea;

  --ok: #4fd28c; --ok-soft: #173326; --bad: #ff7a8e; --bad-soft: #3a1820;
  --warn-soft: #3a2e12; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);

:root[data-theme="dark"] {
  --bg: #120f19; --surface: #1b1725; --sunk: #241f31; --line: #332c44;
  --fg: #f1ecfa; --dim: #a59bba; --accent: #ff6aa9; --accent-fg: #1a0c14;
  --ok: #4fd28c; --ok-soft: #173326; --bad: #ff7a8e; --bad-soft: #3a1820;
  --warn-soft: #3a2e12; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; margin: 0 auto; }

/* studio bar */
.studio { z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.studio .wrap { padding-block: 14px; display: flex; flex-direction: column; gap: 12px; }
.brandrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font: 800 22px/1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.brand i { font-style: normal; background: linear-gradient(100deg, #ff5fa2, #b86bff 55%, #00c2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sync { font: 500 12px var(--f-mono); color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.sync.cloud::before { background: var(--ok); }
.sync.local::before { background: #d9a400; }
.brandrow .spacer { flex: 1; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label, .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); font-weight: 600; }
select, .custom input { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 38px; }
.custom { display: flex; gap: 8px; min-width: 0; max-width: 720px; }
.custom input { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 8px 14px; min-height: 38px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.claude { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ghost { background: none; }
.btn.small { min-height: 32px; padding: 5px 10px; font-size: 13px; }
.status { font-size: 13px; color: var(--dim); min-height: 1.45em; }
.status.err { color: var(--bad); }
.toggles { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

/* tabs */
.tabsbar .wrap { padding-block: 14px 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tab { border: 1px solid var(--line); background: var(--surface); color: var(--dim); border-radius: 99px; padding: 6px 14px; font-size: 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.tab b { font: 500 12px var(--f-mono); color: var(--dim); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab[aria-selected="true"] b { color: var(--bg); opacity: .7; }
.tabsbar .spacer { flex: 1; }

/* grid */
main .wrap { padding-block: 14px 60px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); min-width: 0; }

.card.rejected { opacity: .62; }
.card.ghost { min-height: 300px; }
.thumbbtn { display: block; padding: 0; border: 0; background: var(--sunk); width: 100%; aspect-ratio: 9/16; max-width: 100%; position: relative; }
.thumbbtn canvas { width: 100%; height: 100%; display: block; }
.thumbbtn .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 13px; }
.cmeta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--dim); }

.chip.st-approved { background: var(--ok-soft); color: var(--ok); }
.chip.st-rejected { background: var(--bad-soft); color: var(--bad); }
.chip.st-posted { background: var(--warn-soft); color: var(--fg); }
.chip.src { margin-left: auto; background: none; padding: 0; text-transform: none; letter-spacing: 0; font-family: var(--f-mono); font-weight: 500; }
.cbtns { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
.cbtns .btn { justify-content: center; min-height: 34px; padding: 5px 8px; font-size: 13px; }
.approve { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.reject { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.empty { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: var(--r); padding: 40px 20px; text-align: center; color: var(--dim); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h2 { font: 700 20px var(--f-display); color: var(--fg); margin: 0; text-wrap: balance; }
.empty p { margin: 0; max-width: 52ch; }

/* plan */
.plan { display: flex; flex-direction: column; gap: 18px; }
.planhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.planhead p { margin: 0; color: var(--dim); flex: 1 1 300px; min-width: 0; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.day h3 { margin: 0; font: 700 17px var(--f-display); display: flex; gap: 10px; align-items: baseline; }
.day h3 span { font: 500 12px var(--f-mono); color: var(--dim); }
.slots { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
.slot { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; min-width: 0; }
.slot canvas { width: 84px; height: 149px; border-radius: 8px; display: block; }
.slot .stext { min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.slot .time { font: 500 12px var(--f-mono); color: var(--accent); }
.slot pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.4 var(--f-body); color: var(--fg); max-height: 6.2em; overflow: hidden; }

/* sheet */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--fg); border-radius: 16px; width: min(1000px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 20px 80px rgba(0,0,0,.35); }
dialog.sheet::backdrop { background: rgba(10,6,18,.6); }
.sheetin { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; padding: 18px; max-height: calc(100dvh - 24px); overflow: auto; }
.bigwrap { position: relative; width: 100%; aspect-ratio: 9/16; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--sunk); align-self: start; }
.bigwrap canvas { width: 100%; height: 100%; display: block; }

.safe .bottom { left: 0; right: 0; bottom: 0; height: 21.9%; display: flex; align-items: flex-end; }
.safe .side { right: 0; top: 40%; bottom: 21.9%; width: 13%; }
.side-panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sheethead { display: flex; gap: 8px; align-items: center; }

#sText { min-height: 90px; font-weight: 600; }
#sCaption { min-height: 130px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; }

.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.kbd { font: 500 11px var(--f-mono); color: var(--dim); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 30; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (min-width: 900px) { .studio { position: sticky; top: env(safe-area-inset-top, 0px); } }
@media (max-width: 720px) {

  .brand { font-size: 19px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<header class="studio">
  <div class="wrap">
    <div class="brandrow">
      <h1 class="brand"><i>Align</i> Gradient Reels</h1>
      <span class="sync" id="sync">connecting…</span>
      <span class="spacer"></span>

        <label><input type="checkbox" id="optCta"> CTA on image</label>
        <label><input type="checkbox" id="optWm"> comealign.com watermark</label>
      </div>

      <div class="field"><label for="genMode">Genre</label><select id="genMode"></select></div>

        <select id="genCount"><option>6</option><option selected>12</option><option>24</option></select></div>
      <button class="btn claude" id="btnClaude" title="Opus 5.5 writes brand-new captions in this genre">✦ Write new with Claude</button>
      <button class="btn" id="btnBank" title="Render lines from the built-in caption library with fresh gradients">From library</button>
      <button class="btn" id="btnInspo" title="Upload a screenshot of a post you like; Claude copies its voice and colors">Copy an inspo post</button>

      <button class="btn ghost" id="btnStop" hidden>Stop</button>
    </div>
    <form class="custom" id="customForm">
      <label class="sr" for="customText">Your own line</label>
      <input id="customText" placeholder="Or type your own line and press Add…" maxlength="400" autocomplete="off">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="status" id="status" role="status"></div>
  </div>
</header>

<nav class="tabsbar" aria-label="Queue">
  <div class="wrap" id="tabs" role="tablist"></div>
</nav>

<main><div class="wrap" id="view"></div></main>

<dialog class="sheet" id="sheet" aria-labelledby="sTitle">
  <div class="sheetin">
    <div class="bigwrap"><canvas id="bigCanvas" width="1080" height="1920"></canvas>
      <div class="safe" id="safe" hidden><div class="top">IG header</div><div class="side"></div><div class="bottom">caption + audio overlay</div></div>
    </div>
    <div class="side-panel">
      <div class="sheethead">
        <h2 id="sTitle">Post</h2>
        <button class="btn small ghost" id="sPrev" aria-label="Previous post">←</button>
        <button class="btn small ghost" id="sNext" aria-label="Next post">→</button>
        <button class="btn small ghost" id="sClose" aria-label="Close">✕</button>
      </div>
      <div class="chips" id="sChips"></div>
      <div class="field"><label for="sText">On-image text</label><textarea id="sText" maxlength="600"></textarea></div>
      <div class="field"><span class="lbl">Gradient</span><div class="swatches" id="sSwatches"></div></div>
      <div class="toggles"><label><input type="checkbox" id="sSafe"> Show Instagram safe zones</label></div>
      <div class="field"><label for="sCaption">Instagram caption (paste this)</label><textarea id="sCaption"></textarea></div>
      <div class="btnrow">
        <button class="btn small" id="sCopyCap">Copy caption</button>
        <button class="btn small" id="sCopyCom">Copy first comment</button>
      </div>
      <div class="btnrow">
        <button class="btn approve" id="sApprove">✓ Approve <span class="kbd">A</span></button>
        <button class="btn reject" id="sReject">✕ Reject <span class="kbd">R</span></button>
        <button class="btn" id="sUndo" hidden>↩ Back to pending</button>
        <button class="btn" id="sPosted" hidden>Mark posted</button>
      </div>
      <div class="btnrow">
        <button class="btn primary" id="sPng">Download PNG</button>
        <button class="btn" id="sVideo">Download animated video</button>
        <button class="btn" id="sMore">✦ More like this</button>
      </div>
      <div class="status" id="sStatus" role="status"></div>
    </div>
  </div>
</dialog>

- A real punchline or a turn at the end; cut every word that isn't doing work.
- Dating, exes, texting, situationships and red flags are the home turf.
- Written like a person posting, not a brand: lowercase unless caps are part of the joke.
- No hashtags, links, emoji, quotes around the whole line, or the word "align".`;

async function streamPosts(prompt, onPost, opts = {}) {
  // ask for one JSON object per line so cards appear as Claude writes them
  let pending = "", made = 0;
  const eat = line => {
    line = line.trim().replace(/^[-*\d.)\s]+(?=\{)/, "").replace(/,$/, "");
    if (!line.startsWith("{")) return;
    try { const o = JSON.parse(line); if (o && typeof o.text === "string" && o.text.trim()) { onPost(o); made++; } } catch {}
  };
  activeCtl = new AbortController();
  $("btnStop").hidden = false;
  try {
    await sampleFn(prompt, {
      model: CLAUDE_MODEL, modelTier: "complex", cache: false, signal: activeCtl.signal, images: opts.images,
      onText: ({ delta }) => { const parts = (pending + delta).split("\n"); pending = parts.pop(); parts.forEach(eat); opts.onProgress?.(made); },
    });
    eat(pending);
    return { made };
  } catch (e) {
    eat(pending);
    throw Object.assign(e || {}, { made });
  } finally {
    $("btnStop").hidden = true; activeCtl = null;
  }
}
const normSign = (s, fallback) => { s = String(s || "").toLowerCase().trim(); return SIGNS.includes(s) || s === "all" ? s : fallback; };

    : `Every post is about ${sign}, and each one takes a different angle on ${sign}.`;
  const used = usedLines(mode);
  const prompt = `${BRIEF}

Genre: ${mode}. Voice: ${MODES[mode].voice}.

Lines from this genre that already did well (match the voice and format, never reuse the joke):
${examplesFor(mode, sign)}
${used ? `\nAlready in the queue, so don't repeat these premises:\n${used}\n` : ""}
Write ${n} new posts. ${target} Every post must be a different joke, not a rephrase of another one. ${mode === "yapping" ? "Each is 250-420 characters." : mode === "short" ? "Each is under 60 characters." : "Each is under 200 characters."}

async function runGeneration(label, prompt, toPost, opts = {}) {
  const btns = ["btnClaude", "btnBank", "btnInspo"].map($);
  btns.forEach(b => b.disabled = true);
  setStatus(label + " First lines usually show up within a minute.");
  filter = "pending"; render();
  try {

function fromLibrary() {

function colorsFromImage(img) {
  // average the top and bottom fifths: that's where a two-tone gradient lives, away from the text
  const c = document.createElement("canvas"); c.width = 30; c.height = 50;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, 30, 50);
  const avg = (y0, y1) => { const d = x.getImageData(0, y0, 30, y1 - y0).data; let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { const lum = d[i] + d[i + 1] + d[i + 2]; if (lum > 720) continue; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    n = n || 1; return "#" + [r, g, b].map(v => Math.round(v / n).toString(16).padStart(2, "0")).join(""); };
  return [avg(0, 10), avg(40, 50)];
}

      draw(ctx, p, { ...opts, t: Math.max(t, 0.0001), ctaFrom: dur - 2 });
      $("sStatus").textContent = `Recording ${Math.min(dur, t).toFixed(1)} / ${dur}s… keep this tab open.`;
      if (t >= dur) res(); else requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  rec.stop(); await done;
  const ext = type.startsWith("video/mp4") ? "mp4" : "webm";
  $("sStatus").textContent = ext === "webm" ? "Saved as WebM, the only video format this browser records. Instagram takes MP4; Safari and recent Chrome record MP4." : "";
  btn.disabled = false;
  await saveFile(`${fileBase(p)}.${ext}`, new Blob(chunks, { type }), type);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch {
    const ta = el("textarea", { value: text }); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove(); toast(ok ? msg : "Copy blocked here. Select the text and copy it yourself.");
  }
}

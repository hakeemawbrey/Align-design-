<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 800; src: url(/font/inter/inter-latin-800-normal.woff2) format('woff2') }
@font-face { font-family: Inter; font-weight: 600; src: url(/font/inter/inter-latin-600-normal.woff2) format('woff2') }
@font-face { font-family: 'EB Garamond'; font-style: italic; font-weight: 500; src: url(/font/eb-garamond/eb-garamond-latin-500-italic.woff2) format('woff2') }
@font-face { font-family: 'Space Mono'; font-weight: 700; src: url(/font/space-mono/space-mono-latin-700-normal.woff2) format('woff2') }
@font-face { font-family: 'Space Mono'; font-weight: 400; src: url(/font/space-mono/space-mono-latin-400-normal.woff2) format('woff2') }
* { margin: 0; box-sizing: border-box }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0820; color: #efe6d6 }
#stage, #stage canvas, .layer { position: absolute; inset: 0 }
.layer { pointer-events: none; display: flex; flex-direction: column; align-items: center; text-align: center }
.eyebrow { font: 700 30px/1 'Space Mono', monospace; letter-spacing: .32em; color: rgba(239,230,214,.7) }
h1 { font: 800 92px/1.02 Inter, sans-serif; letter-spacing: -.035em; margin-top: 28px; text-shadow: 0 6px 40px rgba(0,0,0,.5) }
em { font: italic 500 112px/1 'EB Garamond', serif; letter-spacing: -.01em; color: var(--accent, #ffc23a) }
#intro { padding-top: 250px }
#hud { justify-content: flex-start; padding-top: 250px }
#hud .row { display: flex; gap: 22px; align-items: center }
#round { font: 700 30px/1 'Space Mono', monospace; letter-spacing: .3em; color: rgba(239,230,214,.75) }
#colour { font: 800 120px/1 Inter, sans-serif; letter-spacing: -.03em; margin-top: 26px; text-shadow: 0 0 50px currentColor }
#pips { position: absolute; bottom: 300px; left: 0; right: 0; display: flex; justify-content: center; gap: 26px }
.pip { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(239,230,214,.4) }
.pip.on { background: var(--c); border-color: var(--c) }
.pip.now { border-color: var(--c); box-shadow: 0 0 24px var(--c) }
#hint { position: absolute; bottom: 210px; left: 0; right: 0; font: 400 28px/1 'Space Mono', monospace; letter-spacing: .14em; color: rgba(239,230,214,.6) }
#outro { justify-content: center; padding: 0 80px }
#outro h1 { font-size: 104px; margin-top: 0 }
#outro em { font-size: 128px }
#outro p { font: 600 46px/1.3 Inter, sans-serif; margin-top: 48px; color: rgba(239,230,214,.9) }
#outro .sign { position: absolute; bottom: 220px; font: 400 30px/1 'Space Mono', monospace; letter-spacing: .14em; color: rgba(239,230,214,.6) }
#flash { position: absolute; inset: 0; background: #fff8ec; opacity: 0 }
</style></head>
<body>
<div id="stage"></div>
<div id="hud" class="layer">
  <div id="round"></div><div id="colour"></div>
  <div id="pips"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
  <div id="hint">HOLD TO PAUSE</div>
</div>
<div id="intro" class="layer"><div class="eyebrow" id="eyebrow"></div><h1 id="head"></h1></div>
<div id="outro" class="layer"><h1 id="ohead"></h1><p id="osub"></p><div class="sign" id="sign"></div></div>
<div id="flash"></div>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<script>
const R = window.REEL
const rich = (s) => s.replace(/\s*\|\s*/g, '<br>').replace(/\*(.+?)\*/g, '<em>$1</em>')
document.getElementById('eyebrow').textContent = R.eyebrow
document.getElementById('head').innerHTML = rich(R.head)
document.getElementById('ohead').innerHTML = rich(R.outro_head)
document.getElementById('osub').innerHTML = rich(R.outro_sub)
document.getElementById('sign').textContent = R.signoff
document.getElementById('intro').style.setProperty('--accent', R.rounds[0].color)
document.getElementById('outro').style.setProperty('--accent', R.rounds[R.rounds.length - 1].color)
</script>
<script type="module" src="/scene.js"></script>
</body></html>

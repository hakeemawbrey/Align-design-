<title>Align Founder Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&family=Space+Mono&display=swap">
<style>
/* Layout: a working desk. A ranked list of the source reels down the left,
   the selected reel and its Align version side by side on the right; a
   pipeline board and a filming calendar on their own tabs. One column on
   phones. Dark only, in Align's Stardust tokens, like the Carousel Studio. */
:root {
  --void: #0b0620;
  --canvas: #140a2e;
  --raised: #1e1240;
  --raised-2: #281a4e;
  --line: rgba(179, 166, 196, 0.18);
  --line-2: rgba(179, 166, 196, 0.3);
  --label-1: #efe6d6;
  --label-2: #b3a6c4;
  --label-3: #7d6f94;
  --chrome: linear-gradient(100deg, #f8edff 0%, #fff7ec 38%, #eaf4ff 72%, #ffeff7 100%);
  --chrome-ink: #3a2c4e;
  --gold: #f2c75c;
  --rub: #e8647a;
  --spark: #8fb8ff;
  --align: #f2d58a;
  --good: #7fd6a8;
  --serif: 'EB Garamond', Georgia, serif;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'Space Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--void); color: var(--label-1); }
body {
  margin: 0; font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.mono, .eyebrow { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.16em; font-size: 10px; color: var(--label-3); }
.h-display { font-family: var(--serif); font-style: italic; font-weight: 500; text-wrap: balance; margin: 0; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--void);
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 18px 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand .h-display { font-size: 26px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs button {
  background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 6px 14px;
  color: var(--label-2); font-size: 13px; min-height: 32px;
}
nav.tabs button[aria-selected="true"] { background: var(--chrome); color: var(--chrome-ink); }
nav.tabs .n { font-family: var(--mono); font-size: 10px; margin-left: 6px; opacity: 0.7; }

.btn { background: var(--chrome); color: var(--chrome-ink); border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 13px; min-height: 34px; }
.btn.quiet { background: transparent; color: var(--label-1); border: 1px solid var(--line-2); font-weight: 500; }
.btn.small { padding: 4px 12px; min-height: 30px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: default; }

#status {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: rgba(40, 26, 78, 0.92); border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 16px;
  font-size: 13px; z-index: 20; max-width: calc(100% - 32px); text-align: center;
}
#status.err { border-color: var(--rub); }

/* ---- Board: list + detail ------------------------------------------------ */
.desk { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 20px; padding-top: 16px; }
@media (max-width: 860px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.list-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.list-tools select, .list-tools input { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 32px; }
.list-tools input { flex: 1; min-width: 120px; }
.summary { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; color: var(--label-2); font-size: 12px; }
.summary b { color: var(--label-1); font-variant-numeric: tabular-nums; font-weight: 600; }
ol.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 210px); overflow: auto; padding-right: 4px; }
@media (max-width: 860px) { ol.rank { max-height: 52vh; } }
ol.rank li button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 30px 44px minmax(0, 1fr); gap: 10px; align-items: center;
  background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
}
ol.rank li button[aria-current="true"] { background: var(--raised); border-color: var(--line-2); }
.pos { font-family: var(--mono); font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.dial { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; position: relative; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.dial::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--raised-2) 0); -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%); mask: radial-gradient(circle, transparent 58%, #000 60%); }
.rank .t { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rank .m { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.chip { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--label-2); white-space: nowrap; }
.chip.v { border-color: rgba(127, 214, 168, 0.5); color: var(--good); }
.chip.e { border-color: rgba(242, 199, 92, 0.4); color: var(--align); }
.chip.st-promoted { color: var(--align); border-color: rgba(242, 213, 138, 0.5); }
.chip.st-scheduled { color: var(--spark); border-color: rgba(143, 184, 255, 0.5); }
.chip.st-filmed, .chip.st-posted { color: var(--good); border-color: rgba(127, 214, 168, 0.5); }

.pair { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
@media (max-width: 1180px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--canvas); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
.panel.align { background: linear-gradient(180deg, var(--raised) 0%, var(--canvas) 100%); border-color: var(--line-2); }
.panel h2 { font-size: 24px; margin: 4px 0 10px; }
.panel h3 { margin: 16px 0 6px; }
.quote { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.25; margin: 6px 0 10px; color: var(--label-1); }
.kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; color: var(--label-2); }
.kv dt { color: var(--label-3); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv a { color: var(--spark); }
.bars { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.bar { display: grid; grid-template-columns: 140px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 12px; color: var(--label-2); }
.bar .track { height: 6px; border-radius: 999px; background: var(--raised-2); overflow: hidden; }
.bar .fill { display: block; height: 100%; border-radius: 999px; background: var(--c, var(--spark)); }
.bar .v { font-family: var(--mono); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.scoreline { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.big { font-family: var(--serif); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; color: var(--label-3); }
.basis { font-size: 12px; color: var(--label-3); }
ul.beats-src { margin: 4px 0 0; padding-left: 18px; color: var(--label-2); font-size: 13px; }

/* the editable Align script */
.versions { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
.versions button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--label-2); min-height: 30px; }
.versions button[aria-current="true"] { border-color: var(--align); color: var(--align); }
.versions button .star { color: var(--gold); }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--label-3); }
textarea, .inp { background: rgba(11, 6, 32, 0.55); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; width: 100%; resize: vertical; line-height: 1.4; }
textarea.hook { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.25; }
.beat { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; margin-bottom: 8px; }
.beat .n { font-family: var(--mono); font-size: 11px; color: var(--label-3); padding-top: 9px; }
.beat .sub { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; margin-top: 4px; }
@media (max-width: 560px) { .beat .sub { grid-template-columns: minmax(0, 1fr); } }
.beat .sub textarea { font-size: 12px; color: var(--label-2); }
.remix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 12px; }
@media (max-width: 560px) { .remix { grid-template-columns: minmax(0, 1fr); } }
.remix select { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; min-height: 34px; width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sched { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.sched input { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; min-height: 32px; }
.hint { color: var(--label-3); font-size: 12px; margin: 6px 0 0; }
.warn { color: var(--gold); font-size: 12px; }

/* ---- Pipeline ------------------------------------------------------------ */
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; padding-top: 16px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--canvas); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.col h3 { margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.card .t { font-family: var(--serif); font-style: italic; font-size: 16px; line-height: 1.2; }
.card .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.empty { color: var(--label-3); font-size: 12px; padding: 8px 2px; }

/* ---- Calendar ------------------------------------------------------------ */
.cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 16px; }
.cal-head .h-display { font-size: 28px; margin-right: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.cal .dow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--label-3); text-transform: uppercase; padding: 0 4px; }
.day { min-height: 96px; background: var(--canvas); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day.out { opacity: 0.4; }
.day.today { border-color: var(--align); }
.day .d { font-family: var(--mono); font-size: 11px; color: var(--label-3); }
.day button.ev { text-align: left; background: rgba(143, 184, 255, 0.12); border: 1px solid rgba(143, 184, 255, 0.35); border-radius: 8px; padding: 3px 6px; font-size: 11px; line-height: 1.25; color: var(--label-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day button.ev.filmed { background: rgba(127, 214, 168, 0.12); border-color: rgba(127, 214, 168, 0.4); }
@media (max-width: 640px) { .day { min-height: 64px; } .day button.ev { font-size: 0; height: 8px; padding: 0; } }
.agenda { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.agenda .item { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--canvas); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
@media (max-width: 560px) { .agenda .item { grid-template-columns: minmax(0, 1fr); } }
.agenda .when { font-family: var(--mono); font-size: 11px; color: var(--label-2); }

/* ---- Patterns ------------------------------------------------------------ */
.study { padding-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.study ul { margin: 6px 0 0; padding-left: 18px; color: var(--label-2); }
.study li { margin-bottom: 4px; }

/* ---- Teleprompter ---------------------------------------------------------- */
#prompter { position: fixed; inset: 0; z-index: 30; background: #05020f; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#prompter .bar2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#prompter .bar2 .eyebrow { margin-right: auto; }
#prompter .scroll { flex: 1; overflow: auto; margin-top: 12px; scroll-behavior: auto; }
#prompter .text { font-family: var(--sans); font-weight: 500; font-size: clamp(28px, 5.4vw, 56px); line-height: 1.3; max-width: 26ch; margin: 30vh auto 60vh; color: #efe6d6; }
#prompter .text p { margin: 0 0 0.9em; }
#prompter .text .cue { display: block; font-family: var(--mono); font-size: 0.32em; letter-spacing: 0.12em; color: #7d6f94; text-transform: uppercase; margin-bottom: 0.3em; }
#prompter.mirror .text { transform: scaleX(-1); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="brand"><span class="h-display">Founder Studio</span><span class="mono">align · ceo page</span></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-board" aria-selected="true" data-view="board">Scored reels<span class="n" id="n-src"></span></button>
    <button role="tab" id="tab-pipe" aria-selected="false" data-view="pipe">Pipeline<span class="n" id="n-pipe"></span></button>
    <button role="tab" id="tab-cal" aria-selected="false" data-view="cal">Filming calendar<span class="n" id="n-cal"></span></button>
    <button role="tab" id="tab-study" aria-selected="false" data-view="study">What works</button>
  </nav>
</header>

<main>
  <section id="view-board" class="desk" aria-label="Scored reels">
    <div>
      <div class="summary" id="summary"></div>
      <div class="list-tools">
        <input id="q" type="search" placeholder="Search hooks and topics" aria-label="Search">
        <select id="sort" aria-label="Sort">
          <option value="total">Best overall</option>
          <option value="align">Best Align version</option>
          <option value="proof">Most proven</option>
          <option value="craft">Best written</option>
          <option value="date">Newest</option>
        </select>
      </div>
      <ol class="rank" id="rank"></ol>
    </div>
    <div id="detail"></div>
  </section>

  <section id="view-pipe" hidden aria-label="Pipeline"><div class="board" id="board"></div></section>

  <section id="view-cal" hidden aria-label="Filming calendar">
    <div class="cal-head">
      <span class="h-display" id="cal-title"></span>
      <button class="btn quiet small" id="cal-prev" type="button">Previous</button>
      <button class="btn quiet small" id="cal-next" type="button">Next</button>
      <button class="btn small" id="ics" type="button">Download calendar (.ics)</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="agenda" id="agenda"></div>
  </section>

  <section id="view-study" hidden aria-label="What works"><div class="study" id="study"></div></section>
</main>

<div id="prompter" hidden role="dialog" aria-label="Teleprompter">
  <div class="bar2">
    <span class="eyebrow" id="p-title"></span>
    <button class="btn quiet small" id="p-slower" type="button">Slower</button>
    <button class="btn small" id="p-play" type="button">Start</button>
    <button class="btn quiet small" id="p-faster" type="button">Faster</button>
    <button class="btn quiet small" id="p-mirror" type="button">Mirror</button>
    <button class="btn quiet small" id="p-close" type="button">Close</button>
  </div>
  <div class="scroll" id="p-scroll"><div class="text" id="p-text"></div></div>
</div>
<div id="status" hidden role="status" aria-live="polite"></div>

<script>/*ENGINE*/</script>
<script>
const DATA = /*DATA*/null
const { scoreScript, grade, remix: remixScript } = AlignFounder
const $ = (id) => document.getElementById(id)
function el(tag, attrs = {}, kids = []) {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else n.setAttribute(k, v === true ? '' : v)
  }
  for (const c of [].concat(kids)) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)))
  return n
}
let statusTimer
function setStatus(msg, err = false) {
  const s = $('status'); s.textContent = msg; s.hidden = !msg; s.classList.toggle('err', err)
  clearTimeout(statusTimer); if (msg) statusTimer = setTimeout(() => (s.hidden = true), 3600)
}
const local = {
  get(k, d) { try { const v = localStorage.getItem('founder:' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('founder:' + k, JSON.stringify(v)) } catch {} },
}
const scoreColor = (n) => (n >= 80 ? 'var(--align)' : n >= 65 ? 'var(--spark)' : n >= 50 ? 'var(--label-2)' : 'var(--rub)')
const fmtNum = (n) => (n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n))
const STATUSES = [['draft', 'Draft'], ['promoted', 'Promoted'], ['scheduled', 'Scheduled'], ['filmed', 'Filmed'], ['posted', 'Posted']]
const LIB = DATA.lib
const labelOf = (list, key) => (LIB[list].find((x) => x.key === key) ?? {}).label ?? key

// ---- storage: your takes ---------------------------------------------------
// A "take" is any version you keep: an edit, a remix, a promotion, a filming
// date. The baked-in scripts are never changed; takes sit on top of them. On
// claude.ai they live in the artifact's database (every device, and Claude
// can read them back); anywhere else, in this browser.
let db = null, takesCol = null
let takes = new Map()
function takesFor(sourceId) { return [...takes.values()].filter((t) => t.sourceId === sourceId).sort((a, b) => a.createdAt - b.createdAt) }
async function saveTake(t) {
  t.updatedAt = Date.now()
  takes.set(t.id, t)
  if (takesCol) {
    try { await takesCol.doc(t.id).set(t) }
    catch (e) { setStatus(e?.code === 'not_granted' ? 'You can view this studio but not save to it.' : 'Couldn’t save that take. Try again in a moment.', true); return false }
  } else local.set('takes', [...takes.values()])
  return true
}
async function deleteTake(id) {
  takes.delete(id)
  if (takesCol) { try { await takesCol.doc(id).delete() } catch { setStatus('Couldn’t delete that take.', true) } }
  else local.set('takes', [...takes.values()])
}

// ---- state ------------------------------------------------------------------
const baseById = new Map(DATA.scripts.map((s) => [s.id, s]))
const srcById = new Map(DATA.sources.map((s) => [s.id, s]))
const state = {
  view: 'board',
  sel: local.get('sel', DATA.sources[0]?.id),
  ver: null, // the take id (or base script id) being edited
  draft: null, // the script in the editor
  dirty: false,
  q: '', sort: 'total',
  calMonth: null,
}

function bestFor(sourceId) {
  const own = takesFor(sourceId)
  return own.find((t) => t.promoted) ?? own.at(-1) ?? baseById.get(srcById.get(sourceId)?.alignId)
}

// ---- board ------------------------------------------------------------------
function renderSummary() {
  const s = DATA.sources
  const withNums = s.filter((v) => v.score.proof != null).length
  const avg = Math.round(s.reduce((a, v) => a + v.score.total, 0) / (s.length || 1))
  const promoted = [...takes.values()].filter((t) => t.promoted).length
  const sched = [...takes.values()].filter((t) => t.filmDate).length
  $('summary').replaceChildren(
    el('span', {}, [el('b', {}, s.length), ' reels scored']),
    el('span', {}, [el('b', {}, withNums), ' with public numbers']),
    el('span', {}, ['avg ', el('b', {}, avg)]),
    el('span', {}, [el('b', {}, promoted), ' promoted · ', el('b', {}, sched), ' scheduled']),
  )
  $('n-src').textContent = s.length
}
function sortedSources() {
  const q = state.q.trim().toLowerCase()
  let list = DATA.sources.filter((v) => !q || [v.hook, v.topic, v.caption, v.format].join(' ').toLowerCase().includes(q))
  const key = {
    total: (v) => v.score.total,
    align: (v) => bestFor(v.id)?.score?.total ?? 0,
    proof: (v) => v.score.proof ?? -1,
    craft: (v) => v.score.craft,
    date: (v) => (v.date ? Date.parse(v.date) || 0 : 0),
  }[state.sort]

function newTakeFrom(v, script, extra = {}) {
  const n = takesFor(v.id).length + 1
  return {
    ...structuredClone(script),
    id: `${v.id}-t${Date.now().toString(36)}`,
    sourceId: v.id, parentId: state.ver, label: extra.label ?? `Take ${n}`,
    status: 'draft', promoted: false, filmDate: null, filmTime: null,
    createdAt: Date.now(), ...extra,
  }
}
async function commitDraft(v, extra = {}) {
  const d = state.draft
  d.score = scoreScript(d, { rubric: DATA.rubric, brief: DATA.brief })
  let t = takes.get(state.ver)
  if (t) Object.assign(t, structuredClone(d), extra)
  else t = newTakeFrom(v, d, extra)
  if (!(await saveTake(t))) return null
  state.ver = t.id; state.draft = structuredClone(t); state.dirty = false
  return t
}
async function saveVersion(v) { if (await commitDraft(v)) { setStatus('Version saved.'); refresh() } }
async function promote(v) {
  const cur = takes.get(state.ver)
  if (cur?.promoted) { cur.promoted = false; if (cur.status === 'promoted') cur.status = 'draft'; await saveTake(cur); setStatus('Unpromoted.'); return refresh() }
  // One promoted version per reel: promoting this one demotes the others.
  for (const o of takesFor(v.id)) if (o.promoted) { o.promoted = false; if (o.status === 'promoted') o.status = 'draft'; await saveTake(o) }
  const t = await commitDraft(v, { promoted: true })
  if (!t) return
  if (t.status === 'draft') { t.status = 'promoted'; await saveTake(t) }
  setStatus('Promoted. It leads this reel and shows on the pipeline.'); refresh()
}
async function schedule(v) {
  const date = $('f-date').value, time = $('f-time').value || '10:00'
  if (!date) { setStatus('Pick a filming date first.', true); return }
  const t = await commitDraft(v, { filmDate: date, filmTime: time })
  if (!t) return
  if (t.status === 'draft' || t.status === 'promoted') { t.status = 'scheduled'; await saveTake(t) }
  setStatus(`Scheduled to film ${new Date(date + 'T' + time).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}.`); refresh()
}
async function setTakeStatus(v, status) {
  const t = await commitDraft(v, { status, promoted: status === 'promoted' ? true : takes.get(state.ver)?.promoted ?? false })
  if (t) { setStatus(`Marked ${status}.`); refresh() }
}
let removeArmed = null
async function removeTake(t) {
  if (removeArmed !== t.id) { removeArmed = t.id; setStatus('Click Delete take again to delete it for good.'); setTimeout(() => (removeArmed = null), 4000); return }
  await deleteTake(t.id); removeArmed = null
  openVersion(bestFor(t.sourceId)); setStatus('Take deleted.'); refresh()
}
function doRemix(v, surprise) {
  if (state.dirty && !confirmLeave()) return
  const opts = surprise
    ? { seed: Date.now() }
    : { seed: Date.now(), hookKey: $('rx-hook').value, formatKey: $('rx-format').value, angleKey: $('rx-angle').value }
  const s = remixScript(v, LIB, opts)
  s.score = scoreScript(s, { rubric: DATA.rubric, brief: DATA.brief })
  const t = newTakeFrom(v, s, { label: `Remix ${takesFor(v.id).length + 1}` })
  state.ver = t.id; state.draft = structuredClone(t); state.dirty = true
  // Not saved until you press Save version: remix freely.
  takes.set(t.id, t)
  renderDetail(); setStatus('Remixed. Save version to keep it.')
  takes.delete(t.id)
}
function scriptText(d) {
  return [`HOOK: ${d.hook}`, ...d.beats.map((b, i) => `${i + 1}. ${b.line}${b.broll ? `\n   [b-roll: ${b.broll}]` : ''}${b.onScreen ? `\n   [on screen: ${b.onScreen}]` : ''}`), `CTA: ${d.cta}`, '', d.caption, (d.hashtags ?? []).map((h) => '#' + h).join(' ')].join('\n')
}

  ctl = new AbortController()

    'Voice rules: ' + DATA.brief.voice.join(' '),

    'Reference reel (another founder): hook "' + v.hook + '"; format ' + (v.format || '') + '; topic ' + (v.topic || '') + '.',
    'Current Align script as JSON: ' + JSON.stringify({ hook: d.hook, beats: d.beats, cta: d.cta, caption: d.caption, hashtags: d.hashtags }),

    const t = newTakeFrom(v, s, { label: `Claude ${takesFor(v.id).length + 1}` })

function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
function renderCal() {
  const sched = [...takes.values()].filter((t) => t.filmDate)
  $('n-cal').textContent = sched.length || ''
  const today = new Date()
  const m = state.calMonth ?? new Date(today.getFullYear(), today.getMonth(), 1)
  state.calMonth = m
  $('cal-title').textContent = m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })
  const cal = $('cal'); cal.replaceChildren()
  for (const d of ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']) cal.append(el('div', { class: 'dow' }, d))
  const start = new Date(m); start.setDate(1 - ((m.getDay() + 6) % 7))
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i)
    const key = ymd(d)
    const evs = sched.filter((t) => t.filmDate === key).sort((a, b) => (a.filmTime ?? '').localeCompare(b.filmTime ?? ''))
    cal.append(el('div', { class: 'day' + (d.getMonth() !== m.getMonth() ? ' out' : '') + (key === ymd(today) ? ' today' : '') }, [
      el('span', { class: 'd' }, d.getDate()),
      ...evs.map((t) => el('button', { type: 'button', class: 'ev' + (t.status === 'filmed' || t.status === 'posted' ? ' filmed' : ''), title: t.hook, onclick: () => { show('board'); state.sel = t.sourceId; openVersion(t); renderRank(); renderDetail() } }, `${t.filmTime ?? ''} ${t.hook}`)),
    ]))
    if (i >= 34 && d.getMonth() !== m.getMonth() && d.getDay() === 0) break
  }
  const upcoming = sched.filter((t) => t.filmDate >= ymd(today)).sort((a, b) => (a.filmDate + a.filmTime).localeCompare(b.filmDate + b.filmTime))
  $('agenda').replaceChildren(
    el('div', { class: 'eyebrow' }, upcoming.length ? 'Up next to film' : 'Nothing scheduled yet. Open a reel, pick a date under Film on, and press Schedule.'),
    ...upcoming.map((t) => el('div', { class: 'item' }, [
      el('span', { class: 'when' }, new Date(t.filmDate + 'T' + (t.filmTime || '10:00')).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })),
      el('span', {}, [el('span', { class: 'h-display', style: 'font-size:17px' }, t.hook), el('br'), el('span', { class: 'hint' }, `${labelOf('formats', t.formatKey)} · ~${t.lengthSec}s · ${t.beats.length} beats`)]),
      el('button', { class: 'btn quiet small', type: 'button', onclick: () => openPrompter(t) }, 'Teleprompter'),
    ])),
  )
}
function icsText() {
  const esc = (s) => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, (c) => '\\' + c)
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '')
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Align//Founder Studio//EN', 'CALSCALE:GREGORIAN']
  for (const t of [...takes.values()].filter((x) => x.filmDate)) {
    const [h, mi] = (t.filmTime || '10:00').split(':')
    const s = t.filmDate.replace(/-/g, '') + 'T' + h.padStart(2, '0') + mi.padStart(2, '0') + '00'
    const endMin = Number(h) * 60 + Number(mi) + 45
    const e = t.filmDate.replace(/-/g, '') + 'T' + String(Math.floor(endMin / 60) % 24).padStart(2, '0') + String(endMin % 60).padStart(2, '0') + '00'
    lines.push('BEGIN:VEVENT', `UID:${t.id}@align-founder-studio`, `DTSTAMP:${stamp}`, `DTSTART:${s}`, `DTEND:${e}`,
      `SUMMARY:${esc('Film: ' + t.hook)}`, `DESCRIPTION:${esc(scriptText(t))}`, 'END:VEVENT')
  }
  lines.push('END:VCALENDAR')
  return lines.join('\r\n')
}
$('ics').addEventListener('click', async () => {
  if (![...takes.values()].some((t) => t.filmDate)) { setStatus('Schedule a take first.', true); return }
  if (!downloads) { setStatus('Downloading needs the studio open on claude.ai.', true); return }
  try { await downloads.save({ filename: 'align-filming.ics', data: new Blob([icsText()], { type: 'text/calendar' }) }); setStatus('Saved align-filming.ics. Open it to add the shoots to your calendar.') }
  catch (e) { setStatus(e?.code === 'declined' ? 'Save cancelled.' : 'Couldn’t save the file here.', e?.code !== 'declined') }
})
$('cal-prev').addEventListener('click', () => { const m = state.calMonth; state.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); renderCal() })
$('cal-next').addEventListener('click', () => { const m = state.calMonth; state.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); renderCal() })

// ---- what works ---------------------------------------------------------------
function renderStudy() {
  const P = DATA.patterns
  const box = $('study'); box.replaceChildren()
  const top = DATA.sources.slice().sort((a, b) => b.score.total - a.score.total).slice(0, 5)
  const byHook = Object.entries(DATA.sources.reduce((acc, v) => { (acc[v.hookKey] ??= []).push(v.score.total); return acc }, {}))
    .map(([k, arr]) => [k, Math.round(arr.reduce((a, b) => a + b, 0) / arr.length), arr.length]).sort((a, b) => b[1] - a[1])
  const panel = (eyebrow, title, kids) => el('div', { class: 'panel' }, [el('div', { class: 'eyebrow' }, eyebrow), el('h2', { class: 'h-display' }, title), ...kids])
  box.append(
    panel('Her playbook', 'What her reels do', [el('ul', {}, (P.summary ?? []).map((s) => el('li', {}, s)))]),
    panel('By hook type', 'Average score', [el('div', { class: 'bars' }, byHook.map(([k, avg, n]) => el('div', { class: 'bar' }, [el('span', {}, `${labelOf('hooks', k)} (${n})`), el('span', { class: 'track' }, el('span', { class: 'fill', style: `width:${avg}%;--c:${scoreColor(avg)}` })), el('span', { class: 'v' }, avg)])))]),
    panel('Top five', 'Highest scoring', [el('ul', {}, top.map((v) => el('li', {}, [el('button', { type: 'button', class: 'btn quiet small', style: 'margin-right:6px', onclick: () => { show('board'); select(v.id) } }, v.score.total), v.hook])))]),
    panel('For Align', 'How to carry it over', [el('ul', {}, (P.forAlign ?? []).map((s) => el('li', {}, s)))]),
    panel('The rubric', 'How a reel is scored', [el('ul', {}, DATA.rubric.dimensions.map((d) => el('li', {}, [el('b', {}, `${d.label} (${d.weight})`), ' ', d.description])))]),
  )
}

// ---- teleprompter ---------------------------------------------------------------
let pTimer = null, pSpeed = local.get('speed', 1.4)
function openPrompter(d) {
  $('p-title').textContent = `${d.title} · ~${d.lengthSec}s`
  const parts = [['Hook', d.hook], ...d.beats.map((b, i) => [b.broll ? `${i + 1} · cut to ${b.broll}` : String(i + 1), b.line]), ['CTA', d.cta]]
  $('p-text').replaceChildren(...parts.map(([cue, line]) => el('p', {}, [el('span', { class: 'cue' }, cue), line])))
  $('prompter').hidden = false; $('p-scroll').scrollTop = 0
  navigator.wakeLock?.request?.('screen').catch(() => {})
}
function stopPrompter() { clearInterval(pTimer); pTimer = null; $('p-play').textContent = 'Start' }
$('p-play').addEventListener('click', () => {
  if (pTimer) return stopPrompter()
  $('p-play').textContent = 'Pause'
  pTimer = setInterval(() => { $('p-scroll').scrollTop += pSpeed }, 16)
})
$('p-slower').addEventListener('click', () => { pSpeed = Math.max(0.4, pSpeed - 0.3); local.set('speed', pSpeed) })
$('p-faster').addEventListener('click', () => { pSpeed = Math.min(6, pSpeed + 0.3); local.set('speed', pSpeed) })
$('p-mirror').addEventListener('click', () => $('prompter').classList.toggle('mirror'))
$('p-close').addEventListener('click', () => { stopPrompter(); $('prompter').hidden = true })
document.addEventListener('keydown', (e) => {
  if ($('prompter').hidden) return
  if (e.key === 'Escape') $('p-close').click()
  if (e.key === ' ') { e.preventDefault(); $('p-play').click() }
})

// ---- views ---------------------------------------------------------------
const VIEWS = ['board', 'pipe', 'cal', 'study']
function show(view) {
  state.view = view; local.set('view', view)
  for (const v of VIEWS) { $('view-' + v).hidden = v !== view; $('tab-' + v).setAttribute('aria-selected', String(v === view)) }
  if (view === 'pipe') renderBoard()
  if (view === 'cal') renderCal()
  if (view === 'study') renderStudy()
}
document.querySelectorAll('nav.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.view)))
function refresh() {
  renderSummary(); renderRank(); renderDetail()
  renderBoard(); renderCal()
}
$('q').addEventListener('input', (e) => { state.q = e.target.value; renderRank() })
$('sort').addEventListener('change', (e) => { state.sort = e.target.value; renderRank() })

// ---- start ---------------------------------------------------------------
for (const t of local.get('takes', [])) takes.set(t.id, t)
if (!srcById.has(state.sel)) state.sel = sortedSources()[0]?.id
openVersion(bestFor(state.sel))
refresh()
const hashView = location.hash.slice(1)
show(VIEWS.includes(hashView) ? hashView : local.get('view', 'board'))

if (window.claude?.use) {
  claude.use('db').then((d) => {
    if (!d) return
    db = d; takesCol = db.collection('takes')
    takesCol.onSnapshot((snap) => {
      const next = new Map()
      for (const doc of snap.docs) next.set(doc.id, doc.data())
      // Keep an unsaved remix in the editor; everything else follows the store.
      takes = next
      if (!state.dirty) { const cur = takes.get(state.ver); openVersion(cur ?? bestFor(state.sel)) }
      renderSummary(); renderRank(); if (!state.dirty) renderDetail()
      renderBoard(); renderCal()
    }, () => setStatus('Lost the connection to your saved takes. Reload to reconnect.', true))
  })
  claude.use('sample').then((s) => { sample = s; const b = $('ai-btn'); if (b && s) b.hidden = false })
  claude.use('downloads').then((d) => { downloads = d })
}
</script>

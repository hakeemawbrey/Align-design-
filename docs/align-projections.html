<style>

/* timeline */

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><b>Align</b><span>5-year projections · Y1 = <span id="y1lab">2027</span></span></div>
      <div class="seg" role="group" aria-label="Scenario" id="scen">
        <button data-scen="conservative">Conservative</button><button data-scen="base">Base</button><button data-scen="aggressive">Aggressive</button>
      </div>
      <a class="goalchip" id="goalchip" href="#assumptions" title="Your Y5 user goal"></a>

      <a href="#overview">Overview</a><a href="#plan">Launch plan</a><a href="#cities">Cities</a><a href="#revenue">Revenue</a><a href="#costs">Costs</a><a href="#unit">Unit economics</a><a href="#raise">Raise</a><a href="#goals">Work backwards</a><a href="#assumptions">Assumptions</a>

<script>
/*ENGINE-START*/
const N = 60;
const SCEN = { conservative: 0.6, base: 1, aggressive: 1.5 };
const SCEN_CHURN = { conservative: 1.25, base: 1, aggressive: 0.75 };
const REV_CATS = ['Subscriptions', 'Beta passes', 'Dates & events', 'Venue partners', 'Cards & products', 'Marketplace', 'IP & licensing'];
const COST_CATS = ['COGS', 'Team', 'Infrastructure', 'Marketing', 'Ops', 'G&A'];

function mIdx(s, start) {
  if (!s || typeof s !== 'string' || s.length < 7) return Infinity;
  const y = +s.slice(0, 4), m = +s.slice(5, 7), y0 = +start.slice(0, 4), m0 = +start.slice(5, 7);
  if (!y || !m) return Infinity;
  return (y - y0) * 12 + (m - m0);
}
function mStr(i, start) {
  const y0 = +start.slice(0, 4), m0 = +start.slice(5, 7) - 1;
  const tot = y0 * 12 + m0 + i; const y = Math.floor(tot / 12), m = tot % 12 + 1;
  return y + '-' + String(m).padStart(2, '0');
}
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mLabel(i, start) { const s = mStr(i, start); return MN[+s.slice(5) - 1] + ' ' + s.slice(2, 4); }
function stepAt(steps, t, start) {
  let v = 0, best = -Infinity;
  for (const s of steps || []) { const k = mIdx(s.from, start); if (k <= t && k >= best) { best = k; v = +s.amt || 0; } }
  return v;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const zeros = () => new Array(N).fill(0);
const nC = x => Math.max(1, Math.round(+x.c.cities || 1));
function arppuOf(P) {
  const reg = P.annualShare * (P.annual / 12) + (1 - P.annualShare) * P.monthly;
  const intro = P.annualShare * (P.introAnnual / 12) + (1 - P.annualShare) * P.introMonthly;
  return P.introShare * intro + (1 - P.introShare) * reg;
}

function run(S, o = {}) {
  const st = S.meta.startMonth;
  const sx = o.signupX ?? 1, cx = o.convX ?? 1, chx = o.churnX ?? 1, scope = o.cityId || null;
  const scen = SCEN[S.meta.scenario] ?? 1;
  const scenCh = SCEN_CHURN[S.meta.scenario] ?? 1;
  const P = S.pricing, G = S.growth;
  const arppu = arppuOf(P);
  const fee = P.feePct;
  const F = Math.max(0, Math.round(G.betaFreeMonths));
  const ms = (S.milestones || []).map(m => ({ ...m, t: mIdx(m.date, st) }));

  const C = S.markets.map(c => {
    const l = mIdx(c.launch, st); let b = mIdx(c.betaStart, st); if (b > l) b = l;
    return { c, b, l, free: 0, pay: 0, cum: 0, cohorts: [],
      signups: zeros(), free_: zeros(), pay_: zeros(), comp_: zeros(), mau: zeros(), newPay: zeros(),
      rev: zeros(), subRev: zeros(), varCost: zeros(), budget: zeros(), phase: new Array(N).fill('pre'), compExpired: zeros(), betaConverted: zeros() };
  });

  const R = {
    N, start: st, arppu,
    rev: Object.fromEntries(REV_CATS.map(k => [k, zeros()])),
    cost: Object.fromEntries(COST_CATS.map(k => [k, zeros()])),
    streamRev: {}, costLine: {},
    revenue: zeros(), cogs: zeros(), gross: zeros(), opex: zeros(), totalCost: zeros(), ebitda: zeros(), cash: zeros(), funding: zeros(),
    mau: zeros(), pay: zeros(), free: zeros(), comp: zeros(), signups: zeros(), newPay: zeros(), activeCities: zeros(), liveCities: zeros(),
    unitMau: zeros(), unitMember: zeros(), unitPayer: zeros(), mktg: zeros(), betaCash: zeros(), betaList: zeros(), betaConverted: zeros(),
    oneTimeRev: zeros(), subPayerMonths: zeros(), liveByRegion: {}, cities: C,
  };

  let betaCount = 0; const fee1 = +G.betaFee1 || 0, feeN = +G.betaFeeN || 0, feeCap = +G.betaFeeCount || 0;
  R.betaPassRev = zeros(); R.betaJoins = zeros();
  for (let t = 0; t < N; t++) {
    const active = C.filter(x => t >= x.b);
    for (const x of C) {
      const c = x.c;
      if (t < x.b) continue;
      const inBeta = t < x.l;
      x.phase[t] = inBeta ? 'beta' : 'live';
      const mult = scen * (!scope || scope === c.id ? sx : 1);
      const base = inBeta ? (+c.betaSignups || 0) * Math.pow(1 + (+c.betaGrowth || 0), t - x.b)
                          : (+c.launchSignups || 0) * Math.pow(1 + (+c.growth || 0), t - x.l);
      const cap = Math.max(1, (+c.tam || 1) * (G.maxActive ?? 0.3));
      const sat = Math.max(0, 1 - (t ? x.mau[t - 1] : 0) / cap);
      let bump = 0, lift = 0, dChurn = 0;
      for (const m of ms) {
        const hit = m.city === c.id || m.city === 'all' || !m.city;
        if (!hit) continue;
        if (m.t === t) bump += (+m.signups || 0) / (m.city === c.id ? 1 : Math.max(1, active.length));
        if (t >= m.t) { lift += (+m.convLift || 0) / 100; dChurn += (+m.churnDelta || 0) / 100; }
      }
      let s = (base * mult + bump) * sat;
      const bcap = +c.betaCap || 0;
      if (inBeta && bcap > 0) { const room = Math.max(0, bcap - (x.betaCum || 0)); if (s > room) { x.wait = (x.wait || 0) + (s - room); s = room; } x.betaCum = (x.betaCum || 0) + s; }
      if (t === x.l && x.wait) { s += x.wait; x.waitJoined = x.wait; x.wait = 0; }
      x.cum += s; x.signups[t] = s;
      const cvx = +c.convX || 1; const conv = clamp((G.conv + lift) * cx * cvx, 0, 0.95);
      const paidChurn = clamp((G.paidChurn * scenCh + dChurn) * chx, 0.003, 1);
      // beta comp cohorts
      let expired = 0;
      for (const k of x.cohorts) { k.n *= (1 - G.betaChurn); k.age++; }
      x.cohorts = x.cohorts.filter(k => { if (k.age >= F) { expired += k.n; return false; } return true; });
      let newPay = 0, newFree = 0;
      if (inBeta) { const n1 = Math.min(s, Math.max(0, feeCap - betaCount)); const pr = (n1 * fee1 + (s - n1) * feeN) * (+c.priceX || 1); betaCount += s; x.betaPass = (x.betaPass || zeros()); x.betaPass[t] = pr; x.rev[t] += pr; R.betaPassRev[t] += pr; R.betaJoins[t] += s; }
      if (inBeta && F > 0) x.cohorts.push({ age: 0, n: s });
      else if (inBeta) newFree = s;
      else { newPay = s * conv; newFree = s * (1 - conv); }
      const f2p = inBeta ? 0 : x.free * G.freeToPaid * cx * cvx;
      const fromBeta = expired * Math.min(0.95, G.betaConv * cvx);
      x.pay = x.pay * (1 - paidChurn) + newPay + f2p + fromBeta;
      x.free = Math.max(0, x.free * (1 - G.freeChurn) - f2p + newFree + expired - fromBeta);
      const comp = x.cohorts.reduce((a, k) => a + k.n, 0);
      x.pay_[t] = x.pay; x.free_[t] = x.free; x.comp_[t] = comp; x.mau[t] = x.pay + x.free + comp;
      x.newPay[t] = newPay + f2p + fromBeta; x.compExpired[t] = expired; x.betaConverted[t] = fromBeta;
      x.subRev[t] = x.pay * arppu * (+c.priceX || 1); x.rev[t] += x.subRev[t];
      if (t === x.b) x.budget[t] += +c.betaBudget || 0;
      if (t === x.l) x.budget[t] += +c.launchBudget || 0;
    }
    // totals for drivers
    let mau = 0, pay = 0, free = 0, comp = 0, sg = 0, np = 0, act = 0, live = 0, subRev = 0, budgets = 0;
    for (const x of C) {
      mau += x.mau[t]; pay += x.pay_[t]; free += x.free_[t]; comp += x.comp_[t]; sg += x.signups[t]; np += x.newPay[t];
      if (t >= x.b) act += nC(x); if (t >= x.l) { live += nC(x); const rg = x.c.region || 'Other'; (R.liveByRegion[rg] ||= zeros())[t] += nC(x); } subRev += x.subRev[t]; budgets += x.budget[t];

/* ---------- charts ---------- */
const tip = document.getElementById('tip');
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

  for (let k = 0; k <= 5; k++) { const xx = L + k * iw / 5; g += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T + ih}" stroke-dasharray="2 4"/>`; if (k < 5) g += `<text x="${xx + iw / 10}" y="${H - 8}" text-anchor="middle">Y${k + 1} · ${+S.meta.startMonth.slice(0, 4) + k}</text>`; }
  g += '</g>';

  } else {
    if (ymin < 0) marks += `<line x1="${L}" x2="${W - Rr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>`;
    for (const s of series) {

      if (s.area && !o.log) { marks += `<path d="M${x(0)},${y(Math.max(ymin, 0))}${d.replace(/^M/, 'L')}L${x(n - 1)},${y(Math.max(ymin, 0))}Z" fill="${s.color}" fill-opacity=".12"/>`; }
      marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" ${s.dash ? 'stroke-dasharray="4 4"' : ''} stroke-linejoin="round"/>`;

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'chart')}">${g}${marks}<line class="cross" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--ink)" stroke-opacity=".35" visibility="hidden"/><rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg>` +
    (o.legend === false ? '' : `<div class="legend">${series.filter(s => s.values.some(v => v)).map(s => `<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`);
  const svg = el.querySelector('svg'), cross = svg.querySelector('.cross');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W;

    tip.innerHTML = `<b>${ML(i)}</b> <span class="muted small">${yearOf(i)}</span>${rows || '<div class="muted">Nothing yet</div>'}${tot}`;
    tip.hidden = false;

  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
}

/* ---------- derived helpers ---------- */
const sumR = (a, s, e) => a.slice(s, e).reduce((p, v) => p + v, 0);

const decT = y => y * 12 + 11;
function cityAnnual(x, key) { return [0, 1, 2, 3, 4].map(y => sumR(x[key], y * 12, y * 12 + 12)); }

function nationalRev() { return R.revenue.map((v, i) => v - R.cities.reduce((a, x) => a + x.rev[i], 0)); }
function revSeries() {
  if (ui.revBy === 'stream') return REV_CATS.map((k, i) => ({ name: k, color: SER[i], values: R.rev[k] }));
  const nat = { name: 'National (retail, licensing, one-offs)', color: 'var(--s9)', values: nationalRev() };
  if (ui.revBy === 'region') { const rg = regions(); return Object.entries(rg).map(([k, xs], i) => ({ name: k, color: SER[i], values: Array.from({ length: N }, (_, t) => xs.reduce((a, x) => a + x.rev[t], 0)) })).concat([nat]); }

}
function unitStats(y) {

    um, up, free: avg(R.unitMau), member: avg(R.unitMember), payer: unitPayer,
    loaded: sumR(R.totalCost, s, e) / um, loadedNoMk: (sumR(R.totalCost, s, e) - sumR(R.mktg, s, e)) / um,

}

const per = v => ({ day: v / 30.42, week: v * 7 / 30.42, month: v, year: v * 12 });

/* ---------- Y5 user goal ---------- */
const goalUsers = () => +S.meta.targetUsers || 0;

  const v = baseRun().mau[N - 1]; const ok = Math.abs(v / g - 1) < 0.02; el.hidden = false; el.dataset.ok = ok ? '1' : '0';
  el.innerHTML = `<i></i>Y5 goal <b>${num(g)}</b> active · Base <b>${num(v)}</b>`;

  const val = f => run(S, { signupX: f }).mau[N - 1];
  let lo = 0.05, hi = 20; if (val(hi) < g) { S.meta.scenario = sc; return { err: true }; }

/* ---------- goal solving ---------- */
const METRICS = { pay: 'Paying members', mau: 'Active users', mrr: 'Monthly revenue (MRR)', arr: 'Annual run-rate (ARR)', subMrr: 'Subscription MRR', yrev: 'Revenue for that year', signups: 'Signups that month' };
const LEVERS = { signups: 'More signups (scale signup inputs)', conv: 'Better conversion to paid', churn: 'Lower paid churn' };
function metricVal(r, g) {
  const t = mIdx(g.month, S.meta.startMonth); const city = g.scope !== 'all' ? r.cities.find(x => x.c.id === g.scope) : null;
  switch (g.metric) {
    case 'pay': return city ? city.pay_[t] : r.pay[t];
    case 'mau': return city ? city.mau[t] : r.mau[t];
    case 'mrr': return city ? city.rev[t] : r.revenue[t];
    case 'arr': return (city ? city.rev[t] : r.revenue[t]) * 12;
    case 'subMrr': return city ? city.subRev[t] : r.rev['Subscriptions'][t];
    case 'signups': return city ? city.signups[t] : r.signups[t];
    case 'yrev': { const y = Math.floor(t / 12); return city ? sumR(city.rev, y * 12, y * 12 + 12) : r.years[y].revenue; }
  }
}
function solveGoal() {
  const g = ui.goal; const t = mIdx(g.month, S.meta.startMonth);
  if (!(t >= 0 && t < N)) { ui.goalResult = { err: 'Pick a month inside the 5 years.' }; return; }
  const sc = g.scope !== 'all' ? g.scope : null;
  const mk = f => g.lever === 'signups' ? { signupX: f, cityId: sc } : g.lever === 'conv' ? { convX: f } : { churnX: 1 / f };
  const val = f => metricVal(run(S, mk(f)), g);
  const base = val(1); const target = +g.value;
  let lo = 0.02, hi = g.lever === 'signups' ? 200 : g.lever === 'conv' ? 15 : 12;
  if (val(hi) < target) { ui.goalResult = { base, target, f: null, err: `Even ${hi}× on this lever doesn’t reach it by ${ML(t)}. Try a later month, a bigger lever, or pull a launch date earlier.` }; return; }
  if (val(lo) > target) { ui.goalResult = { base, target, f: lo, t }; }
  for (let k = 0; k < 50; k++) { const m = Math.sqrt(lo * hi); if (val(m) >= target) hi = m; else lo = m; }

  const pick = (r, c, k, kc) => c ? c[kc][t] : r[k][t];
  ui.goalResult = { base, target, f, t, lever: g.lever,
    rows: [
      ['Signups that month', pick(r0, city0, 'signups', 'signups'), pick(r1, city1, 'signups', 'signups'), num],
      ['Signups per day', pick(r0, city0, 'signups', 'signups') / 30.42, pick(r1, city1, 'signups', 'signups') / 30.42, num],
      ['Active users', pick(r0, city0, 'mau', 'mau'), pick(r1, city1, 'mau', 'mau'), num],
      ['Paying members', pick(r0, city0, 'pay', 'pay_'), pick(r1, city1, 'pay', 'pay_'), num],
      ['Monthly revenue', pick(r0, city0, 'revenue', 'rev'), pick(r1, city1, 'revenue', 'rev'), money],
      ['Marketing spend that month (all cities)', r0.mktg[t], r1.mktg[t], money],
      ['Marketing spend to date (all cities)', sumR(r0.mktg, 0, t + 1), sumR(r1.mktg, 0, t + 1), money],

}
function applyGoal() {
  const g = ui.goal, r = ui.goalResult; if (!r?.f) return;
  if (r.lever === 'signups') { for (const c of S.markets) if (g.scope === 'all' || c.id === g.scope) { c.betaSignups = Math.round(c.betaSignups * r.f); c.launchSignups = Math.round(c.launchSignups * r.f); } }
  else if (r.lever === 'conv') { S.growth.conv = +(S.growth.conv * r.f).toFixed(4); S.growth.freeToPaid = +(S.growth.freeToPaid * r.f).toFixed(4); }

}

TABS.goals = {
  html: () => { const g = ui.goal; return `
  <div style="display:grid;gap:6px"><h1>Work backwards</h1><p class="lede">Set a goal and a date. The planner finds how much a lever has to move to hit it, then shows the signups per day and the spend it takes. Apply it to update the model.</p></div>
  <div class="card"><header><h2>Goal</h2></header>
    <div class="fields">
      <div class="field"><label for="g-metric">I want</label><select id="g-metric" data-ui="goal.metric">${opts(METRICS, g.metric)}</select></div>
      <div class="field"><label for="g-value">to reach</label><input id="g-value" type="number" step="any" data-ui="goal.value" data-t="num" value="${g.value}"></div>
      <div class="field"><label for="g-month">by</label><select id="g-month" data-ui="goal.month">${monthOpts(g.month)}</select></div>
      <div class="field"><label for="g-scope">in</label><select id="g-scope" data-ui="goal.scope">${cityOpts(g.scope)}</select></div>
      <div class="field"><label for="g-lever">by moving</label><select id="g-lever" data-ui="goal.lever">${opts(LEVERS, g.lever)}</select></div>
      <div class="field" style="align-self:end"><button class="btn primary" data-act="solve">Find what it takes</button></div>
    </div>
    <div id="g-out" style="margin-top:16px"></div>
  </div>
  <div class="card"><header><h2>Napkin math</h2><span class="hint">no model, just the funnel</span></header>
    <div class="fields" style="margin-bottom:14px">
      <div class="field"><label for="n-target">Paying members I want</label><input id="n-target" type="number" data-ui="napkin.target" data-t="num" value="${ui.napkin.target}"></div>
      <div class="field"><label for="n-months">in this many months</label><input id="n-months" type="number" data-ui="napkin.months" data-t="num" value="${ui.napkin.months}"></div>
    </div>
    <div id="n-out"></div>
  </div>`; },
  out() {
    const g = ui.goal, r = ui.goalResult; const el = document.getElementById('g-out');
    const cur = metricVal(R, g); const fm = ['mrr', 'arr', 'subMrr', 'yrev'].includes(g.metric) ? money : num;
    if (!r) el.innerHTML = `<p class="muted">Right now the model gets you <b class="mono" style="color:var(--ink)">${fm(cur)}</b> ${esc(METRICS[g.metric].toLowerCase())} by ${ML(mIdx(g.month, S.meta.startMonth))}${g.scope !== 'all' ? ' in ' + esc(S.markets.find(c => c.id === g.scope)?.name || '') : ''}.</p>`;
    else if (r.err) el.innerHTML = `<div class="note">${esc(r.err)}</div>`;
    else {
      const what = r.lever === 'signups' ? `${r.f.toFixed(2)}× the signups you planned${g.scope !== 'all' ? ' in ' + esc(S.markets.find(c => c.id === g.scope)?.name) : ''}` : r.lever === 'conv' ? `conversion to paid at ${r.f.toFixed(2)}× (${pct(S.growth.conv * r.f, 1)} of signups)` : `paid churn at ${pct(S.growth.paidChurn / r.f, 1)} a month`;
      el.innerHTML = `<div style="display:grid;gap:12px"><div><span class="hint">To hit ${fm(r.target)} by ${ML(r.t)}, you need</span><div class="big">${what}</div><span class="hint">Today’s plan gets ${fm(r.base)}.</span></div>
      <div class="scroll"><table><thead><tr><th>At ${ML(r.t)}</th><th>Current plan</th><th>Needed</th></tr></thead><tbody>${r.rows.map(([n, a, b, f]) => `<tr><td>${n}</td><td class="num">${f(a)}</td><td class="num"><b>${f(b)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="row"><button class="btn primary" data-act="apply">Apply to model</button><span class="hint">${r.lever === 'signups' ? 'Multiplies beta and launch signups' + (g.scope !== 'all' ? ' for that city.' : ' for every city.') : r.lever === 'conv' ? 'Updates conversion and free-to-paid in Assumptions.' : 'Updates paid churn in Assumptions.'}</span></div></div>`;
    }
    const G = S.growth; const P = +ui.napkin.target || 0, M = Math.max(1, +ui.napkin.months || 1), c = G.paidChurn;
    const nPay = P * c / (1 - Math.pow(1 - c, M));
    const eff = G.conv + (1 - G.conv) * G.freeToPaid / (G.freeChurn + G.freeToPaid);
    const sign = nPay / eff; const u = unitStats(0);
    const mrr = P * R.arppu;
    document.getElementById('n-out').innerHTML = `<div class="funnel">
      <div><span>New paying members each month</span><b>${num(nPay)}</b></div>
      <div><span>Signups each month (at ${pct(eff, 1)} who ever pay)</span><b>${num(sign)}</b></div>
      <div><span>Signups per week</span><b>${num(sign / 4.345)}</b></div>
      <div><span>Signups per day</span><b>${num(sign / 30.42)}</b></div>
      <div><span>Marketing per month at Y1 cost per signup (${money(u.cacSign, 2)})</span><b>${money(sign * u.cacSign)}</b></div>
      <div><span>Subscription revenue once you get there</span><b>${money(mrr)}/mo · ${money(mrr * 12)}/yr</b></div>
      <div><span>Members you must replace every month to stay there</span><b>${num(P * c)}</b></div>
    </div><p class="hint" style="margin-top:8px">Uses ${pct(c, 1)} monthly paid churn, ${pct(G.conv, 1)} paying in month one and ${pct(G.freeToPaid, 1)} of free users converting each month.</p>`;
  }
};

  <div class="kpis" id="f-kpis"></div>
  <div class="card"><header><h2>Rounds</h2><button class="btn primary" data-act="addFund">Add round</button></header>
    <div class="scroll"><table class="ed"><thead><tr><th>Month</th><th>Round</th><th>Amount</th><th>Post-money valuation</th><th></th></tr></thead><tbody>${S.funding.map((f, i) => `<tr><td>${inp(`funding.${i}.date`, 'month')}</td><td>${inp(`funding.${i}.name`, 'text')}</td><td>${inp(`funding.${i}.amount`, 'num', '', 'style="min-width:120px"')}</td><td>${inp(`funding.${i}.postMoney`, 'num', '', 'style="min-width:130px"')}</td><td><button class="x" data-act="del" data-p="funding.${i}" aria-label="Delete round">×</button></td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin-top:8px">Runway counts months from the round until cash hits zero if no later round comes in. Dilution = amount ÷ post-money. It leaves out the option pool and SAFE conversion details.</p></div>
  <div class="card"><header><h2>Round by round</h2></header><div class="scroll" id="f-table"></div></div>
  <div class="grid2"><div class="card"><header><h2>Where the first round goes</h2><span class="hint" id="f-use-h"></span></header><div id="f-use"></div></div>
  <div class="card"><header><h2>Cash with and without the next round</h2></header><div class="chart" id="f-cash"></div></div></div>`,
  out() {
    const st = S.meta.startMonth;
    const rounds = (S.funding || []).map(f => ({ ...f, t: mIdx(f.date, st) })).filter(f => f.t >= 0 && f.t < N).sort((a, b) => a.t - b.t);
    let own = 1;
    const rows = rounds.map((f, k) => {
      const r = run(S, { fundUpTo: f.t }); const neg = r.cash.findIndex((v, i) => i >= f.t && v < 0);
      const runway = neg < 0 ? null : neg - f.t;
      const dil = f.postMoney ? (+f.amount || 0) / f.postMoney : 0; own *= (1 - dil);
      const next = rounds[k + 1]; const tn = next ? next.t : Math.min(N - 1, f.t + 18);
      const burn = -sumR(R.ebitda, f.t, Math.min(N, f.t + 12)) / Math.min(12, N - f.t);
      const g3 = R.revenue[tn - 3] > 0 ? Math.pow(R.revenue[tn] / R.revenue[tn - 3], 1 / 3) - 1 : NaN;
      return { f, runway, neg, dil, own, next, tn, burn, mau: R.mau[tn], pay: R.pay[tn], mrr: R.revenue[tn], g3, cities: R.liveCities[tn] };
    });
    const first = rows[0];
    document.getElementById('f-kpis').innerHTML = first ? [
      [esc(first.f.name), money(first.f.amount), first.f.postMoney ? `at ${money(first.f.postMoney)} post-money` : 'add a post-money valuation', 'violet'],
      ['You give up', pct(first.dil, 1), `you keep ${pct(1 - first.dil, 1)}`, ''],
      ['Runway on this round alone', first.runway == null ? '5+ years' : first.runway + ' months', first.neg >= 0 ? `cash out ${ML(first.neg)}` : 'never runs out', first.runway != null && first.runway < 18 ? 'gold' : ''],
      ['Average burn, first 12 months', money(first.burn) + '/mo', 'costs minus revenue', ''],
      [first.next ? `By ${esc(first.next.name)} (${ML(first.tn)})` : `18 months in (${ML(first.tn)})`, money(subMRR(first.tn) * 12) + ' ARR', `${money(subMRR(first.tn))} MRR · ${money(first.mrr * 12)} total run-rate · ${num(first.mau)} active`, 'gold'],
    ].map(([l, v, sb, c]) => `<div class="kpi ${c}"><span class="l">${l}</span><span class="v">${v}</span><span class="s">${sb}</span></div>`).join('') : '<p class="muted">Add your first round below.</p>';
    document.getElementById('f-table').innerHTML = `<table><thead><tr><th>Round</th><th>Month</th><th>Amount</th><th>Post-money</th><th>Dilution</th><th>Founders keep</th><th>Runway alone</th><th>Burn/mo after</th><th>At next raise: active users</th><th>Paying</th><th>MRR</th><th>ARR</th><th>Total run-rate</th><th>Revenue growth/mo</th><th>Live cities</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.f.name)}</td><td>${ML(r.f.t)}</td><td class="num">${money(r.f.amount)}</td><td class="num">${r.f.postMoney ? money(r.f.postMoney) : '—'}</td><td class="num">${pct(r.dil, 1)}</td><td class="num">${pct(r.own, 1)}</td><td class="num">${r.runway == null ? '5+ yrs' : r.runway + ' mo'}</td><td class="num">${money(r.burn)}</td><td class="num">${num(r.mau)}</td><td class="num">${num(r.pay)}</td><td class="num">${money(subMRR(r.tn))}</td><td class="num">${money(subMRR(r.tn) * 12)}</td><td class="num">${money(r.mrr * 12)}</td><td class="num">${isFinite(r.g3) ? pct(r.g3, 0) : '—'}</td><td class="num">${r.cities}</td></tr>`).join('')}</tbody></table>`;
    if (first) {
      const e = Math.min(N, first.f.t + 18); const cats = COST_CATS.map((k, i) => ({ k, i, v: sumR(R.cost[k], first.f.t, e) })).filter(c => c.v > 0);
      const tot = cats.reduce((a, c) => a + c.v, 0) || 1; const rev = sumR(R.revenue, first.f.t, e);
      document.getElementById('f-use-h').textContent = `${ML(first.f.t)} to ${ML(e - 1)}`;
      document.getElementById('f-use').innerHTML = `<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:12px">${cats.map(c => `<i style="width:${c.v / tot * 100}%;background:${SER[c.i]}" title="${esc(c.k)}"></i>`).join('')}</div>
        <div class="scroll"><table><tbody>${cats.map(c => `<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap"><i class="dot" style="background:${SER[c.i]}"></i>${c.k === 'COGS' ? 'Cost of revenue' : c.k}</span></td><td class="num">${money(c.v)}</td><td class="num">${pct(c.v / tot)}</td></tr>`).join('')}
        <tr class="tot"><td>Total spend</td><td class="num">${money(tot)}</td><td></td></tr><tr><td>Revenue over the same months</td><td class="num pos">${money(rev)}</td><td></td></tr><tr><td>Net burn</td><td class="num">${money(tot - rev)}</td><td class="num">${money((tot - rev) / 18)}/mo</td></tr></tbody></table></div>`;
      const r1 = run(S, { fundUpTo: first.f.t });
      chart(document.getElementById('f-cash'), [{ name: 'Cash, all rounds', color: 'var(--s5)', values: R.cash, area: true }, { name: `Cash, ${first.f.name} only`, color: 'var(--s4)', values: r1.cash, dash: true }], { w: 560, h: 300, label: 'Cash scenarios', markers: rounds.map(f => ({ t: f.t, label: f.name })) });
    }
  }
};

/* ---------- routing ---------- */
function route() { const h = location.hash.slice(1); tab = TABS[h] ? h : 'overview'; full(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
const h0 = location.hash.slice(1); if (TABS[h0]) tab = h0;
full();
connect();

</script>

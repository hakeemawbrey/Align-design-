 engineer on break and ask, as a concerned citizen, why we keep going back to the moon when space is right there","caption":"Ruled by Uranus, which is technically further","tags":["aquarius","houston","spacecity","nasa"]},{"id":"htx-pisces-01","set":"Houston","sign":"pisces","text":"my pisces moon went to a free show at miller outdoor theatre, sat on the hill and cried at a children's ballet, a sunset and a stranger offering me bug spray. it was ninety degrees at 9pm and i have never felt more seen","caption":"Neptune does not need a ticket","tags":["pisces","piscesmoon","houston","hermannpark"]},{"id":"htx-pisces-02","set":"Houston","sign":"pisces","text":"pisces is a water sign, which is why when my street in midtown floods after twenty minutes of rain, i do not panic. i stand on the porch, feel at one with it, and text my ex","caption":"Mutable water in a city that agrees","tags":["pisces","houston","houstonweather","watersign"]},{"id":"htx-pisces-03","set":"Houston","sign":"pisces","text":"as a pisces i only listen to music chopped and screwed, because life is already moving way too fast and dj screw was the only one who understood my feelings need to be played at half speed","caption":"Slowed down so the feelings can keep up","tags":["pisces","houston","djscrew","houstonmusic"]},{"id":"htx-pisces-04","set":"Houston","sign":"pisces","text":"my pisces venus fell in love on buffalo bayou because we watched the bats leave the waugh drive bridge at sunset and he said 'wow.' we are now planning a life together. he does not know this yet","caption":"Venus is exalted in Pisces and also near a bridge","tags":["pisces","piscesvenus","houston","buffalobayou"]},{"id":"htx-pisces-05","set":"Houston","sign":"pisces","text":"a pisces on the kemah boardwalk will spend forty dollars on one game trying to win a stuffed dolphin, not because i want it, but because it looked lonely and neptune said we are bringing it home","caption":"It was not won. It was adopted.","tags":["pisces","houston","kemah","houstonastrology"]},{"id":"htx-pisces-06","set":"Houston","sign":"pisces","text":"my pisces sun cannot say no, which is how a quick stop at shipley for one dozen turned into four dozen, a box of kolaches for the office and a ride to the airport for the cashier's cousin","caption":"Boundaries dissolve. So does the glaze.","tags":["pisces","houston","shipleys","kolaches"]},{"id":"htx-y-01","set":"Houston","sign":"","text":"mercury retrograde in houston is just a normal tuesday on 610. three missed exits, two u-turns under the same overpass, and a text to the group chat that says 'there in five' from somewhere on beltway 8","caption":"Retrograde or Tuesday, the loop does not care","tags":["houston","mercuryretrograde","610loop","houstontraffic"]},{"id":"htx-y-02","set":"Houston","sign":"","text":"the stars say it is sweater weather. the stars do not live in houston. it is november, it is eighty-four degrees, and i am wearing the sweater in an h-e-b parking lot out of pure spite","caption":"Houston has two seasons and both are summer","tags":["houston","htx","houstonweather","astrologymemes"]},{"id":"htx-y-03","set":"Houston","sign":"","text":"your rising sign is how strangers see you. your houston rising sign is your area code. 713 says 'i was here first.' 281 says 'i have a pool.' 832 says 'same phone since 2004.' 346 is still introducing itself","caption":"Check your chart. Then check your area code.","tags":["houston","713","281","houstonastrology"]},{"id":"htx-y-04","set":"Houston","sign":"","text":"nobody warns you that your saturn return comes with a toll tag. at twenty-nine you stop being a kid and start receiving monthly statements from the westpark tollway like letters from a strict uncle","caption":"Saturn returns, and so does the invoice","tags":["houston","saturnreturn","eztag","htx"]},{"id":"htx-astro-01","set":"Houston","sign":"mercury","text":"i would like to formally inform txdot that mercury does not actually move backwards during retrograde. it only looks that way from earth. the same is true of my car on the katy freeway at 5:40 pm","caption":"an optical illusion, per the astronomers and the traffic cameras","tags":["houston","katyfreeway","mercuryretrograde","htxtraffic"]},{"id":"htx-astro-02","set":"Houston","sign":"mercury","text":"mercury retrograde is just the universe putting you on the feeder road. you can see exactly where you meant to go. it is right there, running next to you. the only way back is a u-turn under the overpass","caption":"the texas u-turn is a spiritual practice","tags":["houston","feederroad","mercuryretrograde","htx"]},{"id":"htx-astro-03","set":"Houston","sign":"mercury","text":"per my records, my ez tag stopped reading the exact day mercury stationed retrograde. hctra says it's the windshield. i say the planet of communication is not speaking to the toll plaza, and frankly neither am i","caption":"the toll bill is also in pre shadow","tags":["houston","eztag","mercuryretrograde","houstonastrology"]},{"id":"htx-astro-04","set":"Houston","sign":"mercury","text":"they say never break ground on a big project during mercury retrograde. i cannot confirm when txdot started on i-45, but i have driven it for years and it has not once gone direct","caption":"the orange barrels are in a permanent shadow period","tags":["houston","i45","mercuryretrograde","htxtraffic"]},{"id":"htx-astro-05","set":"Houston","sign":"mercury","text":"the city of houston and my astrologer finally agree on one rule for mercury retrograde. turn around, don't drown. it applies to flooded underpasses and to texting my ex. both are deeper than they look","caption":"barricades exist for a reason. so does the block button","tags":["houston","turnarounddontdrown","mercuryretrograde","htx"]},{"id":"htx-astro-06","set":"Houston","sign":"mercury","text":"during mercury retrograde i only pick up for 713. 281 is a maybe. 832 goes to voicemail. 346 is a test from the universe and i will not be taking it until mercury goes direct","caption":"621, i'm not even ready to discuss you","tags":["houston","713","mercuryretrograde","houstonastrology"]},{"id":"htx-astro-07","set":"Houston","sign":"venusmars","text":"with venus in taurus, my terms of courtship are simple. you will drive me to the buc-ee's in katy. you will not rush me past the brisket counter. you will understand that this is the date","caption":"venus in taurus does not do appetizers. it does brisket","tags":["houston","bucees","venusintaurus","houstonastrology"]},{"id":"htx-astro-08","set":"Houston","sign":"venusmars","text":"i have venus in cancer, so i love the way i love a whataburger table tent. i hold on to it, i take it home without asking, and twelve years later it is still on my nightstand","caption":"number 47 and i are in a committed relationship","tags":["houston","whataburger","venusincancer","astrologymemes"]},{"id":"htx-astro-09","set":"Houston","sign":"venusmars","text":"venus retrograde is when exes resurface, which is why i'm skipping the breakfast klub this weekend. that line goes around the parking lot. there is nowhere to hide, and everyone i've ever dated is ordering wings and waffles","caption":"exes come back in retrograde. so does my craving for grits","tags":["houston","breakfastklub","venusretrograde","houstonastrology"]},{"id":"htx-astro-10","set":"Houston","sign":"venusmars","text":"my astrologer says his mars conjunct my venus means intense passion. in practice it means he insists on taking 59 when i clearly said 288, and we have not spoken since pearland","caption":"mars rules arguments. txdot rules everything else","tags":["houston","pearland","venusandmars","htxtraffic"]},{"id":"htx-astro-11","set":"Houston","sign":"moonrising","text":"my sun is in leo, my moon is in cancer and my rising sign is houston humidity in july. you will feel me before you see me, and you will need to change your shirt","caption":"first impressions, measured in dew point","tags":["houston","houstonhumidity","risingsign","bigthree"]},{"id":"htx-astro-12","set":"Houston","sign":"moonrising","text":"my big three: sun in the heights, moon in montrose, rising in katy. people meet me and assume i have a three-car garage. emotionally i'm at an open mic on westheimer","caption":"the rising sign is the cul-de-sac. the moon is the poetry","tags":["houston","montrose","bigthree","houstonastrology"]},{"id":"htx-astro-13","set":"Houston","sign":"moonrising","text":"my moon is in taurus, which means i process emotions at roughly the tempo of a dj screw tape. slow, deliberate, a little chopped. please give me until the second verse to tell you how i feel","caption":"feelings, but slowed down so they can fully arrive","tags":["houston","djscrew","moonintaurus","astrologymemes"]},{"id":"htx-astro-14","set":"Houston","sign":"moonrising","text":"my astrologer said not to start anything while the moon is void of course, so i've been sitting in the h-e-b parking lot on buffalo speedway for forty minutes. technically, i have not started shopping","caption":"the parking lot was always going to take forty minutes","tags":["houston","heb","moonvoidofcourse","houstonastrology"]},{"id":"htx-astro-15","set":"Houston","sign":"lunar","text":"the full moon is when everything hidden comes to light, which explains the line at the 24-hour whataburger at 2 am. nobody there is hungry. we are simply illuminated","caption":"the moon is full and so is the drive thru","tags":["houston","whataburger","fullmoon","houstonastrology"]},{"id":"htx-astro-16","set":"Houston","sign":"lunar","text":"eclipses bring sudden name changes you never agreed to. i called it minute maid park for twenty years and one january it became daikin park. i'm not saying it was eclipse season. i'm saying i was not consulted","caption":"it's still minute maid in my natal chart","tags":["houston","astros","eclipseseason","astrologymemes"]},{"id":"htx-astro-17","set":"Houston","sign":"lunar","text":"my saturn return hit at twenty-nine and the first symptom was buying a house in pearland. the second was explaining the drainage ditch to my friends at brunch with real enthusiasm. saturn rules structure and, apparently, gutters","caption":"saturn said grow up and check the flood map","tags":["houston","pearland","saturnreturn","houstonastrology"]},{"id":"htx-astro-18","set":"Houston","sign":"lunar","text":"an accurate birth chart needs an exact birth time. my mother says i was born right after the traffic on 59 let up, which in houston could be any hour between 1994 and today","caption":"my ascendant is pending, like the southwest freeway","tags":["houston","birthchart","htxtraffic","astrologymemes"]},{"id":"htx-astro-19","set":"Houston","sign":"space","text":"the actual apollo 13 line was 'houston, we've had a problem here.' past tense. calm. already handling it. that is the energy i bring to mercury retrograde, right before i call someone in clear lake","caption":"mission control has better boundaries than i do","tags":["houston","nasa","mercuryretrograde","spacecity"]},{"id":"htx-astro-20","set":"Houston","sign":"space","text":"when apollo 11 landed, armstrong's big announcement started with 'houston,' not 'moon.' the moon rules feelings, and it has been quietly sensitive about coming second in that sentence since 1969","caption":"tranquility base here. emotional base, slightly bruised","tags":["houston","apollo11","moonsign","spacecity"]},{"id":"htx-astro-21","set":"Houston","sign":"space","text":"i would like johnson space center to staff a console for my mercury retrograde. one flight director, three engineers and a man named gary whose only job is to say 'negative' every time i reach for my phone","caption":"go or no go on that text. no go","tags":["houston","johnsonspacecenter","mercuryretrograde","spacecity"]},{"id":"htx-astro-22","set":"Houston","sign":"space","text":"i took the tram tour at space center houston to see the restored apollo mission control and asked which console tracked mercury retrograde. the guide said none. respectfully, that explains a lot about the sixties","caption":"they had slide rules and no ephemeris. bold","tags":["houston","spacecenterhouston","mercuryretrograde","astrologymemes"]},{"id":"htx-astro-23","set":"Houston","sign":"space","text":"houston's only official nickname is space city, which is why dating here is hard. the astronauts know exactly where mercury is. i know whether it's retrograde. neither of us can find parking in montrose","caption":"science and astrology, united by the valet stand","tags":["houston","spacecity","astrologymemes","montrose"]},{"id":"htx-astro-24","set":"Houston","sign":"space","text":"nasa engineers in houston can predict where a spacecraft will be months from now. i can use an ephemeris to predict exactly when venus goes direct. we are both scientists. only one of us gets past the gate on nasa parkway","caption":"same math, different security clearance","tags":["houston","nasa","venusretrograde","spacecity"]},{"id":"leo-g01","set":"Signs","sign":"leo","text":"put me in a hostage negotiation and i will release every hostage immediately because the kidnapper said one nice thing about my jacket. my leo sun simply cannot negotiate against a compliment x","caption":"Leo placements will trade national security for one good review","tags":["leo","leosun","leoseason","firesigns"]},{"id":"leo-g02","set":"Signs","sign":"leo","text":"i regret to inform the group chat that my leo moon has noticed nobody reacted to my message for 47 minutes. we are not upset. we are simply drafting a statement x","caption":"The silence was noted. The silence was logged.","tags":["leo","leomoon","groupchat","astrologymemes"]},{"id":"leo-g03","set":"Signs","sign":"leo","text":"effective immediately, my birthday is no longer a day. per the leo handbook it has been upgraded to a fiscal quarter, and all attendees are expected to clear their calendars accordingly","caption":"Leo season is a lifestyle, not a date range","tags":["leo","leoseason","birthdaymonth","zodiachumor"]},{"id":"leo-g04","set":"Signs","sign":"leo","text":"drop me into a nature documentary and i'll be the lion who stops mid hunt to check the camera crew is still filming. my leo rising refuses to do anything majestic without a witness","caption":"If nobody saw it, did the leo even do it","tags":["leo","leorising","naturedocumentary","maincharacter"]},{"id":"leo-g05","set":"Signs","sign":"leo","text":"my leo venus would like to clarify that i do not need constant attention in a relationship. i need consistent attention, delivered warmly, at regular intervals, with the occasional standing ovation x","caption":"Reasonable demands from a reasonable lion","tags":["leo","leovenus","venussign","datingmemes"]},{"id":"leo-g06","set":"Signs","sign":"leo","text":"a leo friend will pay for your dinner, hype you up to the waiter, drive you home and defend your honour in three separate group chats. all we ask is that you say thank you like you mean it","caption":"Loyal to a fault. A very loud fault.","tags":["leo","leofriend","fixedfire","bestfriendmemes"]},{"id":"leo-g07","set":"Signs","sign":"leo","text":"i was asked to give a short toast at my best friend's wedding and as a leo mars i have prepared a short toast, a costume change, a slideshow and a brief intermission","caption":"The bride will get her moment. Right after mine.","tags":["leo","leomars","weddingtoast","astrologyhumor"]},{"id":"leo-g08","set":"Signs","sign":"leo","text":"your honour, my client is a leo and cannot be held responsible for the karaoke incident. the microphone was on, the lights were dimmed, the crowd was right there and frankly she was born for this","caption":"The defence rests. The leo does not.","tags":["leo","karaoke","courtroom","leoenergy"]},{"id":"leo-g09","set":"Signs","sign":"leo","text":"by royal decree of my leo sun, any compliment i receive in private must now be repeated in public, ideally in front of witnesses and preferably at a slightly louder volume","caption":"Compliments are public property in this kingdom","tags":["leo","leosun","royaldecree","sunruled"]},{"id":"leo-g10","set":"Signs","sign":"leo","text":"per my last email, i am happy to lead this project as long as my name goes first on every slide. this is not ego. this is a leo placement doing basic brand management","caption":"Credit where credit is due. Ideally, to the leo.","tags":["leo","leoatwork","corporatehumor","officememes"]},{"id":"leo-g11","set":"Signs","sign":"leo","text":"airport security asked if i had anything to declare, so as a leo i declared my love for my friends, my deep disappointment in the queue system and my long term plans for world domination x","caption":"The leo was not detained. Merely admired.","tags":["leo","airportsecurity","leoenergy","zodiacmemes"]},{"id":"leo-g12","set":"Signs","sign":"leo","text":"put a leo on a heist crew and we will absolutely crack the safe, but we'll also leave a signed note, a monogrammed glove and a voicemail asking the press to spell our name right","caption":"Leos do not do anonymous. Even in crime.","tags":["leo","heist","fixedfire","astrologymemes"]},{"id":"leo-g13","set":"Signs","sign":"leo","text":"hr has asked me to stop referring to my coworkers as my loyal subjects. as a leo sun i have accepted this feedback graciously and will now be calling them my beloved royal court","caption":"Growth looks different for every sign","tags":["leo","leosun","officehumor","hrmemes"]},{"id":"leo-g14","set":"Signs","sign":"leo","text":"dating a leo is simple. clap when we walk into a room, remember every detail of our day and look at us like we personally invented the sun. which, astrologically speaking, we sort of did","caption":"Ruled by the sun. Acting accordingly.","tags":["leo","datingaleo","sunsign","relationshipmemes"]},{"id":"leo-g15","set":"Signs","sign":"leo","text":"by continuing this friendship you agree to the leo terms and conditions, including but not limited to hyping my selfies, attending my entire birthday month and never saying the word dramatic in my presence x","caption":"Please read carefully. The lion will know if you skipped.","tags":["leo","termsandconditions","leoseason","friendshipmemes"]},{"id":"virgo-g01","set":"Signs","sign":"virgo","text":"put me in a five star restaurant and i'll be the virgo quietly realigning the cutlery, fixing the menu's grammar in my head and leaving a review that is technically positive but includes eleven suggestions","caption":"Five stars. Pending revisions.","tags":["virgo","virgosun","perfectionist","earthsigns"]},{"id":"virgo-g02","set":"Signs","sign":"virgo","text":"i regret to announce that my virgo moon has once again noticed the typo in your instagram caption. we have chosen not to comment. we will simply think about it for the rest of the week x","caption":"Seen, noted, silently edited in our hearts","tags":["virgo","virgomoon","grammar","astrologymemes"]},{"id":"virgo-g03","set":"Signs","sign":"virgo","text":"my virgo venus doesn't say i love you. it says i booked your dentist appointment, labelled your spice rack and reorganised your entire wardrobe by colour while you were in the shower","caption":"Acts of service, aggressively delivered","tags":["virgo","virgovenus","actsofservice","lovelanguage"]},{"id":"virgo-g04","set":"Signs","sign":"virgo","text":"take a virgo to a museum and we will not be looking at the art. we will be looking at the slightly crooked frame in gallery four and wondering who signed off on that","caption":"The masterpiece was fine. The placard had a comma splice.","tags":["virgo","museum","detailoriented","zodiachumor"]},{"id":"virgo-g05","set":"Signs","sign":"virgo","text":"the dmv is my natural habitat as a virgo rising. finally, a place with forms, queues and rules, and a whole waiting room of people i can silently help fill out section b correctly","caption":"Mercury-ruled people love a good form","tags":["virgo","virgorising","dmv","mercuryruled"]},{"id":"v  won't be reading charts, i'll be lighting a green candle and writing 'abundance' on a bay leaf until security gently escorts me out","caption":"it's called financial manifestation and it is not covered by insurance","tags":["moneymanifestation","manifestation","spiritualhumor","lawofattraction"]},{"id":"astro-g48","set":"Placements","sign":"manifest","text":"i've been told to act as if my manifestations have already come true, so i have stopped replying to emails, started calling everyone darling and asked my landlord to speak to my manager","caption":"living as my future self, who apparently has staff","tags":["manifestation","futureself","lawofattraction","spiritualhumor"]},{"id":"astro-g49","set":"Placements","sign":"compat","text":"i'll need your full name, your date of birth and your exact time of birth before the appetisers arrive. if you don't know your birth time, that's fine, we can call your mum together right now","caption":"date one is technically an intake appointment","tags":["birthtime","firstdate","datingbychart","astrologymemes"]},{"id":"astro-g50","set":"Placements","sign":"compat","text":"after reviewing our synastry chart, i must inform you that your mars squares my moon, your saturn sits on my venus and the only thing we truly have in common is this restaurant","caption":"synastry results are in. the breadsticks were the highlight","tags":["synastry","compatibility","relationshipastrology","astrologymemes"]},{"id":"astro-g51","set":"Placements","sign":"compat","text":"my friends ask what my type is and i say kind, funny, emotionally available. what i actually mean is someone whose venus trines my moon and who will not ask me what a trine is","caption":"standards are set by the stars and the stars are picky","tags":["synastry","venussign","datingbychart","astrologymemes"]},{"id":"astro-g52","set":"Placements","sign":"compat","text":"a red flag is when he says he doesn't believe in astrology. a crimson flag is when he doesn't know his birth time. a full parade is when he guesses 'probably morning'","caption":"please consult your birth certificate before consulting my heart","tags":["birthtime","redflags","datingbychart","astrologymemes"]},{"id":"astro-g53","set":"Placements","sign":"compat","text":"put me on a dating show and i won't be choosing based on chemistry. i'll be pulling each contestant aside to ask about their seventh house and quietly eliminating anyone whose mars squares my sun","caption":"the rose ceremony is actually a synastry reading","tags":["seventhhouse","synastry","datingbychart","astrologymemes"]},{"id":"astro-g54","set":"Placements","sign":"compat","text":"we've been talking for one week and i have already run our composite chart, read our davison chart and named the business we start together in 2031. he has not asked my last name","caption":"composite charts move faster than men do","tags":["compositechart","synastry","situationship","astrologymemes"]},{"id":"astro-g55","set":"Placements","sign":"compat","text":"very romantic of me to fall in love at first sight, and very astrologer of me to check your chart in the bathroom before the main course to see if it's love or just a neptune transit","caption":"neptune in aries has everyone seeing things this year","tags":["neptuneinaries","neptunetransit","datingbychart","astrologymemes"]},{"id":"astro-g56","set":"Placements","sign":"compat","text":"i'm not saying our relationship is doomed, but my mum looked at our synastry chart, took off her glasses and asked if i'd like her to light a candle for us or just for me","caption":"the family astrologer has spoken","tags":["synastry","compatibility","astrologymom","astrologymemes"]},{"id":"astro-g57","set":"Placements","sign":"compat","text":"i have officially blocked a man for having his venus in the same sign as my ex's venus. some call it petty. i call it pattern recognition on a cosmic scale x","caption":"fool me once, fool me twice, not with the same venus sign","tags":["venussign","exfiles","datingbychart","astrologymemes"]},{"id":"astro-g58","set":"Placements","sign":"compat","text":"please be advised that i am now accepting applications for a partner. requirements include a stable income, a sense of humour and a mars sign that won't start a war with mine over the dishwasher","caption":"mars compatibility is about who loads the dishwasher wrong","tags":["marssign","compatibility","datingbychart","astrologyhumor"]},{"id":"astro-g59","set":"Placements","sign":"compat","text":"i'm not looking for someone to finish my sentences. i'm looking for someone to finish their birth chart form, including time of birth, place of birth and a short personal statement on their saturn","caption":"please attach your natal chart as a pdf","tags":["birthchart","natalchart","datingbychart","astrologymemes"]},{"id":"astro-g60","set":"Placements","sign":"compat","text":"i'm coming to the wedding and i'm bringing a gift, but after looking at their synastry chart i'll be keeping the receipt and not buying anything engraved","caption":"love wins. the receipt is just in case","tags":["synastry","weddingseason","compatibility","astrologymemes"]},{"id":"sagittarius-g01","set":"Signs","sign":"sagittarius","text":"put me in a book club and i'll be the sagittarius who read the first chapter, has a fully formed philosophy about the ending, and is confidently, passionately wrong about it","caption":"Jupiter expands the confidence, not the reading","tags":["sagittarius","bookclub","firesign","jupiter"]},{"id":"sagittarius-g02","set":"Signs","sign":"sagittarius","text":"i regret to inform my sagittarius moon that we cannot simply leave every room the moment it gets emotionally complicated. that said, i am already in the car x","caption":"Emotional exit strategy: always parked out front","tags":["sagittarius","sagittariusmoon","moonsign","freedom"]},{"id":"sagittarius-g03","set":"Signs","sign":"sagittarius","text":"pull me aside at airport security and i'll be the sagittarius asking the officer where he'd go if he could go anywhere, and by the end of the bag check we've both quit our jobs","caption":"Randomly selected for a life-changing conversation","tags":["sagittarius","travel","wanderlust","firesign"]},{"id":"sagittarius-g04","set":"Signs","sign":"sagittarius","text":"please be advised that my sagittarius placements have been formally asked to stop opening sentences with 'no offence but.' we have agreed to replace it with 'respectfully,' which does exactly the same thing","caption":"Same honesty, new packaging","tags":["sagittarius","bluntness","sagittariusplacements","honesty"]},{"id":"sagittarius-g05","set":"Signs","sign":"sagittarius","text":"invite me to give the wedding toast and i'll be the sagittarius who opens with 'i genuinely did not think this would last' and somehow gets a standing ovation","caption":"Brutal honesty, impeccable timing","tags":["sagittarius","weddingtoast","bluntness","firesign"]},{"id":"sagittarius-g06","set":"Signs","sign":"sagittarius","text":"very sagittarius venus of me to want a deep, committed, soul-level connection with someone who never once asks what i'm doing next weekend","caption":"Love me freely, schedule me never","tags":["sagittarius","sagittariusvenus","venussign","dating"]},{"id":"sagittarius-g07","set":"Signs","sign":"sagittarius","text":"put me in a hostage negotiation and i'll be the sagittarius convincing the guy that life is too short for this, he really needs to see patagonia, and honestly, i'll drive","caption":"Jupiter optimism as a crisis strategy","tags":["sagittarius","jupiter","optimism","adventure"]},{"id":"sagittarius-g08","set":"Signs","sign":"sagittarius","text":"and here, in its natural habitat, we observe the wild sagittarius. it has made three plans for tonight, will attend a fourth, and the original group chat will not hear from it until thursday","caption":"Rarely seen, frequently overbooked","tags":["sagittarius","naturedocumentary","mutablefire","plans"]},{"id":"sagittarius-g09","set":"Signs","sign":"sagittarius","text":"by entering a friendship with a sagittarius you agree to the following terms: spontaneous road trips, unsolicited honesty, and at least one story a month that begins 'so i got lost again, but listen'","caption":"Read the fine print. They lost it.","tags":["sagittarius","friendship","roadtrip","termsandconditions"]},{"id":"sagittarius-g10","set":"Signs","sign":"sagittarius","text":"i regret to announce that i have once again joined a project with full sagittarius enthusiasm and approximately none of the attention span required to finish it. we wish the project well x","caption":"Mutable fire: great at starting, legendary at moving on","tags":["sagittarius","mutablefire","work","coworker"]},{"id":"sagittarius-g11","set":"Signs","sign":"sagittarius","text":"having a sagittarius rising means i can befriend an entire hostel in one night and still be unreachable by the people who have known me for ten years","caption":"Great first impression, terrible reply time","tags":["sagittarius","sagittariusrising","risingsign","travel"]},{"id":"sagittarius-g12","set":"Signs","sign":"sagittarius","text":"take me to a museum and i'll be the sagittarius who reads one plaque about ancient greece and immediately books a one-way ticket to athens to 'understand the context'","caption":"Jupiter said go, so they went","tags":["sagittarius","museum","wanderlust","jupiter"]},{"id":"sagittarius-g13","set":"Signs","sign":"sagittarius","text":"very on brand that the sagittarius symbol is half human, half horse, because half of me wants to discuss the meaning of life and the other half has already bolted out the door","caption":"The philosopher stayed. The horse did not.","tags":["sagittarius","centaur","archer","philosophy"]},{"id":"sagittarius-g14","set":"Signs","sign":"sagittarius","text":"your honour, my sagittarius client did not 'ghost' the plaintiff. they simply went on a spiritual journey to find themselves and lost signal for six to eight weeks","caption":"The defence rests. In Bali.","tags":["sagittarius","courtroom","ghosting","dating"]},{"id":"sagittarius-g15","set":"Signs","sign":"sagittarius","text":"as a sagittarius i would like to formally thank jupiter for all the luck that has repeatedly saved me from consequences i absolutely walked into with my eyes wide open","caption":"Ruled by the planet of luck and it shows","tags":["sagittarius","jupiter","luck","sagittariussun"]},{"id":"capricorn-g01","set":"Signs","sign":"capricorn","text":"put me in a candlelit restaurant on a first date and i'll be the capricorn gently asking about his five-year plan, his pension contributions, and whether he has ever finished a hobby","caption":"Romance is a long-term investment","tags":["capricorn","firstdate","dating","earthsign"]},{"id":"capricorn-g02","set":"Signs","sign":"capricorn","text":"please note that my capricorn moon processes feelings exclusively through a quarterly review. your concerns have been logged and will be addressed in q3, pending budget approval x","caption":"Emotions are on the agenda. Under any other business.","tags":["capricorn","capricornmoon","moonsign","corporate"]},{"id":"capricorn-g03","set":"Signs","sign":"capricorn","text":"drop me into a heist movie and i'll be the capricorn who isn't there for the thrill. i built the timeline, booked the van, and i will be invoicing everyone afterwards","caption":"Someone has to run the logistics","tags":["capricorn","heist","planning","earthsign"]},{"id":"capricorn-g04","set":"Signs","sign":"capricorn","text":"very capricorn of me to take a holiday and spend the first two days building an itinerary so efficient that the actual relaxing is scheduled for 3:15 to 3:40","caption":"Rest, but make it billable","tags":["capricorn","holiday","workaholic","saturn"]},{"id":"capricorn-g05","set":"Signs","sign":"capricorn","text":"i regret to announce that as a capricorn i was born approximately 52 years old and have been aging backwards ever since. by retirement i fully expect to be a delight","caption":"Saturn front-loads the hard part","tags":["capricorn","saturn","oldsoul","capricornsun"]},{"id":"capricorn-g06","set":"Signs","sign":"capricorn","text":"ask me to give a wedding toast and i'll be the capricorn who thanks the vendors by name, notes we are running eleven minutes behind, then says one sentence so sincere the whole room cries","caption":"Dry for four minutes, devastating for one","tags":["capricorn","weddingtoast","dryhumour","earthsign"]},{"id":"capricorn-g07","set":"Signs","sign":"capricorn","text":"put me in a dmv queue and i'll be the capricorn who arrived with every form pre-filled, two copies of everything, and was quietly helping the staff by the second hour","caption":"Bureaucracy has never been so afraid","tags":["capricorn","dmv","organised","cardinalearth"]},{"id":"capricorn-g08","set":"Signs","sign":"capricorn","text":"having a venus in capricorn means i don't say i love you. i say i've set up a joint savings account, sorted your car insurance and put your mum's birthday in my calendar","caption":"Their love language is admin, honestly","tags":["capricorn","capricornvenus","venussign","lovelanguage"]},{"id":"capricorn-g09","set":"Signs","sign":"capricorn","text":"by royal decree of the capricorn sun, all fun is hereby approved, provided it is scheduled in advance, comes in under budget, and finishes in time for an early night","caption":"Fun has been permitted. Within reason.","tags":["capricorn","royaldecree","capricornsun","saturn"]},{"id":"capricorn-g10","set":"Signs","sign":"capricorn","text":"three weeks into the new job and the actual manager has started asking me what we should do next. as a capricorn i'd love to say i didn't plan this. i did","caption":"Corporate ladder? Mountain goat, actually","tags":["capricorn","coworker","ambition","careergoals"]},{"id":"capricorn-g11","set":"Signs","sign":"capricorn","text":"if i'm ever called as a witness, i'll be the capricorn who brings dated receipts, a full timeline of events, and a binder labelled 'for when they inevitably lie'","caption":"The prosecution would like to hire them","tags":["capricorn","courtroom","receipts","earthsign"]},{"id":"capricorn-g12","set":"Signs","sign":"capricorn","text":"here we see the capricorn, mountain goat of the zodiac, slowly scaling a sheer cliff of responsibilities while everyone below shouts up asking if it ever takes a weekend off","caption":"It does not. It is building equity.","tags":["capricorn","naturedocumentary","mountaingoat","workaholic"]},{"id":"capricorn-g13","set":"Signs","sign":"capricorn","text":"a capricorn rising will walk into a party, say almost nothing, and still leave with three people asking for career advice and one asking if they're secretly the host","caption":"Quiet authority is a placement","tags":["capricorn","capricornrising","risingsign","authority"]},{"id":"capricorn-g14","set":"Signs","sign":"capricorn","text":"terms and conditions of being loved by a capricorn: dry humour, terrifying loyalty, and a partner who treats your wildest dream like a project plan that just needs a deadline x","caption":"They will believe in you aggressively","tags":["capricorn","termsandconditions","loyalty","relationships"]},{"id":"capricorn-g15","set":"Signs","sign":"capricorn","text":"a mars in capricorn doesn't get angry. it gets quiet, makes a plan, and five years later you find out it bought the building","caption":"Revenge, but make it a long-term asset","tags":["capricorn","capricornmars","marssign","patience"]},{"id":"aquarius-g01","set":"Signs","sign":"aquarius","text":"put me at a family dinner and i'll be the aquarius who skipped the small talk, asked grandma her views on universal basic income, and started a debate that ends at midnight","caption":"Nobody passed the potatoes. Everybody passed judgement.","tags":["aquarius","familydinner","airsign","debate"]},{"id":"aquarius-g02","set":"Signs","sign":"aquarius","text":"as an aquarius i will march for the rights of eight billion strangers and then quietly leave a group chat of four because someone sent a voice note","caption":"Humanitarian, but not like that","tags":["aquarius","humanitarian","groupchat","aquariussun"]},{"id":"aquarius-g03","set":"Signs","sign":"aquarius","text":"your honour, my aquarius client did not 'emotionally detach' from the relationship. they simply observed it from a safe scientific distance and wrote up their findings","caption":"Peer review is still pending, unfortunately","tags":["aquarius","courtroom","detached","relationships"]},{"id":"aquarius-g04","set":"Signs","sign":"aquarius","text":"very aquarius moon of me to respond to someone's heartfelt confession with 'okay, let's look at this logically' and then wonder why the room got colder","caption":"Fixed air: excellent logic, room temperature hugs","tags":["aquarius","aquariusmoon","moonsign","fixedair"]},{"id":"aquarius-g05","set":"Signs","sign":"aquarius","text":"if aliens ever land i'll be the aquarius at the front of the crowd, not to welcome them, but to ask why it took so long and whether they're hiring","caption":"Finally, some people who get it","tags":["aquarius","aliens","uranus","weird"]},{"id":"aquarius-g06","set":"Signs","sign":"aquarius","text":"i regret to announce that my aquarius placements have stopped liking a band i discovered first, because you all like it now. we are exploring a finnish accordion collective instead x","caption":"It was better before you heard it","tags":["aquarius","aquariusplacements","contrarian","music"]},{"id":"aquarius-g07","set":"Signs","sign":"aquarius","text":"dating an aquarius is wonderful. we'll stay up until 4am discussing time travel and the nature of consciousness, then i'll reply to 'good morning' three business days later","caption":"Intimacy of the mind, latency of the inbox","tags":["aquarius","dating","airsign","texting"]},{"id":"aquarius-g08","set":"Signs","sign":"aquarius","text":"by royal decree of the aquarius, the following are now banned in my kingdom: dress codes, small talk, anyone who says 'that's how it's always been done' and, effective immediately, the monarchy","caption":"Abolished themselves by lunchtime","tags":["aquarius","royaldecree","rebel","uranus"]},{"id":"aquarius-g09","set":"Signs","sign":"aquarius","text":"and here we observe the aquarius at a house party, standing slightly apart from the herd, two hours deep in conversation with the host's cat, the only guest it considers an original thinker","caption":"Selective socialising in the wild","tags":["aquarius","naturedocumentary","introvert","airsign"]},{"id":"aquarius-g10","set":"Signs","sign":"aquarius","text":"put me in a corporate brainstorm and i'll be the aquarius who pitches an idea so far ahead of its time that it gets rejected now and stolen in 2031","caption":"Uranus energy, unfortunately unpatented","tags":["aquarius","coworker","innovation","uranus"]},{"id":"aquarius-g11","set":"Signs","sign":"aquarius","text":"people forget aquarius is ruled by saturn as well as uranus, which is why i will passionately reject every rule society has ever made and then strictly enforce my own","caption":"Rebel with a very specific rulebook","tags":["aquarius","saturn","uranus","fixedsign"]},{"id":"aquarius-g12","set":"Signs","sign":"aquarius","text":"having a venus in aquarius means the most romantic thing you can do is be my best friend first, my partner second, and absolutely never ask what we are","caption":"Don't label it. They'll leave.","tags":["aquarius","aquariusvenus","venussign","situationship"]},{"id":"aquarius-g13","set":"Signs","sign":"aquarius","text":"seat me at a wedding and i'll be the aquarius explaining to the bride's uncle that marriage is a social construct, and then giving the most moving toast of the night","caption":"Against tradition, for love, somehow","tags":["aquarius","wedding","contrarian","airsign"]},{"id":"aquarius-g14","set":"Signs","sign":"aquarius","text":"as an aquarius friend i'll disappear for four months without explanation and then turn up at your door with soup on the exact day your life falls apart","caption":"Detached, but somehow always on time","tags":["aquarius","friendship","aquariussun","loyalty"]},{"id":"aquarius-g15","set":"Signs","sign":"aquarius","text":"terms and conditions of an aquarius: feelings may be discussed in theory only. hugs available on request with 48 hours notice. any attempt to predict us will void the agreement x","caption":"Fixed sign, unfixable vibe","tags":["aquarius","termsandconditions","fixedair","independent"]},{"id":"pisces-g01","set":"Signs","sign":"pisces","text":"put me on a jury and i'll be the pisces who has fully forgiven the defendant, the plaintiff and the judge, and would like to know if anyone has checked on the stenographer","caption":"Reasonable doubt? Reasonable empathy.","tags":["pisces","courtroom","empath","watersign"]},{"id":"pisces-g02","set":"Signs","sign":"pisces","text":"today's pisces forecast: heavy neptune fog rolling in by mid-morning, visibility reduced to whatever daydream you're having, with scattered showers whenever an advert features an old dog","caption":"Drive carefully. Feel everything.","tags":["pisces","weatherforecast","neptune","daydreamer"]},{"id":"pisces-g03","set":"Signs","sign":"pisces","text":"i regret to announce that my pisces moon has once again absorbed the emotions of a stranger on the train. i do not know her name, but i am going through her breakup x","caption":"Emotional sponge, no off switch","tags":["pisces","piscesmoon","moonsign","empath"]},{"id":"pisces-g04","set":"Signs","sign":"pisces","text":"very pisces venus of me to go on one date, name our future dog, design the wedding playlist and mourn the entire relationship before he's even texted back","caption":"Neptune writes fiction for free","tags":["pisces","piscesvenus","venussign","dating"]},{"id":"pisces-g05","set":"Signs","sign":"pisces","text":"being a pisces means my two fish are permanently swimming in opposite directions. one wants to change the world, the other wants to lie in a dark room listening to rain","caption":"Mutable water, mixed agenda","tags":["pisces","twofish","mutablewater","piscessun"]},{"id":"pisces-g06","set":"Signs","sign":"pisces","text":"put me in the dmv and i'll be the pisces who forgot the forms, accidentally gave a stranger my ticket number, and still left with the employee's whole life story and a hug","caption":"Bureaucracy, but make it healing","tags":["pisces","dmv","watersign","kindness"]},{"id":"pisces-g07","set":"Signs","sign":"pisces","text":"if we ever do a heist i'll be the pisces who was meant to be the lookout but got distracted by the moon, and now the security guard and i are best friends","caption":"Compromised, but emotionally enriched","tags":["pisces","heist","daydreamer","neptune"]},{"id":"pisces-g08","set":"Signs","sign":"pisces","text":"by royal decree of the pisces sun, all deadlines are hereby softened, all clocks are to be ignored, and naps are formally recognised as a legitimate form of spiritual research","caption":"The kingdom runs on Neptune time","tags":["pisces","royaldecree","piscessun","naps"]},{"id":"pisces-g09","set":"Signs","sign":"pisces","text":"please be advised that your pisces coworker cannot help with the spreadsheet, but can tell from your 'morning' alone that something is going on at home and has bought you a muffin","caption":"Not psychic. Just Pisces.","tags":["pisces","coworker","intuition","empath"]},{"id":"pisces-g10","set":"Signs","sign":"pisces","text":"having a pisces rising means i walk into every room seeming like i'm contemplating something profound, when actually i'm planning my imaginary bakery in a seaside town","caption":"Mysterious, or mentally on holiday","tags":["pisces","piscesrising","risingsign","daydreamer"]},{"id":"pisces-g11","set":"Signs","sign":"pisces","text":"here we observe the pisces in its natural habitat, the bath, where it will remain for ninety minutes rehearsing an argument from 2019 that it has already won seven times in its head","caption":"Hydrated, imaginary and undefeated, as usual","tags":["pisces","naturedocumentary","watersign","overthinking"]},{"id":"pisces-g12","set":"Signs","sign":"pisces","text":"a mars in pisces doesn't fight you. it quietly forgives you, writes a sad song about it, and then that song goes to number one and your entire town knows what you did","caption":"Gentle anger has range","tags":["pisces","piscesmars","marssign","songwriter"]},{"id":"pisces-g13","set":"Signs","sign":"pisces","text":"take me to an art gallery and i'll be the pisces standing in front of one painting of a small boat for forty minutes because i know exactly how the boat feels","caption":"Neptune said relate to the boat","tags":["pisces","artgallery","neptune","sensitive"]},{"id":"pisces-g14","set":"Signs","sign":"pisces","text":"as a pisces friend i will give you advice that is genuinely wise, deeply spiritual and life changing, and then do the exact opposite of it in my own life within the hour","caption":"Wise for others, Neptune for self","tags":["pisces","friendship","jupiter","advice"]},{"id":"pisces-g15","set":"Signs","sign":"pisces","text":"invite me to a wedding and i'll be the pisces crying at the vows, the speeches, the first dance, and the moment the caterer said 'enjoy' with such sincerity","caption":"Weddings are a full emotional workout","tags":["pisces","wedding","sensitive","watersign"]}];

const ST={size:.075,min:.052,wrap:.86,lead:1.14,maxh:.62,shadow:.30,gap:.75,drift:.06};
const $=id=>document.getElementById(id);
const state={text:"",palette:"classic",ink:"light",scale:1,caption:"",tags:[],id:null,playing:true};

// crc32, so default gradients match the batch renderer
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
function crc32(s){const b=new TextEncoder().encode(s);let c=0xFFFFFFFF;for(const x of b)c=CRC[(c^x)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
const defaultPalette=p=>p.palette||ROT[crc32(p.text)%7];

// background: 3x3 grid -> tiny smooth canvas -> blurred upscale + grain
const bgCache={};
function background(name){
  if(bgCache[name])return bgCache[name];
  const m=Math.round(W*ST.drift),bw=W+m,bh=H+m;
  const g=document.createElement("canvas");g.width=3;g.height=3;const gx=g.getContext("2d");
  const id=gx.createImageData(3,3);
  PALETTES[name].forEach((row,y)=>row.forEach((h,x)=>{const i=(y*3+x)*4;id.data[i]=parseInt(h.slice(1,3),16);id.data[i+1]=parseInt(h.slice(3,5),16);id.data[i+2]=parseInt(h.slice(5,7),16);id.data[i+3]=255}));
  gx.putImageData(id,0,0);
  const s=document.createElement("canvas");s.width=6;s.height=6;const sx=s.getContext("2d");sx.imageSmoothingEnabled=true;sx.drawImage(g,0,0,6,6);
  const c=document.createElement("canvas");c.width=bw;c.height=bh;const cx=c.getContext("2d");
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality="high";
  const pad=bw/10;cx.filter=`blur(${bw/40}px)`;cx.drawImage(s,-pad,-pad,bw+2*pad,bh+2*pad);cx.filter="none";
  const d=cx.getImageData(0,0,bw,bh),a=d.data;let r=12345;
  for(let i=0;i<a.length;i+=4){r=(r*1103515245+12345)&0x7fffffff;const n=((r>>16)/32768-.5)*3;a[i]+=n;a[i+1]+=n;a[i+2]+=n}
  cx.putImageData(d,0,0);
  return bgCache[name]=c;
}

// text: keeps line breaks, blank line = paragraph gap, greedy wrap, shrink to fit
function layout(ctx,text,scale){
  let px=W*ST.size*scale;
  for(;;){
    ctx.font=`800 ${px}px Figtree`;
    const lines=[];
    for(const para of text.trim().split("\n")){
      if(!para.trim()){if(lines.length&&lines[lines.length-1]!==null)lines.push(null);continue}
      let cur="";for(const w of para.split(/\s+/).filter(Boolean)){const t=(cur+" "+w).trim();if(ctx.measureText(t).width<=W*ST.wrap||!cur)cur=t;else{lines.push(cur);cur=w}}lines.push(cur);
    }
    const lead=px*ST.lead,h=lead*lines.reduce((s,l)=>s+(l===null?ST.gap:1),0);
    if(h<=H*ST.maxh||px<=W*ST.min*scale)return{px,lines,lead};
    px*=.95;
  }
}
let textLayer=null,textKey="";
function makeText(){
  const key=[state.text,state.ink,state.scale].join("|");if(key===textKey)return textLayer;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const {px,lines,lead}=layout(x,state.text||" ",state.scale);
  x.font=`800 ${px}px Figtree`;x.textAlign="center";x.textBaseline="alphabetic";
  const steps=lines.map(l=>l===null?ST.gap:1),asc=px*.95,desc=px*.25;
  let y=(H-(lead*(steps.reduce((a,b)=>a+b,0)-1)+asc+desc))/2+asc;
  const sh=document.createElement("canvas");sh.width=W;sh.height=H;const s=sh.getContext("2d");
  s.font=x.font;s.textAlign="center";const alpha=state.ink==="light"?ST.shadow:ST.shadow*.35;s.fillStyle=`rgba(0,0,0,${alpha})`;
  const pos=[];lines.forEach((l,i)=>{if(l!==null)pos.push([l,y]);y+=steps[i]*lead});
  pos.forEach(([l,yy])=>s.fillText(l,W/2,yy+px*.05));
  x.filter=`blur(${px*.09}px)`;x.drawImage(sh,0,0);x.filter="none";
  x.fillStyle=state.ink==="light"?"#fff":"#111";pos.forEach(([l,yy])=>x.fillText(l,W/2,yy));
  textKey=key;return textLayer=c;
}
function drawFrame(ctx,t){
  const m=Math.round(W*ST.drift),bg=background(state.palette);
  const ox=Math.round(m*(.5+.5*Math.sin(Math.PI*(t-.5)))),oy=Math.round(m*.5*(1-Math.cos(Math.PI*t))/2);
  ctx.drawImage(bg,ox,oy,W,H,0,0,W,H);ctx.drawImage(makeText(),0,0);
}
const secondsFor=t=>Math.round(Math.min(14,Math.max(6,3+t.split(/\s+/).filter(Boolean).length*.3))*10)/10;

const view=$("view"),vctx=view.getContext("2d");
let t0=performance.now();
function loop(now){
  const dur=secondsFor(state.text||"x")*1000;
  const p=state.playing?((now-t0)%(dur*2))/dur:0;const t=p<=1?p:2-p;
  drawFrame(vctx,t);requestAnimationFrame(loop);
}

// UI
function setStatus(s){$("status").textContent=s}
function renderControls(){
  $("txt").value=state.text;$("cap").value=state.caption;
  $("tags").textContent=state.tags.map(t=>"#"+t).join(" ");
  const w=state.text.split(/\s+/).filter(Boolean).length;$("count").textContent=`${w} words · ${secondsFor(state.text||"x")}s reel${state.id?" · "+state.id:""}`;
  document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.palette));
  document.querySelectorAll("#ink button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.ink));
  document.querySelectorAll(".item").forEach(b=>b.setAttribute("aria-current",b.dataset.id===state.id));
}
function load(p){
  Object.assign(state,{text:p.text,caption:p.caption||"",tags:p.tags||[],palette:defaultPalette(p),ink:p.ink||"light",id:p.id,scale:1});
  $("size").value=1;t0=performance.now();renderControls();
  try{localStorage.setItem("gs-last",p.id)}catch(e){}
}
for(const name of Object.keys(PALETTES)){
  const b=document.createElement("button");b.className="sw";b.dataset.v=name;b.setAttribute("aria-label",name+" gradient");
  const g=PALETTES[name];b.style.background=`linear-gradient(160deg,${g[0][0]},${g[1][1]},${g[2][2]})`;
  b.innerHTML=`<span>${name}</span>`;b.onclick=()=>{state.palette=name;renderControls()};$("sw").append(b);
}
document.querySelectorAll("#ink button").forEach(b=>b.onclick=()=>{state.ink=b.dataset.v;renderControls()});
$("txt").addEventListener("input",e=>{state.text=e.target.value;state.id=null;renderControls()});
$("cap").addEventListener("input",e=>{state.caption=e.target.value});
$("size").addEventListener("input",e=>{state.scale=+e.target.value});
$("play").onclick=()=>{state.playing=!state.playing;$("play").textContent=state.playing?"Pause drift":"Play drift";$("play").setAttribute("aria-pressed",state.playing);t0=performance.now()};
$("rand").onclick=()=>{const l=filtered();const p=l.length?l:POSTS;load(p[Math.floor(Math.random()*p.length)])};
function captionText(){return state.caption.trim()+(state.tags.length?"\n\n"+state.tags.map(t=>"#"+t).join(" "):"")}
$("copyCap").onclick=async()=>{try{await navigator.clipboard.writeText(captionText());setStatus("Caption copied.")}catch(e){$("cap").select();setStatus("Press Ctrl/Cmd+C to copy the selected caption.")}};

// library
const sets=["All sets",...new Set(POSTS.map(p=>p.set))];
$("fset").innerHTML=sets.map(s=>`<option>${s}</option>`).join("");
const signs=["All signs",...new Set(POSTS.map(p=>p.sign).filter(Boolean))];
$("fsign").innerHTML=signs.map(s=>`<option value="${s}">${s[0].toUpperCase()+s.slice(1)}</option>`).join("");
function filtered(){
  const s=$("fset").value,g=$("fsign").value,q=$("fq").value.trim().toLowerCase();
  return POSTS.filter(p=>(s==="All sets"||p.set===s)&&(g==="All signs"||p.sign===g)&&(!q||(p.text+" "+p.caption).toLowerCase().includes(q)));
}
function renderList(){
  const l=filtered();$("libcount").textContent=`${l.length} of ${POSTS.length}`;
  const frag=document.createDocumentFragment();
  for(const p of l.slice(0,400)){
    const b=document.createElement("button");b.className="item";b.dataset.id=p.id;
    const g=PALETTES[defaultPalette(p)];
    const d=document.createElement("span");d.className="dot";d.style.background=`linear-gradient(160deg,${g[0][0]},${g[1][1]},${g[2][2]})`;
    const t=document.createElement("span");const h=document.createElement("b");h.textContent=`${p.id} · ${p.set}`;
    const tx=document.createElement("span");tx.className="t";tx.textContent=p.text.replace(/\n+/g," / ");
    t.append(h,tx);b.append(d,t);b.onclick=()=>load(p);frag.append(b);
  }
  $("list").replaceChildren(frag);renderControls();
}
["fset","fsign"].forEach(i=>$(i).addEventListener("change",renderList));$("fq").addEventListener("input",renderList);

// saving
let downloads=null;
const fname=ext=>(state.id||"gradient-post")+"."+ext;
async function save(filename,data){
  if(!downloads){setStatus("Saving files isn't available in this view. Right-click the preview and choose Save image instead.");return}
  try{await downloads.save({filename,data});setStatus("Saved "+filename+".")}
  catch(e){setStatus(e&&e.code==="declined"?"Save cancelled.":"Couldn't save: "+(e&&e.message||"unknown error"))}
}
$("savePng").onclick=()=>{
  const c=document.createElement("canvas");c.width=W;c.height=H;drawFrame(c.getContext("2d"),0);
  c.toBlob(b=>save(fname("png"),b),"image/png");
};
$("saveVid").onclick=async()=>{
  if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record video. Save the PNG instead.");return}
  const types=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  const type=types.find(t=>MediaRecorder.isTypeSupported(t));if(!type){setStatus("This browser can't record video.");return}
  const ext=type.startsWith("video/mp4")?"mp4":"webm";
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");drawFrame(x,0);
  const stream=c.captureStream(FPS),rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8e6}),chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const dur=secondsFor(state.text||"x");$("saveVid").disabled=true;
  rec.onstop=()=>{$("saveVid").disabled=false;save(fname(ext),new Blob(chunks,{type}))};
  rec.start();const start=performance.now();
  (function step(){const e=(performance.now()-start)/1000;drawFrame(x,Math.min(1,e/dur));setStatus(`Recording ${ext.toUpperCase()}… ${Math.min(dur,e).toFixed(1)}s of ${dur}s`);
    if(e<dur)requestAnimationFrame(step);else rec.stop()})();
};

(async()=>{
  try{await document.fonts.load("800 80px Figtree")}catch(e){}
  let first=POSTS.find(p=>p.id==="libra-f01")||POSTS[0];
  try{const last=localStorage.getItem("gs-last");const f=last&&POSTS.find(p=>p.id===last);if(f)first=f}catch(e){}
  renderList();load(first);requestAnimationFrame(loop);
  document.fonts.ready.then(()=>{textKey=""});
  try{downloads=await window.claude?.use?.("downloads")}catch(e){downloads=null}
  if(!downloads){$("savePng").title=$("saveVid").title="Saving isn't available in this view"}
})();
</script>

libra-f04","set":"Formats","sign":"libra","text":"Being a libra is wild\n\nOne second i'm fighting for justice\n\nThe next i've spent 40 minutes picking a font for my grocery list\n\nBoth were urgent honestly","caption":"Libra carries the scales of justice and an elite eye for aesthetics, often at the same time. Fairness and beauty both matter, and they refuse to rank them. What do you spend way too long making pretty?","tags":["libra","libraseason","aesthetic","relatable","zodiacmemes"],"palette":"aqua"},{"id":"scorpio-f01","set":"Formats","sign":"scorpio","text":"Warning: Scorpio has the power to find your childhood soccer team photo in under 6 minutes using only your first name and a vibe.","caption":"Scorpio is the fixed water sign ruled by Pluto, and their research skills belong in a detective agency. Nothing stays hidden from a curious Scorpio for long. How fast can your Scorpio find something?","tags":["scorpio","scorpiosign","watersigns","astrologymemes","detective"],"palette":"deep"},{"id":"scorpio-f02","set":"Formats","sign":"scorpio","text":"yes that 5'10 scorpio moon who has said nine words to you total, remembers all of yours, and owns exclusively black hoodies is definitely your soulmate go tell them one secret right now\n\n(they already know it)","caption":"A Scorpio moon is intense, private and quietly observant, so they are always listening even when they are silent. They give little away and notice everything. Who is the quiet Scorpio in your life?","tags":["scorpiomoon","scorpio","soulmate","zodiacdating","moonsign"],"palette":"magenta"},{"id":"scorpio-f03","set":"Formats","sign":"scorpio","text":"Why you should tell a scorpio your secrets\n\n1) we'll never tell anyone\n2) we'll never forget it\n3) we'll never tell you our secrets\n4) that's the deal\n\nSigned under a full moon, no refunds","caption":"Scorpio is the most loyal vault in the zodiac, but trust is a one-way door until they decide otherwise. Ruled by Pluto, they value depth, privacy and very long memories. Would you take the deal?","tags":["scorpio","scorpioseason","trust","zodiacmemes","astrology"],"palette":"classic"},{"id":"scorpio-f04","set":"Formats","sign":"scorpio","text":"PSA: a scorpio did not \"just happen\" to see your story 4 seconds after you posted it. a scorpio has been sitting there. a scorpio was waiting. a scorpio is fine.","caption":"Scorpio placements play it cool, but their notifications are always on for the people they care about. Intensity is their love language, even when they pretend otherwise. Is your Scorpio always first to view your story?","tags":["scorpio","zodiacpsa","scorpiomemes","watersign","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"sagittarius-f01","set":"Formats","sign":"sagittarius","text":"Sagittarius logic\n\nEither i find myself in another country\n\nOr i lose myself in another country\n\nEither way i'm booking the flight tonight","caption":"Sagittarius is the mutable fire sign ruled by Jupiter, the planet of expansion, adventure and slightly reckless optimism. Every problem looks smaller from a window seat. Where would your Sagittarius book tonight?","tags":["sagittarius","sagittariussun","firesigns","wanderlust","astrology"],"palette":"sunset"},{"id":"sagittarius-f02","set":"Formats","sign":"sagittarius","text":"Would you Rather:\n\ntie down a sagittarius\n\nOR\n\ntie a bow on a weather balloon\n\n(the balloon has better odds)","caption":"Sagittarius values freedom above almost everything, so commitment needs room to roam. They love deeply, just with the windows open. Which one are you choosing?","tags":["sagittarius","wouldyourather","commitmentissues","zodiacmemes","sagseason"],"palette":"lime","ink":"dark"},{"id":"sagittarius-f03","set":"Formats","sign":"sagittarius","text":"Sagittarius sun core is saying \"i'm so blunt it's a gift\" and then telling the barista their latte art looks like a sad little horse","caption":"Sagittarius is the zodiac's truth teller, honest to the point of accidental comedy. Their symbol is the centaur archer, so honestly the horse comment is personal. What is the bluntest thing a Sag has said to you?","tags":["sagittarius","sagittariussun","honesty","relatable","astrologyhumor"],"palette":"rainbow"},{"id":"sagittarius-f04","set":"Formats","sign":"sagittarius","text":"Warning: Sagittarius has the power to say the most accurate, unforgivable thing about your situationship and then immediately ask if you want to go on a road trip.","caption":"Sagittarius friends deliver hard truths with zero warning and an adventure as the chaser. Jupiter makes them blunt, generous and impossible to stay mad at. Has a Sag ever read your situationship like this?","tags":["sagittarius","situationship","zodiacfriends","astrologymemes","sag"],"palette":"classic"},{"id":"capricorn-f01","set":"Formats","sign":"capricorn","text":"yes that 6'0 capricorn sun who replies \"noted\" to your paragraph, owns one good coat and has a five year plan with your name in pencil is definitely your soulmate go schedule a meeting about it right now","caption":"Capricorn is the cardinal earth sign ruled by Saturn, so romance comes with a timeline and a budget. They are reserved at first, but once you make the plan, it is permanent ink. Has a Capricorn ever replied noted to your paragraph?","tags":["capricorn","capricornsun","earthsigns","soulmate","zodiacdating"],"palette":"deep"},{"id":"capricorn-f02","set":"Formats","sign":"capricorn","text":"My capricorn moon's self care routine\n\n1) answer emails\n2) answer emails in a candlelit bath\n3) make a spreadsheet of my feelings\n4) close the spreadsheet\n\nGreat session. see you next fiscal year","caption":"A Capricorn moon processes emotions through productivity, structure and the occasional spreadsheet. Rest feels suspicious, so they make it efficient. What does self care actually look like for you?","tags":["capricornmoon","capricorn","selfcare","moonsign","astrologymemes"],"palette":"aqua"},{"id":"capricorn-f03","set":"Formats","sign":"capricorn","text":"PSA: a capricorn is not emotionally unavailable. they are emotionally available by appointment, between 6:15 and 6:30pm, after the gym, if you book in advance.","caption":"Capricorns get called emotionally unavailable, but really their feelings just run on a calendar. Saturn-ruled and disciplined, they show up consistently once you are on the schedule. Have you booked your slot?","tags":["capricorn","zodiacpsa","emotionallyunavailable","capricornseason","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"capricorn-f04","set":"Formats","sign":"capricorn","text":"Capricorn math\n\nIf i rest i'll fall behind\n\nIf i don't rest i'll burn out\n\nSo i've decided to burn out efficiently, ahead of schedule","caption":"Capricorn ambition is legendary, and so is their complicated relationship with taking a day off. They are the zodiac's CEO even on vacation. Are you resting this weekend or optimizing?","tags":["capricorn","hustleculture","workaholic","relatable","zodiacmemes"],"palette":"magenta"},{"id":"aquarius-f01","set":"Formats","sign":"aquarius","text":"Warning: Aquarius has the power to care deeply about the future of humanity and also leave you on read for nine days because they were thinking about octopuses.","caption":"Aquarius is the fixed air sign ruled by Uranus, and their brains live somewhere between a science documentary and a protest sign. They love humanity in general and texting back less in particular. What is your Aquarius obsessed with this week?","tags":["aquarius","aquariussign","airsigns","astrologymemes","leftonread"],"palette":"rainbow"},{"id":"aquarius-f02","set":"Formats","sign":"aquarius","text":"Would you Rather:\n\nunderstand an aquarius\n\nOR\n\nunderstand a dolphin's group chat\n\n(the dolphin will at least reply)","caption":"Aquarius is famously unpredictable, original and a little bit unreachable. They are worth the effort, but you need patience and possibly sonar. Which one are you picking?","tags":["aquarius","wouldyourather","aquariusseason","zodiacmemes","dolphins"],"palette":"lime","ink":"dark"},{"id":"aquarius-f03","set":"Formats","sign":"aquarius","text":"Aquarius moon core is ignoring a text from someone i love and then spending two hours explaining my feelings to a stranger on a train. it felt easier. we're basically family now","caption":"An Aquarius moon processes feelings with a bit of distance, which is why strangers sometimes get the full story first. Detached does not mean uncaring, it means it is complicated. Are you this Aquarius moon?","tags":["aquariusmoon","aquarius","moonsign","relatable","astrology"],"palette":"deep"},{"id":"aquarius-f04","set":"Formats","sign":"aquarius","text":"Why you should date an aquarius\n\n1) we're unpredictable\n2) we're very loyal\n3) we have a theory about the pyramids\n4) we'll explain it on the first date\n\nThe second date is also about the pyramids","caption":"Dating an Aquarius means loyalty, originality and at least one documentary-level theory per dinner. Uranus gives them strange, brilliant minds that never stop asking questions. What theory would your Aquarius bring to the first date?","tags":["aquarius","zodiacdating","aquariuslove","astrologyhumor","airsign"],"palette":"classic"},{"id":"pisces-f01","set":"Formats","sign":"pisces","text":"yes that 5'5 pisces moon who cried at a car commercial, believes in your potential more than you do and has fourteen half-written songs about the moon is definitely your soulmate go send them a voice memo right now","caption":"A Pisces moon feels everything, dreams big and loves people for who they could become. Neptune makes them romantic, creative and a little bit psychic. Which commercial made your Pisces cry this week?","tags":["piscesmoon","pisces","soulmate","watersigns","zodiacdating"],"palette":"magenta"},{"id":"pisces-f02","set":"Formats","sign":"pisces","text":"Being a pisces is wild\n\nOne second i'm psychic\n\nThe next i've walked into a glass door i walk through every day\n\nThe universe gives and the universe takes","caption":"Pisces is the mutable water sign ruled by Neptune, so intuition is strong but spatial awareness is optional. They can read your mind but not the room layout. What is your most Pisces moment?","tags":["pisces","piscessun","intuition","relatable","astrologymemes"],"palette":"aqua"},{"id":"pisces-f03","set":"Formats","sign":"pisces","text":"PSA: a pisces staring into space is not ignoring you. a pisces is living a full second life in which they own a bakery in portugal. please wait for them to come back.","caption":"Pisces placements are the zodiac's daydreamers, with a rich inner world that is frequently more interesting than a meeting. Neptune rules imagination and escape, so they visit often. What is your daydream life?","tags":["pisces","zodiacpsa","daydreamer","piscesseason","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"pisces-f04","set":"Formats","sign":"pisces","text":"Warning: Pisces has the power to absorb the mood of every single person in the room and then go home and need a nap about it.","caption":"Pisces is the most empathic sign in the zodiac, soaking up every feeling like an emotional sponge. That sensitivity is a gift, but it does come with mandatory recovery naps. Do you need a nap after every party too?","tags":["pisces","empath","watersign","zodiacmemes","astrology"],"palette":"deep"},{"id":"htx-aries-01","set":"Houston","sign":"aries","text":"my aries mars does not 'miss the exit'. i take the feeder, catch the light, u-turn under the overpass and rejoin the katy freeway forty seconds ahead of you, which is the only number i care about","caption":"The feeder road was built for people like us","tags":["aries","houston","htx","katyfreeway","ariesmars"]},{"id":"htx-aries-02","set":"Houston","sign":"aries","text":"your honor, my aries client did not 'cut across four lanes of 610'. she saw the galleria exit at the last possible second and made a leadership decision. the other drivers are simply not leaders","caption":"The West Loop rewards commitment","tags":["aries","houston","610","houstontraffic","cardinalfire"]},{"id":"htx-aries-03","set":"Houston","sign":"aries","text":"i got an ez tag for the same reason i do everything as an aries: so i never have to slow down. not for the toll plaza on beltway 8, not for traffic, and definitely not for my own feelings","caption":"Toll paid. Emotions skipped.","tags":["aries","houston","eztag","beltway8","htx"]},{"id":"htx-aries-04","set":"Houston","sign":"aries","text":"i was told mutton bustin at the rodeo is for children under a certain weight. as an aries i heard the word 'competition' and stopped listening. security at nrg has asked me to sit down twice","caption":"Cardinal fire versus one very confused sheep","tags":["aries","houston","rodeohouston","muttonbustin","houstonastrology"]},{"id":"htx-aries-05","set":"Houston","sign":"aries","text":"every hurricane season my aries sun buys zero supplies until the first cone of uncertainty, then i'm at h-e-b at 6am treating the water aisle like game seven. i do not need forty cases. i need to win","caption":"Hurricane prep, but make it a contact sport","tags":["aries","houston","hurricaneseason","heb","htx"]},{"id":"htx-aries-06","set":"Houston","sign":"aries","text":"an aries will leave an astros game at daikin park in the seventh inning to beat traffic on 59, hear the comeback on the radio, and genuinely feel like they won both","caption":"First out of the garage is still first","tags":["aries","houston","astros","daikinpark","houstontx"]},{"id":"htx-taurus-01","set":"Houston","sign":"taurus","text":"my taurus love language is pulling off i-10 at the katy buc-ee's, buying you a brisket sandwich and saying nothing. if i hand you the beaver nuggets first, we are basically engaged","caption":"Venus-ruled and fluent in gas station brisket","tags":["taurus","houston","bucees","katytx","taurusvenus"]},{"id":"htx-taurus-02","set":"Houston","sign":"taurus","text":"your honor, my taurus client did not 'refuse to leave the line at the breakfast klub'. she had already waited forty minutes for chicken and waffles and now considers that spot her legal residence","caption":"Fixed earth does not abandon a queue","tags":["taurus","houston","breakfastklub","midtownhouston","htx"]},{"id":"htx-taurus-03","set":"Houston","sign":"taurus","text":"a taurus in houston has two seasons: crawfish season and waiting for crawfish season. please do not invite my taurus moon anywhere in july unless there is a viet-cajun boil on bellaire involved","caption":"Weather is irrelevant. Mudbugs are the calendar.","tags":["taurus","houston","crawfishseason","vietcajun","taurusmoon"]},{"id":"htx-taurus-04","set":"Houston","sign":"taurus","text":"minutes from the katy hoa meeting: the taurus in cinco ranch has been asked for the fourth time to repaint her shutters. she has replied for the fourth time that she likes them. item closed","caption":"The HOA met a fixed sign and lost","tags":["taurus","houston","katy","hoa","fixedearth"]},{"id":"htx-taurus-05","set":"Houston","sign":"taurus","text":"my taurus sun has ordered the same number one at the same whataburger off the north freeway since 2009. they announced new menu items. i was informed. i was not moved","caption":"Loyalty, with grilled onions","tags":["taurus","houston","whataburger","taurussun","htx"]},{"id":"htx-taurus-06","set":"Houston","sign":"taurus","text":"my taurus placements walked into gallery furniture 'just to look' and left four hours later with a recliner, a mattress and a deep respect for mattress mack. for a taurus, comfort is not a purchase. it's a value system","caption":"He did, in fact, save me money","tags":["taurus","houston","galleryfurniture","mattressmack","houstontx"]},{"id":"htx-gemini-01","set":"Houston","sign":"gemini","text":"a gemini will tell you everything in houston is twenty minutes away. the heights, twenty minutes. sugar land, twenty minutes. galveston, twenty minutes. my gemini mercury is not lying. it simply believes in me","caption":"H-Town distance is measured in optimism","tags":["gemini","houston","htx","geminimercury","houstontraffic"]},{"id":"htx-gemini-02","set":"Houston","sign":"gemini","text":"my gemini sun has a 713 number for the friends i met in montrose and a 281 number for the friends i met in katy, and those two group chats have never once been in the same room","caption":"Two area codes, one very busy twin","tags":["gemini","houston","713","281","geminisun"]},{"id":"htx-gemini-03","set":"Houston","sign":"gemini","text":"as a gemini i change lanes on 59 the way i change opinions: constantly, confidently, and with a turn signal that is technically on but has not been relevant since bellaire","caption":"Mutable air, mutable lane","tags":["gemini","houston","houstondrivers","htx","mutableair"]},{"id":"htx-gemini-04","set":"Houston","sign":"gemini","text":"i went to the rothko chapel to sit in silence with my thoughts, which as a gemini meant sitting in silence with eleven thoughts all talking at once, two of them about tacos after","caption":"The chapel was quiet. The gemini was not.","tags":["gemini","houston","rothkochapel","montrose","houstonastrology"]},{"id":"htx-gemini-05","set":"Houston","sign":"gemini","text":"at the rodeo my gemini rising did the cook-off, the carnival, the pig races and the concert. when someone asked which one i actually came for, i said yes, obviously, all of them, in that order and also reversed","caption":"RodeoHouston, but every tab open at once","tags":["gemini","houston","rodeohouston","geminirising","htx"]},{"id":"htx-gemini-06","set":"Houston","sign":"gemini","text":"dating a gemini is skating laps at the galleria ice rink while they narrate the love lives of every couple under the giant tree. they have never met any of them. they have detailed theories about all of them","caption":"Mercury-ruled and very invested in strangers","tags":["gemini","houston","galleria","iceskating","geminienergy"]},{"id":"htx-cancer-01","set":"Houston","sign":"cancer","text":"every june my cancer moon updates her hurricane kit: water, batteries, flashlight, our old texts, the hoodie you left in my car and a photo of us at the hermann park reflection pool, in case of emotional landfall","caption":"Prepared for every storm except you","tags":["cancer","houston","hurricaneseason","hermannpark","cancermoon"]},{"id":"htx-cancer-02","set":"Houston","sign":"cancer","text":"a cancer will move across the country and still keep the 713 number, purely so my mom's phone shows the same contact photo it has since 2008. that is not a phone plan. that is an heirloom","caption":"Moon-ruled and permanently area code 713","tags":["cancer","houston","713","htx","cancersun"]},{"id":"htx-cancer-03","set":"Houston","sign":"cancer","text":"my cancer sun cannot drive past a shipley do-nuts without remembering every saturday my dad bought a dozen glazed and let me hold the box in the back seat. i'm not crying. it's the humidity","caption":"Glazed, warm and deeply sentimental","tags":["cancer","houston","shipleydonuts","houstontx","watersign"]},{"id":"htx-cancer-04","set":"Houston","sign":"cancer","text":"as a crab, my cancer sun feels a complicated kinship at every viet-cajun crawfish boil. i still eat four pounds. i just make eye contact with the tray and say 'nothing personal' first","caption":"Crustacean solidarity has its limits","tags":["cancer","houston","crawfish","vietcajun","cancerseason"]},{"id":"htx-cancer-05","set":"Houston","sign":"cancer","text":"my cancer moon still waves at the astrodome every time i drive past it on 610. it's not doing anything. neither am i. we are just two old souls holding onto the good years","caption":"The Eighth Wonder and its most loyal fan","tags":["cancer","houston","astrodome","cancermoon","houstontx"]},{"id":"htx-cancer-06","set":"Houston","sign":"cancer","text":"inviting a cancer to a party outside the loop is a two-step process. first you invite her. then you wait three business days while she decides if her feelings can survive beltway 8 after dark","caption":"The shell does not travel past the Beltway lightly","tags":["cancer","houston","insidetheloop","beltway8","homebody"]},{"id":"htx-leo-01","set":"Houston","sign":"leo","text":"my leo sun did not get candy paint and swangas because i 'wanted attention'. the houston sun is out most of the year and frankly it deserves something to look at","caption":"Slab culture, but make it sun-ruled","tags":["leo","houston","slab","candypaint","leosun"]},{"id":"htx-leo-02","set":"Houston","sign":"leo","text":"i entered the art car parade on allen parkway and as a leo i'd like to clarify that it is no longer a car. it is a float with my face on both doors and a speaker that only plays applause","caption":"Main character, now street legal","tags":["leo","houston","artcarparade","allenparkway","leoenergy"]},{"id":"htx-leo-03","set":"Houston","sign":"leo","text":"a leo does not 'go to the galleria'. a leo arrives at the galleria, does one slow lap of the ice rink so the second floor can see, buys nothing and leaves completely fulfilled","caption":"The rink is a runway if you believe","tags":["leo","houston","galleria","uptownhouston","fixedfire"]},{"id":"htx-leo-04","set":"Houston","sign":"leo","text":"go texan day is the one day a year my leo rising can wear rhinestone boots, fringe and a hat the size of a satellite dish to a quarterly budget meeting, and hr has to call it heritage","caption":"Western wear, Leo volume","tags":["leo","houston","gotexanday","rodeohouston","leorising"]},{"id":"htx-leo-05","set":"Houston","sign":"leo","text":"my leo venus has one dating rule: if we go to a rockets game at toyota center and the kiss cam finds us, you commit. you do not wave it off. you do not laugh. you give the people a show","caption":"The Jumbotron is a sacred contract","tags":["leo","houston","rockets","toyotacenter","leovenus"]},{"id":"htx-leo-06","set":"Houston","sign":"leo","text":"as a leo i fully understand mattress mack. if i owned a furniture store i would also stand in front of the camera and promise to save you money with my whole chest. that's not marketing. that's a leo sun with a warehouse","caption":"Respect to the most Leo energy in H-Town","tags":["leo","houston","mattressmack","galleryfurniture","leosun"]},{"id":"htx-virgo-01","set":"Houston","sign":"virgo","text":"my virgo moon will eat the sausage kolache from shipley, enjoy it, then gently explain to the whole office that technically it's a klobasnik. nobody asked. next time i'm bringing a pamphlet","caption":"Correct, unprompted and holding a glazed","tags":["virgo","houston","kolache","klobasnik","virgomoon"]},{"id":"htx-virgo-02","set":"Houston","sign":"virgo","text":"a virgo will sit down for tex-mex, order the fajitas, and walk the table through the history of ninfa's on navigation before the queso arrives. we are not fun at dinner. we are, however, correct","caption":"Tex-Mex, served with footnotes and a citation","tags":["virgo","houston","texmex","fajitas","houstonfood"]},{"id":"htx-virgo-03","set":"Houston","sign":"virgo","text":"my virgo sun has tracked the i-45 construction in a color-coded spreadsheet for years. i have no authority. no one asked. but somebody has to know which lanes are closed tonight and it might as well be me","caption":"TxDOT has a project manager. So do I.","tags":["virgo","houston","i45","houstontraffic","virgosun"]},{"id":"htx-virgo-04","set":"Houston","sign":"virgo","text":"the hurricane kit of a houston virgo: labeled water, sorted batteries, a laminated evacuation route and a spare kit for the friend who has been 'meaning to get to it' for six seasons. that friend is a sagittarius","caption":"Prepared for the storm and for you","tags":["virgo","houston","hurricaneprep","htx","mutableearth"]},{"id":"htx-virgo-05","set":"Houston","sign":"virgo","text":"a virgo runs the memorial park loop at 6am, logs the exact three miles, then drafts a polite note to the conservancy about a mile marker that feels four feet off. we love the park. we love accuracy more","caption":"Personal best, professional concerns","tags":["virgo","houston","memorialpark","running","virgoplacements"]},{"id":"htx-virgo-06","set":"Houston","sign":"virgo","text":"my virgo rising spent ninety minutes on my hair, walked from the car to a patio in midtown and arrived looking gently microwaved. houston humidity is the only thing that has ever corrected a virgo","caption":"Ninety minutes of work, undone in one block","tags":["virgo","houston","humidity","virgorising","htx"]},{"id":"htx-x-01","set":"Houston","sign":"","text":"mercury retrograde in houston just means the feeder is closed, the u-turn is closed, the detour is closed, and the gps lady has started sounding like she personally needs a hug","caption":"Retrograde, or just Tuesday in H-Town","tags":["houston","mercuryretrograde","htx","houstontraffic","astrologymemes"]},{"id":"htx-x-02","set":"Houston","sign":"","text":"every houston birth chart has the same hidden placement: the urge to wear a puffer jacket to h-e-b the second it drops below 65 degrees. we have never needed the puffer. we know this. we wear it anyway","caption":"Two seasons, one emotionally necessary jacket","tags":["houston","coldfront","htx","houstonweather","astrologyhumor"]},{"id":"htx-x-03","set":"Houston","sign":"","text":"you can read a houstonian's whole birth chart from their answer to 'how far is the galleria'. 'fifteen minutes' is fire. 'depends on 610' is earth. a long sigh is water. 'i've never been' is a lie","caption":"Element assigned by commute","tags":["houston","galleria","houstontx","houstonastrology","zodiachumor"]},{"id":"htx-x-04","set":"Houston","sign":"","text":"the astrologer said my venus is in a tense aspect this month and honestly so is everyone on the katy freeway at 5:15. we are all just trying to merge with someone who has made it clear they are not letting us in","caption":"Venus and I-10 are both difficult right now","tags":["houston","katyfreeway","venus","htx","houstontraffic"]},{"id":"htx-libra-01","set":"Houston","sign":"libra","text":"my libra sun and i have been idling on the feeder for forty minutes because the group asked me to pick between pappasito's and ninfa's on navigation, and choosing one would be a public statement against the other","caption":"Nobody ate. Everyone felt respected.","tags":["libra","houston","htx","houstonfood"]},{"id":"htx-libra-02","set":"Houston","sign":"libra","text":"a libra cannot order at whataburger without first polling the table, then the car, then the person holding table tent number 47, who frankly has strong feelings about spicy ketchup and deserves to be heard","caption":"Democracy, served 24 hours a day","tags":["libra","houston","whataburger","houstonastrology"]},{"id":"htx-libra-03","set":"Houston","sign":"libra","text":"as a libra venus i planned the perfect first date at the rothko chapel. beautiful, quiet, free. we sat in sacred silence for an hour. i called it intimacy. they called it the longest job interview of their life","caption":"Venus picked the venue. Venus did not read the room.","tags":["libra","libravenus","houston","montrose"]},{"id":"htx-libra-04","set":"Houston","sign":"libra","text":"put a libra on the judging panel at the rodeo bar-b-que contest and i will taste 250 briskets, tell every team theirs was the most moving, and submit a scorecard that just says 'yes'","caption":"The scales are balanced. The brisket is not ranked.","tags":["libra","houston","rodeohouston","bbq"]},{"id":"htx-libra-05","set":"Houston","sign":"libra","text":"my libra rising keeps two phone numbers, one 713 and one 281, so whoever i'm talking to feels like i'm from their side of the beltway. this is not deception. this is venus doing community outreach","caption":"Inside the loop, outside the loop, always on your side","tags":["libra","librarising","houston","htx"]},{"id":"htx-libra-06","set":"Houston","sign":"libra","text":"my libra moon and i rented a pedal boat on mcgovern lake in hermann park and spent the full thirty minutes making sure we were both pedaling exactly equally. we did not move. but it was fair","caption":"Thirty minutes, zero distance, perfect balance","tags":["libra","libramoon","houston","hermannpark"]},{"id":"htx-scorpio-01","set":"Houston","sign":"scorpio","text":"my scorpio moon does not check the weather app. i simply know which underpasses on shepherd and memorial are about to flood, the same way i know which of my friends is about to lie to me","caption":"Pluto has better radar than the news","tags":["scorpio","scorpiomoon","houston","houstonweather"]},{"id":"htx-scorpio-02","set":"Houston","sign":"scorpio","text":"a scorpio does not go to the galleria to shop. a scorpio goes to the galleria to sit by the ice rink, nurse one coffee for four hours and quietly learn everything about everyone","caption":"Window shopping, but the windows are people","tags":["scorpio","houston","galleria","houstontx"]},{"id":"htx-scorpio-03","set":"Houston","sign":"scorpio","text":"the scorpio in me reads my ez tag statement like a detective reads a crime scene. you said you were at your mom's in pearland all weekend. the hardy toll road would like a word","caption":"Every toll is a receipt. Every receipt is evidence.","tags":["scorpio","houston","eztag","houstonastrology"]},{"id":"htx-scorpio-04","set":"Houston","sign":"scorpio","text":"your honor, my client is a scorpio mars. she did not 'refuse to let him merge' on the katy freeway. she simply remembered that he cut her off at that exact exit in 2019, and she has been waiting","caption":"The defense rests. The grudge does not.","tags":["scorpio","scorpiomars","houston","katyfreeway"]},{"id":"htx-scorpio-05","set":"Houston","sign":"scorpio","text":"a scorpio at a viet-cajun crawfish spot on bellaire is silent, focused and surrounded by a terrifying pile of shells. we are not antisocial. we are getting to the bottom of something, which is our entire personality","caption":"Pluto rules the underworld and the bottom of the bag","tags":["scorpio","houston","crawfish","houstonfood"]},{"id":"htx-scorpio-06","set":"Houston","sign":"scorpio","text":"scorpio is a fixed water sign, which explains why i thrive in houston in august. the air is ninety percent water, nobody can see clearly, and everyone is sweating about something they refuse to talk about","caption":"Humidity is just the city keeping secrets","tags":["scorpio","houston","houstonweather","watersign"]},{"id":"htx-sagittarius-01","set":"Houston","sign":"sagittarius","text":"my sagittarius sun cannot pass a buc-ee's on i-10 without stopping. not for gas, not for the bathroom. i go in for one brisket sandwich and come out with beaver nuggets, a deer feeder and a plan to move to wyoming","caption":"Jupiter expands everything, including the cart","tags":["sagittarius","houston","bucees","roadtrip"]},{"id":"htx-sagittarius-02","set":"Houston","sign":"sagittarius","text":"as a sagittarius i will tell you everything in houston is twenty minutes away. kemah, twenty minutes. the woodlands, twenty minutes. this is not a lie. it is jupiter, the planet of optimism, doing my directions","caption":"Twenty minutes is a feeling, not a distance","tags":["sagittarius","houston","htx","houstontraffic"]},{"id":"htx-sagittarius-03","set":"Houston","sign":"sagittarius","text":"put a sagittarius at a woodlands covenants meeting and i will be the one who stands up during the mailbox color debate to ask, respectfully, whether any of us are actually happy","caption":"Point of order: what is the meaning of life","tags":["sagittarius","houston","thewoodlands","hoa"]},{"id":"htx-sagittarius-04","set":"Houston","sign":"sagittarius","text":"my sagittarius moon booked a spontaneous beach trip to find myself and ended up in galveston, which counts. i stood on the seawall, ate a funnel cake on the pleasure pier and said 'honestly, this is basically europe'","caption":"Passport not required. Confidence was.","tags":["sagittarius","sagittariusmoon","houston","galveston"]},{"id":"htx-sagittarius-05","set":"Houston","sign":"sagittarius","text":"my sagittarius rising will drive to bush intercontinental at 4am for a cheaper flight to anywhere, even though hobby is closer, because the airport with 'intercontinental' in the name simply feels more like destiny","caption":"Hobby is for errands. IAH is for prophecy.","tags":["sagittarius","sagittariusrising","houston","travel"]},{"id":"htx-sagittarius-06","set":"Houston","sign":"sagittarius","text":"a sagittarius heard about the rodeo trail rides camping in memorial park and immediately asked where to get a horse. i have never ridden one. i am, however, half horse, which jupiter says counts as experience","caption":"The centaur has entered the trail ride group chat","tags":["sagittarius","houston","rodeohouston","firesign"]},{"id":"htx-capricorn-01","set":"Houston","sign":"capricorn","text":"a capricorn does not get stuck on the katy freeway. a capricorn studies it for five years, buys a townhouse two exits closer, and leaves at 5:52am, smiling, while you are still looking for your keys","caption":"Saturn does not do rush hour","tags":["capricorn","houston","katyfreeway","houstontraffic"]},{"id":"htx-capricorn-02","set":"Houston","sign":"capricorn","text":"the capricorn at space center houston is not here for the rockets. we are reading the mission control org chart, noting who reported to whom, and quietly drafting a ten year plan to run the moon","caption":"One small step for man, one quarterly review for the goat","tags":["capricorn","houston","spacecity","nasa"]},{"id":"htx-capricorn-03","set":"Houston","sign":"capricorn","text":"every hurricane season my capricorn sun has the water, batteries and canned goods bought by may. when the storm finally shows up on the news and everyone sprints to h-e-b, i simply sit at home and feel correct","caption":"Prepared since May. Smug since June.","tags":["capricorn","houston","hurricaneseason","heb"]},{"id":"htx-capricorn-04","set":"Houston","sign":"capricorn","text":"my capricorn saturn deeply admires mattress mack. a man who bets on the astros, hedges the bet, then refunds the whole city is not gambling. that is a capricorn with a microphone and a furniture store","caption":"Risk management, but make it local legend","tags":["capricorn","houston","astros","houstontx"]},{"id":"htx-capricorn-05","set":"Houston","sign":"capricorn","text":"the astros do not really do rain delays at daikin park, because someone built a roof over the problem. that is not baseball. that is my capricorn rising, removing weather from the equation and calling it a plan","caption":"Saturn would like to thank the roof","tags":["capricorn","capricornrising","houston","astros"]},{"id":"htx-capricorn-06","set":"Houston","sign":"capricorn","text":"the i-45 expansion is expected to take about eighteen years, which my capricorn sun respects. that is not a delay. that is a construction project with capricorn energy: slow, expensive and finishing just to prove you wrong","caption":"Patience is a freeway","tags":["capricorn","houston","i45","houstontraffic"]},{"id":"htx-aquarius-01","set":"Houston","sign":"aquarius","text":"an aquarius does not attend the art car parade. an aquarius has been building a car shaped like a giant mood ring in the garage for three years and refuses to explain it to the neighbors","caption":"Uranus approved the permit. The HOA did not.","tags":["aquarius","houston","artcarparade","houstonart"]},{"id":"htx-aquarius-02","set":"Houston","sign":"aquarius","text":"as an aquarius i refuse to say feeder road. i say frontage road, out loud, in houston, at full volume, and i will plant my flag on this hill, which to be fair is the only hill houston has","caption":"Fixed air, fixed opinion, flat city","tags":["aquarius","houston","htx","houstonastrology"]},{"id":"htx-aquarius-03","set":"Houston","sign":"aquarius","text":"my aquarius moon respects slab culture deeply, because a candy painted car rolling slow down the block, trunk open, playing a song slowed to half speed is the most unbothered thing humanity has ever invented","caption":"Detached, but make it swangin","tags":["aquarius","aquariusmoon","houston","slab"]},{"id":"htx-aquarius-04","set":"Houston","sign":"aquarius","text":"an aquarius friend will ignore your texts for a week, then appear at a 2am pho spot on bellaire with three strangers from a philosophy forum and act like this was always the plan","caption":"Unreachable until suddenly very reachable","tags":["aquarius","houston","bellaireblvd","houstonfood"]},{"id":"htx-aquarius-05","set":"Houston","sign":"aquarius","text":"my aquarius placements have a fully drafted, deeply unsolicited plan for the astrodome. it involves an indoor rainforest, a community garden and a co-op. nobody asked. i have emailed the county twice","caption":"The Eighth Wonder needs a ninth idea","tags":["aquarius","houston","astrodome","houstontx"]},{"id":"htx-aquarius-06","set":"Houston","sign":"aquarius","text":"put an aquarius at johnson space center and i will skip the gift shop, find an engineer on break and ask, as a concerned citizen, why we keep going back to the moon when space is right there","caption":"Ruled by Uranus, which is technically further","tags":["aquarius","houston","spacecity","nasa"]},{"id":"htx-pisces-01","set":"Houston","sign":"pisces","text":"my pisces moon went to a free show at miller outdoor theatre, sat on the hill and cried at a children's ballet, a sunset and a stranger offering me bug spray. it was ninety degrees at 9pm and i have never felt more seen","caption":"Neptune does not need a ticket","tags":["pisces","piscesmoon","houston","hermannpark"]},{"id":"htx-pisces-02","set":"Houston","sign":"pisces","text":"pisces is a water sign, which is why when my street in midtown floods after twenty minutes of rain, i do not panic. i stand on the porch, feel at one with it, and text my ex","caption":"Mutable water in a city that agrees","tags":["pisces","houston","houstonweather","watersign"]},{"id":"htx-pisces-03","set":"Houston","sign":"pisces","text":"as a pisces i only listen to music chopped and screwed, because life is already moving way too fast and dj screw was the only one who understood my feelings need to be played at half speed","caption":"Slowed down so the feelings can keep up","tags":["pisces","houston","djscrew","houstonmusic"]},{"id":"htx-pisces-04","set":"Houston","sign":"pisces","text":"my pisces venus fell in love on buffalo bayou because we watched the bats leave the waugh drive bridge at sunset and he said 'wow.' we are now planning a life together. he does not know this yet","caption":"Venus is exalted in Pisces and also near a bridge","tags":["pisces","piscesvenus","houston","buffalobayou"]},{"id":"htx-pisces-05","set":"Houston","sign":"pisces","text":"a pisces on the kemah boardwalk will spend forty dollars on one game trying to win a stuffed dolphin, not because i want it, but because it looked lonely and neptune said we are bringing it home","caption":"It was not won. It was adopted.","tags":["pisces","houston","kemah","houstonastrology"]},{"id":"htx-pisces-06","set":"Houston","sign":"pisces","text":"my pisces sun cannot say no, which is how a quick stop at shipley for one dozen turned into four dozen, a box of kolaches for the office and a ride to the airport for the cashier's cousin","caption":"Boundaries dissolve. So does the glaze.","tags":["pisces","houston","shipleys","kolaches"]},{"id":"htx-y-01","set":"Houston","sign":"","text":"mercury retrograde in houston is just a normal tuesday on 610. three missed exits, two u-turns under the same overpass, and a text to the group chat that says 'there in five' from somewhere on beltway 8","caption":"Retrograde or Tuesday, the loop does not care","tags":["houston","mercuryretrograde","610loop","houstontraffic"]},{"id":"htx-y-02","set":"Houston","sign":"","text":"the stars say it is sweater weather. the stars do not live in houston. it is november, it is eighty-four degrees, and i am wearing the sweater in an h-e-b parking lot out of pure spite","caption":"Houston has two seasons and both are summer","tags":["houston","htx","houstonweather","astrologymemes"]},{"id":"htx-y-03","set":"Houston","sign":"","text":"your rising sign is how strangers see you. your houston rising sign is your area code. 713 says 'i was here first.' 281 says 'i have a pool.' 832 says 'same phone since 2004.' 346 is still introducing itself","caption":"Check your chart. Then check your area code.","tags":["houston","713","281","houstonastrology"]},{"id":"htx-y-04","set":"Houston","sign":"","text":"nobody warns you that your saturn return comes with a toll tag. at twenty-nine you stop being a kid and start receiving monthly statements from the westpark tollway like letters from a strict uncle","caption":"Saturn returns, and so does the invoice","tags":["houston","saturnreturn","eztag","htx"]},{"id":"htx-astro-01","set":"Houston","sign":"mercury","text":"i would like to formally inform txdot that mercury does not actually move backwards during retrograde. it only looks that way from earth. the same is true of my car on the katy freeway at 5:40 pm","caption":"an optical illusion, per the astronomers and the traffic cameras","tags":["houston","katyfreeway","mercuryretrograde","htxtraffic"]},{"id":"htx-astro-02","set":"Houston","sign":"mercury","text":"mercury retrograde is just the universe putting you on the feeder road. you can see exactly where you meant to go. it is right there, running next to you. the only way back is a u-turn under the overpass","caption":"the texas u-turn is a spiritual practice","tags":["houston","feederroad","mercuryretrograde","htx"]},{"id":"htx-astro-03","set":"Houston","sign":"mercury","text":"per my records, my ez tag stopped reading the exact day mercury stationed retrograde. hctra says it's the windshield. i say the planet of communication is not speaking to the toll plaza, and frankly neither am i","caption":"the toll bill is also in pre shadow","tags":["houston","eztag","mercuryretrograde","houstonastrology"]},{"id":"htx-astro-04","set":"Houston","sign":"mercury","text":"they say never break ground on a big project during mercury retrograde. i cannot confirm when txdot started on i-45, but i have driven it for years and it has not once gone direct","caption":"the orange barrels are in a permanent shadow period","tags":["houston","i45","mercuryretrograde","htxtraffic"]},{"id":"htx-astro-05","set":"Houston","sign":"mercury","text":"the city of houston and my astrologer finally agree on one rule for mercury retrograde. turn around, don't drown. it applies to flooded underpasses and to texting my ex. both are deeper than they look","caption":"barricades exist for a reason. so does the block button","tags":["houston","turnarounddontdrown","mercuryretrograde","htx"]},{"id":"htx-astro-06","set":"Houston","sign":"mercury","text":"during mercury retrograde i only pick up for 713. 281 is a maybe. 832 goes to voicemail. 346 is a test from the universe and i will not be taking it until mercury goes direct","caption":"621, i'm not even ready to discuss you","tags":["houston","713","mercuryretrograde","houstonastrology"]},{"id":"htx-astro-07","set":"Houston","sign":"venusmars","text":"with venus in taurus, my terms of courtship are simple. you will drive me to the buc-ee's in katy. you will not rush me past the brisket counter. you will understand that this is the date","caption":"venus in taurus does not do appetizers. it does brisket","tags":["houston","bucees","venusintaurus","houstonastrology"]},{"id":"htx-astro-08","set":"Houston","sign":"venusmars","text":"i have venus in cancer, so i love the way i love a whataburger table tent. i hold on to it, i take it home without asking, and twelve years later it is still on my nightstand","caption":"number 47 and i are in a committed relationship","tags":["houston","whataburger","venusincancer","astrologymemes"]},{"id":"htx-astro-09","set":"Houston","sign":"venusmars","text":"venus retrograde is when exes resurface, which is why i'm skipping the breakfast klub this weekend. that line goes around the parking lot. there is nowhere to hide, and everyone i've ever dated is ordering wings and waffles","caption":"exes come back in retrograde. so does my craving for grits","tags":["houston","breakfastklub","venusretrograde","houstonastrology"]},{"id":"htx-astro-10","set":"Houston","sign":"venusmars","text":"my astrologer says his mars conjunct my venus means intense passion. in practice it means he insists on taking 59 when i clearly said 288, and we have not spoken since pearland","caption":"mars rules arguments. txdot rules everything else","tags":["houston","pearland","venusandmars","htxtraffic"]},{"id":"htx-astro-11","set":"Houston","sign":"moonrising","text":"my sun is in leo, my moon is in cancer and my rising sign is houston humidity in july. you will feel me before you see me, and you will need to change your shirt","caption":"first impressions, measured in dew point","tags":["houston","houstonhumidity","risingsign","bigthree"]},{"id":"htx-astro-12","set":"Houston","sign":"moonrising","text":"my big three: sun in the heights, moon in montrose, rising in katy. people meet me and assume i have a three-car garage. emotionally i'm at an open mic on westheimer","caption":"the rising sign is the cul-de-sac. the moon is the poetry","tags":["houston","montrose","bigthree","houstonastrology"]},{"id":"htx-astro-13","set":"Houston","sign":"moonrising","text":"my moon is in taurus, which means i process emotions at roughly the tempo of a dj screw tape. slow, deliberate, a little chopped. please give me until the second verse to tell you how i feel","caption":"feelings, but slowed down so they can fully arrive","tags":["houston","djscrew","moonintaurus","astrologymemes"]},{"id":"htx-astro-14","set":"Houston","sign":"moonrising","text":"my astrologer said not to start anything while the moon is void of course, so i've been sitting in the h-e-b parking lot on buffalo speedway for forty minutes. technically, i have not started shopping","caption":"the parking lot was always going to take forty minutes","tags":["houston","heb","moonvoidofcourse","houstonastrology"]},{"id":"htx-astro-15","set":"Houston","sign":"lunar","text":"the full moon is when everything hidden comes to light, which explains the line at the 24-hour whataburger at 2 am. nobody there is hungry. we are simply illuminated","caption":"the moon is full and so is the drive thru","tags":["houston","whataburger","fullmoon","houstonastrology"]},{"id":"htx-astro-16","set":"Houston","sign":"lunar","text":"eclipses bring sudden name changes you never agreed to. i called it minute maid park for twenty years and one january it became daikin park. i'm not saying it was eclipse season. i'm saying i was not consulted","caption":"it's still minute maid in my natal chart","tags":["houston","astros","eclipseseason","astrologymemes"]},{"id":"htx-astro-17","set":"Houston","sign":"lunar","text":"my saturn return hit at twenty-nine and the first symptom was buying a house in pearland. the second was explaining the drainage ditch to my friends at brunch with real enthusiasm. saturn rules structure and, apparently, gutters","caption":"saturn said grow up and check the flood map","tags":["houston","pearland","saturnreturn","houstonastrology"]},{"id":"htx-astro-18","set":"Houston","sign":"lunar","text":"an accurate birth chart needs an exact birth time. my mother says i was born right after the traffic on 59 let up, which in houston could be any hour between 1994 and today","caption":"my ascendant is pending, like the southwest freeway","tags":["houston","birthchart","htxtraffic","astrologymemes"]},{"id":"htx-astro-19","set":"Houston","sign":"space","text":"the actual apollo 13 line was 'houston, we've had a problem here.' past tense. calm. already handling it. that is the energy i bring to mercury retrograde, right before i call someone in clear lake","caption":"mission control has better boundaries than i do","tags":["houston","nasa","mercuryretrograde","spacecity"]},{"id":"htx-astro-20","set":"Houston","sign":"space","text":"when apollo 11 landed, armstrong's big announcement started with 'houston,' not 'moon.' the moon rules feelings, and it has been quietly sensitive about coming second in that sentence since 1969","caption":"tranquility base here. emotional base, slightly bruised","tags":["houston","apollo11","moonsign","spacecity"]},{"id":"htx-astro-21","set":"Houston","sign":"space","text":"i would like johnson space center to staff a console for my mercury retrograde. one flight director, three engineers and a man named gary whose only job is to say 'negative' every time i reach for my phone","caption":"go or no go on that text. no go","tags":["houston","johnsonspacecenter","mercuryretrograde","spacecity"]},{"id":"htx-astro-22","set":"Houston","sign":"space","text":"i took the tram tour at space center houston to see the restored apollo mission control and asked which console tracked mercury retrograde. the guide said none. respectfully, that explains a lot about the sixties","caption":"they had slide rules and no ephemeris. bold","tags":["houston","spacecenterhouston","mercuryretrograde","astrologymemes"]},{"id":"htx-astro-23","set":"Houston","sign":"space","text":"houston's only official nickname is space city, which is why dating here is hard. the astronauts know exactly where mercury is. i know whether it's retrograde. neither of us can find parking in montrose","caption":"science and astrology, united by the valet stand","tags":["houston","spacecity","astrologymemes","montrose"]},{"id":"htx-astro-24","set":"Houston","sign":"space","text":"nasa engineers in houston can predict where a spacecraft will be months from now. i can use an ephemeris to predict exactly when venus goes direct. we are both scientists. only one of us gets past the gate on nasa parkway","caption":"same math, different security clearance","tags":["houston","nasa","venusretrograde","spacecity"]},{"id":"htx2-aries-01","set":"Houston","sign":"aries","text":"my aries mars walked into the buffalo bayou cistern, saw 221 concrete columns and immediately yelled my own name. the echo held it for seventeen full seconds. finally, a room in houston that agrees with me at my volume","caption":"The cistern repeats you. Aries calls that support.","tags":["houston","buffalobayou","cistern","ariesmars"]},{"id":"htx2-aries-02","set":"Houston","sign":"aries","text":"my aries sun sat down for dim sum at ocean palace in the hong kong city mall and ordered for the whole table before the menus landed. nobody asked me to lead. i simply sensed a power vacuum and steamed buns","caption":"First to order, last to apologize.","tags":["houston","dimsum","bellaireblvd","ariessun"]},{"id":"htx2-aries-03","set":"Houston","sign":"aries","text":"every winter discovery green turns kinder lake into an ice rink, and every winter my aries rising laces up like it's the olympic final. i have never once skated on purpose. i would still like you to watch me fall at full speed","caption":"Fire sign, frozen lake, zero hesitation.","tags":["houston","discoverygreen","iceskating","ariesrising"]},{"id":"htx2-aries-04","set":"Houston","sign":"aries","text":"my aries moon watches coogs basketball at fertitta center like the phi slama jama days never ended. i did not play in the eighties. i am a grown adult in the upper rows, dunking emotionally on every single free throw","caption":"Cardinal fire, Big 12 volume.","tags":["houston","coogs","fertittacenter","ariesmoon"]},{"id":"htx2-taurus-01","set":"Houston","sign":"taurus","text":"a taurus first date at truth bbq in the heights goes brisket, ribs, then one slice of the sky-high layer cake. you may look at the cake. you may not have the cake. this is not a red flag. this is venus guarding her assets","caption":"Ruled by Venus. Protected by frosting.","tags":["houston","truthbbq","theheights","taurusvenus"]},{"id":"htx2-taurus-02","set":"Houston","sign":"taurus","text":"my taurus moon found out lucille's in the museum district still bakes chili biscuits from the owner's great-grandmother's recipe, the same ones once served on american airlines. i don't need the flight. i need the basket and a booth until close","caption":"Comfort, first class, no boarding pass.","tags":["houston","lucilles","museumdistrict","taurusmoon"]},{"id":"htx2-taurus-03","set":"Houston","sign":"taurus","text":"my taurus sun stands in line at killen's in pearland with the calm of a monk. the building used to be a school cafeteria, and i have never been this happy to be back in a lunch line. the brisket earned every minute","caption":"Fixed earth, prime brisket, no cutting.","tags":["houston","killensbbq","pearland","taurussun"]},{"id":"htx2-taurus-04","set":"Houston","sign":"taurus","text":"pinkerton's barbecue asks if you want your pork ribs glazed or dry rub, and my taurus rising hears a hostage negotiation. i will be taking both, a pound of brisket and a quiet minute alone with my feelings","caption":"Venus does not do either-or.","tags":["houston","pinkertons","bbq","taurusrising"]},{"id":"htx2-gemini-01","set":"Houston","sign":"gemini","text":"love bugs show up in houston every may and september and fly around permanently attached to their partner. my gemini sun finally understands them. two of us, one body, zero sense of direction, and everyone on the highway is annoyed","caption":"Twin energy, splattered on your windshield.","tags":["houston","lovebugs","houstonweather","geminisun"]},{"id":"htx2-gemini-02","set":"Houston","sign":"gemini","text":"the sugar land skeeters became the space cowboys, same ballpark, brand new everything. my gemini mercury respects a full rebrand. i do that to my whole personality every eighteen months and nobody has ever sent out a press release","caption":"New name, new colors, same Gemini.","tags":["houston","sugarland","spacecowboys","geminimercury"]},{"id":"htx2-gemini-03","set":"Houston","sign":"gemini","text":"my gemini rising relates to the beer can house. a retired railroad man started flattening cans in 1968 and kept going for eighteen years because one idea turned into forty. that is every group chat i have ever started","caption":"One idea, eighteen years, thousands of cans.","tags":["houston","beercanhouse","houstonart","geminirising"]},{"id":"htx2-gemini-04","set":"Houston","sign":"gemini","text":"a gemini belongs in rice's marching owl band. a halftime show that is secretly a comedy sketch, props everywhere, gently roasting the other team, then calling it a serious musical performance? that is just how my gemini moon talks at brunch","caption":"Mutable air with a brass section.","tags":["houston","riceowls","mob","geminimoon"]},{"id":"htx2-cancer-01","set":"Houston","sign":"cancer","text":"my cancer moon fully understands why beyoncé named her company parkwood after the third ward street she grew up on. you can sell out every stadium on earth and still want your childhood address written on the paperwork","caption":"Home is the headline for a water sign.","tags":["houston","thirdward","beyonce","cancermoon"]},{"id":"htx2-cancer-02","set":"Houston","sign":"cancer","text":"a cancer will drive past five closer chicken spots to get to frenchy's on scott street, because it has been in the third ward since 1969 and it tastes like every family function where an auntie told me to fix a plate","caption":"Nostalgia, Creole-fried.","tags":["houston","frenchys","thirdward","cancersun"]},{"id":"htx2-cancer-03","set":"Houston","sign":"cancer","text":"admission to the menil is always free, which means my cancer sun can visit the same painting every sunday like an old friend. we don't talk. we just sit together. it never asks what i'm doing with my life","caption":"Free admission. Unlimited feelings.","tags":["houston","menil","montrose","watersign"]},{"id":"htx2-cancer-04","set":"Houston","sign":"cancer","text":"sharpstown opened in 1961 as houston's first enclosed, air-conditioned mall, and my cancer rising refuses to call it anything else. it has a new name now. i respect that. i'm just loyal to the first place that ever kept us cool","caption":"Some loyalties are climate controlled.","tags":["houston","sharpstown","houstonhistory","cancerrising"]},{"id":"htx2-leo-01","set":"Houston","sign":"leo","text":"megan thee stallion finished her health administration degree at texas southern in 2021 while being one of the most famous people alive. my leo sun took that personally. real hottie behavior is a stadium tour and a diploma. go finish the class","caption":"The bar is set. The bar has a degree.","tags":["houston","megantheestallion","texassouthern","leosun"]},{"id":"htx2-leo-02","set":"Houston","sign":"leo","text":"my leo rising does not want a quiet proposal. i want texas southern's ocean of soul marching up the block, high knees, full drumline, motion of the ocean dancing behind me. a ring in a cake is for other signs","caption":"Sun-ruled and requesting a drumline.","tags":["houston","oceanofsoul","texassouthern","leorising"]},{"id":"htx2-leo-03","set":"Houston","sign":"leo","text":"a leo on the skylawn at post houston is not there for the five acres of rooftop park. a leo is there because golden hour hits downtown and the skyline is finally a backdrop worthy of me","caption":"Rooftop lighting, main character angle.","tags":["houston","posthouston","downtownhouston","leoenergy"]},{"id":"htx2-leo-04","set":"Houston","sign":"leo","text":"my leo moon still brings up the 2022 astros at parties. not the box score. how i personally felt, in my living room, in a jersey, screaming at the television like it could hear me. it absolutely could","caption":"World Series champions, as narrated by a Leo.","tags":["houston","astros","worldseries","leomoon"]},{"id":"htx2-virgo-01","set":"Houston","sign":"virgo","text":"houston voters rejected zoning in 1948, 1962 and 1993, and my virgo sun respects democracy. i still flinch when a mansion, a taqueria and a tire shop share one block. it's not wrong. it's just not alphabetized","caption":"No zoning, many label makers.","tags":["houston","nozoning","houstonhistory","virgosun"]},{"id":"htx2-virgo-02","set":"Houston","sign":"virgo","text":"every march the oak pollen turns my car yellow and my virgo rising takes it personally. i wash it tuesday. by wednesday it looks like a lemon bar. the city once counted over ten thousand grains per cubic meter. i felt every one","caption":"Clean car, pending further notice.","tags":["houston","pollenseason","oakpollen","virgorising"]},{"id":"htx2-virgo-03","set":"Houston","sign":"virgo","text":"harris county has about fifty-six species of mosquito, and my virgo moon has tried to identify every single one that bit me on the patio. i have a spreadsheet. i have a ranking. i have not sat outside since june","caption":"Know your enemy, by species.","tags":["houston","mosquitoes","harriscounty","virgomoon"]},{"id":"htx2-virgo-04","set":"Houston","sign":"virgo","text":"a virgo on a date at rice will casually mention that campus has over four thousand trees, then ask which live oak you'd like to sit under, then explain why your pick is acceptable but not optimal for shade","caption":"Romance, peer reviewed.","tags":["houston","riceuniversity","liveoaks","virgoplacements"]},{"id":"htx2-libra-01","set":"Houston","sign":"libra","text":"my libra venus goes to the bayou city art festival in memorial park for one small print. four hours later i have complimented every artist, bought nothing and promised forty booths i'll be back. i meant it every single time","caption":"Venus loves every booth equally.","tags":["houston","bayoucityartfestival","memorialpark","libravenus"]},{"id":"htx2-libra-02","set":"Houston","sign":"libra","text":"my libra sun cannot pick one houston college team. coogs at fertitta, owls at rice, tigers at texas southern. i own all three hoodies and rotate them weekly so nobody feels left out, including me","caption":"Neutral ground, three hoodies deep.","tags":["houston","collegesports","htx","librasun"]},{"id":"htx2-libra-03","set":"Houston","sign":"libra","text":"my libra moon went to hillcroft for one sari for a wedding. the mahatma gandhi district has more than a dozen sari shops. i visited every one, loved every one, and left with three, purely for balance","caption":"Indecision, beautifully embroidered.","tags":["houston","mahatmagandhidistrict","hillcroft","libramoon"]},{"id":"htx2-libra-04","set":"Houston","sign":"libra","text":"rice village has over three hundred shops packed into a few walkable blocks, and my libra rising treated it like a jury duty. every store got a fair hearing. every outfit got a second opinion from a stranger. the verdict is pending","caption":"The scales are still deliberating.","tags":["houston","ricevillage","shopping","librarising"]},{"id":"htx2-scorpio-01","set":"Houston","sign":"scorpio","text":"my scorpio mars knows the downtown tunnels the way other people know their ex's schedule. six miles, twenty feet underground, ninety-five blocks, and i can cross all of downtown without seeing the sun once. no, i will not draw you a map","caption":"Pluto prefers the underground route.","tags":["houston","downtowntunnels","downtownhouston","scorpiomars"]},{"id":"htx2-scorpio-02","set":"Houston","sign":"scorpio","text":"a palmetto bug flew across the kitchen and my scorpio sun did not scream. i made eye contact, held the stare and let it understand that one of us is leaving this room tonight. respectfully, it will not be me","caption":"Fixed water versus a flying roach.","tags":["houston","palmettobug","houstonlife","scorpiosun"]},{"id":"htx2-scorpio-03","set":"Houston","sign":"scorpio","text":"my scorpio moon is fascinated by the old imperial sugar char house in sugar land. it's named for the bone char that turned dark syrup clear. something that pulls the darkness out of things? i'd like to be studied there","caption":"Pluto respects a good filtration process.","tags":["houston","sugarland","imperialsugar","scorpiomoon"]},{"id":"htx2-scorpio-04","set":"Houston","sign":"scorpio","text":"nobody handed my scorpio rising a flyer for the night market behind the hong kong city mall. i noticed the lot getting busy after dark, followed the smell and quietly found my new favorite stall. i will be telling no one which one","caption":"Secrets, served after sunset.","tags":["houston","asiatown","nightmarket","scorpiorising"]},{"id":"htx2-sagittarius-01","set":"Houston","sign":"sagittarius","text":"my sagittarius sun rode the free trolley around the woodlands waterway and announced i was 'exploring the region.' it is a 4.1 mile loop. i rode it three times. i have traveled further than most people this week","caption":"Jupiter counts every lap as a journey.","tags":["houston","thewoodlands","woodlandswaterway","sagittariussun"]},{"id":"htx2-sagittarius-02","set":"Houston","sign":"sagittarius","text":"a sagittarius will say 'let's just grab one boba in asiatown' and four hours later we're in a different plaza, a karaoke room and a conversation about moving abroad. the boba was real. the itinerary never was","caption":"One drink, three plazas, a whole new life plan.","tags":["houston","asiatown","boba","sagittariusmoon"]},{"id":"htx2-sagittarius-03","set":"Houston","sign":"sagittarius","text":"my sagittarius rising suggests 'let's drive westheimer until something looks good' like it's a quick idea. westheimer is about nineteen miles long. we passed every cuisine on earth twice and ended up eating in the car at a light","caption":"Jupiter treats one street as a road trip.","tags":["houston","westheimer","houstonfood","sagittariusrising"]},{"id":"htx2-sagittarius-04","set":"Houston","sign":"sagittarius","text":"my sagittarius sun shows up to a texans tailgate at nrg with no chair, no cooler and no plan, then leaves having been fed by six different families and invited to somebody's cousin's wedding in june","caption":"Jupiter provides, mostly in brisket.","tags":["houston","texans","nrgstadium","sagittariussun"]},{"id":"htx2-capricorn-01","set":"Houston","sign":"capricorn","text":"my capricorn sun respects bun b. a port arthur legend turns a pop-up into trill burgers in montrose, then keeps opening locations around houston. that is not a side hustle. that is a five-year plan with pickles","caption":"Trill, and also on schedule.","tags":["houston","bunb","trillburgers","capricornsun"]},{"id":"htx2-capricorn-02","set":"Houston","sign":"capricorn","text":"when ercot sends out a conservation appeal my capricorn moon sets the thermostat to exactly 78, unplugs the garage fridge and texts the neighbors. i'm not scared. somebody on this block has to be the adult on the grid","caption":"Saturn rules structure, including the thermostat.","tags":["houston","ercot","houstonsummer","capricornmoon"]},{"id":"htx2-capricorn-03","set":"Houston","sign":"capricorn","text":"the deluxe theater on lyons avenue in the fifth ward opened in 1941, waited decades, got restored and raised the curtain again. my capricorn rising calls that a career arc. good bones, long patience, and the lights still come on","caption":"Built to last, then built again.","tags":["houston","fifthward","deluxetheater","capricornrising"]},{"id":"htx2-capricorn-04","set":"Houston","sign":"capricorn","text":"molina's has served tex-mex since 1941 and is still run by the founders' grandsons. my capricorn saturn reads that and sees a legacy plan. three generations, one queso recipe and a dip named after a waiter who had a good idea","caption":"Family business, Saturn approved.","tags":["houston","molinas","texmex","capricornsaturn"]},{"id":"htx2-aquarius-01","set":"Houston","sign":"aquarius","text":"an aquarius at smither park sees a long mosaic wall made from broken plates, bottle caps and found objects by over three hundred artists and thinks, finally, a community that understands how i decorate my apartment","caption":"Found objects, chosen family.","tags":["houston","smitherpark","eastend","aquariussun"]},{"id":"htx2-aquarius-02","set":"Houston","sign":"aquarius","text":"my aquarius moon spent a whole afternoon at the menil drawing institute looking at sketches, studies and things artists never fully finished, and felt seen. i also have forty half-finished ideas. i believe they belong in a museum too","caption":"Uranus collects works in progress.","tags":["houston","menildrawinginstitute","montrose","aquariusmoon"]},{"id":"htx2-aquarius-03","set":"Houston","sign":"aquarius","text":"my aquarius rising secretly loves that houston never adopted zoning. a dentist, a church, a dance studio and a townhouse on one block? that is not chaos. that is a city where everybody did the group project their own way","caption":"Fixed air, flexible land use.","tags":["houston","nozoning","htx","aquariusrising"]},{"id":"htx2-aquarius-04","set":"Houston","sign":"aquarius","text":"my aquarius sun goes to houston dash games at shell energy stadium because women's soccer deserves a loud, full house, and i deserve a crowd that chants with the exact intensity i bring to a group chat about social issues","caption":"Ahead of the curve and in the supporters section.","tags":["houston","houstondash","nwsl","aquariussun"]},{"id":"htx2-pisces-01","set":"Houston","sign":"pisces","text":"my pisces moon stood in the buffalo bayou cistern, watched 221 columns reflect into the still water and heard one whisper hang in the air for seventeen seconds. i did not take a photo. i quietly forgave three people","caption":"Neptune found its underground chapel.","tags":["houston","buffalobayou","cistern","piscesmoon"]},{"id":"htx2-pisces-02","set":"Houston","sign":"pisces","text":"my pisces sun went up to the post houston rooftop, skipped the bar and drifted straight to the one-acre farm to talk to the tomatoes. i came for a date. i'm leaving emotionally attached to a row of basil that faces the skyline","caption":"Neptune grows things on rooftops.","tags":["houston","posthouston","rooftopfarm","piscessun"]},{"id":"htx2-pisces-03","set":"Houston","sign":"pisces","text":"my pisces venus went to the bayou city art festival and fell in love three times: with a watercolor of the bayou, with the woman who painted it and with a stranger's dog who stood next to me the whole time","caption":"Mutable water, unlimited crushes.","tags":["houston","bayoucityartfestival","houstonart","piscesvenus"]},{"id":"htx2-pisces-04","set":"Houston","sign":"pisces","text":"at the deluxe theater in the fifth ward the lights went down, a local choir started singing and my pisces rising cried before the first verse ended. i don't know any of them. i'd still help every one of them move","caption":"Boundaries dissolve at curtain call.","tags":["houston","fifthward","deluxetheater","piscesrising"]},{"id":"leo-g01","set":"Signs","sign":"leo","text":"put me in a hostage negotiation and i will release every hostage immediately because the kidnapper said one nice thing about my jacket. my leo sun simply cannot negotiate against a compliment x","caption":"Leo placements will trade national security for one good review","tags":["leo","leosun","leoseason","firesigns"]},{"id":"leo-g02","set":"Signs","sign":"leo","text":"i regret to inform the group chat that my leo moon has noticed nobody reacted to my message for 47 minutes. we are not upset. we are simply drafting a statement x","caption":"The silence was noted. The silence was logged.","tags":["leo","leomoon","groupchat","astrologymemes"]},{"id":"leo-g03","set":"Signs","sign":"leo","text":"effective immediately, my birthday is no longer a day. per the leo handbook it has been upgraded to a fiscal quarter, and all attendees are expected to clear their calendars accordingly","caption":"Leo season is a lifestyle, not a date range","tags":["leo","leoseason","birthdaymonth","zodiachumor"]},{"id":"leo-g04","set":"Signs","sign":"leo","text":"drop me into a nature documentary and i'll be the lion who stops mid hunt to check the camera crew is still filming. my leo rising refuses to do anything majestic without a witness","caption":"If nobody saw it, did the leo even do it","tags":["leo","leorising","naturedocumentary","maincharacter"]},{"id":"leo-g05","set":"Signs","sign":"leo","text":"my leo venus would like to clarify that i do not need constant attention in a relationship. i need consistent attention, delivered warmly, at regular intervals, with the occasional standing ovation x","caption":"Reasonable demands from a reasonable lion","tags":["leo","leovenus","venussign","datingmemes"]},{"id":"leo-g06","set":"Signs","sign":"leo","text":"a leo friend will pay for your dinner, hype you up to the waiter, drive you home and defend your honour in three separate group chats. all we ask is that you say thank you like you mean it","caption":"Loyal to a fault. A very loud fault.","tags":["leo","leofriend","fixedfire","bestfriendmemes"]},{"id":"leo-g07","set":"Signs","sign":"leo","text":"i was asked to give a short toast at my best friend's wedding and as a leo mars i have prepared a short toast, a costume change, a slideshow and a brief intermission","caption":"The bride will get her moment. Right after mine.","tags":["leo","leomars","weddingtoast","astrologyhumor"]},{"id":"leo-g08","set":"Signs","sign":"leo","text":"your honour, my client is a leo and cannot be held responsible for the karaoke incident. the microphone was on, the lights were dimmed, the crowd was right there and frankly she was born for this","caption":"The defence rests. The leo does not.","tags":["leo","karaoke","courtroom","leoenergy"]},{"id":"leo-g09","set":"Signs","sign":"leo","text":"by royal decree of my leo sun, any compliment i receive in private must now be repeated in public, ideally in front of witnesses and preferably at a slightly louder volume","caption":"Compliments are public property in this kingdom","tags":["leo","leosun","royaldecree","sunruled"]},{"id":"leo-g10","set":"Signs","sign":"leo","text":"per my last email, i am happy to lead this project as long as my name goes first on every slide. this is not ego. this is a leo placement doing basic brand management","caption":"Credit where credit is due. Ideally, to the leo.","tags":["leo","leoatwork","corporatehumor","officememes"]},{"id":"leo-g11","set":"Signs","sign":"leo","text":"airport security asked if i had anything to declare, so as a leo i declared my love for my friends, my deep disappointment in the queue system and my long term plans for world domination x","caption":"The leo was not detained. Merely admired.","tags":["leo","airportsecurity","leoenergy","zodiacmemes"]},{"id":"leo-g12","set":"Signs","sign":"leo","text":"put a leo on a heist crew and we will absolutely crack the safe, but we'll also leave a signed note, a monogrammed glove and a voicemail asking the press to spell our name right","caption":"Leos do not do anonymous. Even in crime.","tags":["leo","heist","fixedfire","astrologymemes"]},{"id":"leo-g13","set":"Signs","sign":"leo","text":"hr has asked me to stop referring to my coworkers as my loyal subjects. as a leo sun i have accepted this feedback graciously and will now be calling them my beloved royal court","caption":"Growth looks different for every sign","tags":["leo","leosun","officehumor","hrmemes"]},{"id":"leo-g14","set":"Signs","sign":"leo","text":"dating a leo is simple. clap when we walk into a room, remember every detail of our day and look at us like we personally invented the sun. which, astrologically speaking, we sort of did","caption":"Ruled by the sun. Acting accordingly.","tags":["leo","datingaleo","sunsign","relationshipmemes"]},{"id":"leo-g15","set":"Signs","sign":"leo","text":"by continuing this friendship you agree to the leo terms and conditions, including but not limited to hyping my selfies, attending my entire birthday month and never saying the word dramatic in my presence x","caption":"Please read carefully. The lion will know if you skipped.","tags":["leo","termsandconditions","leoseason","friendshipmemes"]},{"id":"virgo-g01","set":"Signs","sign":"virgo","text":"put me in a five star restaurant and i'll be the virgo quietly realigning the cutlery, fixing the menu's grammar in my head and leaving a review that is technically positive but includes eleven suggestions","caption":"Five stars. Pending revisions.","tags":["virgo","virgosun","perfectionist","earthsigns"]},{"id":"virgo-g02","set":"Signs","sign":"virgo","text":"i regret to announce that my virgo moon has once again noticed the typo in your instagram caption. we have chosen not to comment. we will simply think about it for the rest of the week x","caption":"Seen, noted, silently edited in our hearts","tags":["virgo","virgomoon","grammar","astrologymemes"]},{"id":"virgo-g03","set":"Signs","sign":"virgo","text":"my virgo venus doesn't say i love you. it says i booked your dentist appointment, labelled your spice rack and reorganised your entire wardrobe by colour while you were in the shower","caption":"Acts of service, aggressively delivered","tags":["virgo","virgovenus","actsofservice","lovelanguage"]},{"id":"virgo-g04","set":"Signs","sign":"virgo","text":"take a virgo to a museum and we will not be looking at the art. we will be looking at the slightly crooked frame in gallery four and wondering who signed off on that","caption":"The masterpiece was fine. The placard had a comma splice.","tags":["virgo","museum","detailoriented","zodiachumor"]},{"id":"virgo-g05","set":"Signs","sign":"virgo","text":"the dmv is my natural habitat as a virgo rising. finally, a place with forms, queues and rules, and a whole waiting room of people i can silently help fill out section b correctly","caption":"Mercury-ruled people love a good form","tags":["virgo","virgorising","dmv","mercuryruled"]},{"id":"virgo-g06","set":"Signs","sign":"virgo","text":"if i'm ever taken hostage please don't send a negotiator. send a virgo. within ten minutes the kidnappers will have a clearer business plan, a colour coded schedule and a deep sense of shame about the mess","caption":"Virgos fix everything. Even the bad guys.","tags":["virgo","hostagenegotiation","virgoenergy","astrologymemes"]},{"id":"virgo-g07","set":"Signs","sign":"virgo","text":"per our earlier conversation, my virgo sun would like to formally withdraw from the group project and resubmit the whole thing alone at 3am, correctly formatted, with citations nobody asked for x","caption":"Group projects were invented to test virgos","tags":["virgo","virgosun","groupproject","corporatehumor"]},{"id":"virgo-g08","set":"Signs","sign":"virgo","text":"a virgo friend will tell you your ex was wrong for you, list the seven reasons in order of severity and then hand you a snack from the emergency kit we've been carrying since 2019","caption":"Prepared for every situation, including yours","tags":["virgo","virgofriend","mutableearth","bestfriendmemes"]},{"id":"virgo-g09","set":"Signs","sign":"virgo","text":"i was asked to give a toast at the wedding and as a virgo mars i spent the whole speech gently correcting the seating chart, the timeline and the dj's pronunciation of the groom's name","caption":"Someone had to. It was always going to be the virgo.","tags":["virgo","virgomars","weddingtoast","zodiacmemes"]},{"id":"virgo-g10","set":"Signs","sign":"virgo","text":"virgo terms and conditions: if you ask me for feedback, you will receive feedback. it will be thorough, it will be numbered, and it will arrive with a follow up email checking you implemented it x","caption":"You asked. You will be held to that.","tags":["virgo","termsandconditions","feedback","officememes"]},{"id":"virgo-g11","set":"Signs","sign":"virgo","text":"and here we observe the virgo in io rising looked them dead in the eye and said nobody has access to anything of mine, emotionally or otherwise","caption":"Bag cleared. Emotions still on lockdown.","tags":["scorpio","scorpiorising","airportsecurity","zodiacmemes"]},{"id":"scorpio-g10","set":"Signs","sign":"scorpio","text":"put a scorpio on a heist crew and we will not need the blueprints. we already know the guard's schedule, the vault code and the manager's middle name, and we're not telling you how","caption":"Some questions are better left unasked","tags":["scorpio","heist","secretive","astrologymemes"]},{"id":"scorpio-g11","set":"Signs","sign":"scorpio","text":"my scorpio mars doesn't get angry. it gets quiet, takes notes, waits patiently for eighteen months and then brings it up casually at your birthday dinner in front of your mum x","caption":"Ruled by Mars and Pluto. Patient like a glacier.","tags":["scorpio","scorpiomars","grudges","zodiachumor"]},{"id":"scorpio-g12","set":"Signs","sign":"scorpio","text":"today's forecast for scorpio placements: overcast with intense eye contact, scattered secrets and a 100 percent chance of knowing exactly what you meant by that text","caption":"Every pause is evidence. Every full stop is a clue.","tags":["scorpio","weatherforecast","intense","watersigns"]},{"id":"scorpio-g13","set":"Signs","sign":"scorpio","text":"by entering a relationship with a scorpio you agree to full emotional transparency from your side, partial transparency from ours and the understanding that we noticed the thing you thought we didn't notice","caption":"These terms are non-negotiable and slightly one-sided","tags":["scorpio","termsandconditions","relationshipmemes","plutoruled"]},{"id":"scorpio-g14","set":"Signs","sign":"scorpio","text":"every wedding needs a scorpio guest, the one sitting quietly at table nine who knows which bridesmaid used to date the groom and is saying absolutely nothing, but very loudly","caption":"The silence at table nine said everything","tags":["scorpi

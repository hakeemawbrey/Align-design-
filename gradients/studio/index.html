<title>Gradient Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a studio bench. Preview frame on the left, controls and the post library on the right; stacks on phones. */
:root{
  --bg:#f6f3fb; --panel:#ffffff; --fg:#1d1530; --muted:#6c6380; --line:#e4ddef;
  --accent:#7b3afd; --accent-ink:#ffffff; --chip:#efe9f8;
  --f-ui:"Figtree",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130f1c; --panel:#1c1628; --fg:#f1ecfa; --muted:#a49bb8; --line:#2e2640;
  --accent:#a77cff; --accent-ink:#130f1c; --chip:#261e36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f1c; --panel:#1c1628; --fg:#f1ecfa; --muted:#a49bb8; --line:#2e2640;
  --accent:#a77cff; --accent-ink:#130f1c; --chip:#261e36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
.handle{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bench{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px}
@media (max-width:820px){.stage{position:static}}
canvas#view{width:100%;max-width:100%;aspect-ratio:3/4;border-radius:14px;display:block;background:var(--chip);box-shadow:0 10px 40px -18px rgba(60,20,120,.45)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
textarea,input[type=search],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:150px;resize:vertical;font-weight:600}
textarea#cap{min-height:90px;font-weight:400}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.field{display:grid;gap:6px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[disabled]{opacity:.5;cursor:default}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:10px;padding:0;border:2px solid transparent;position:relative}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.sw span{position:absolute;inset:auto 0 -18px;font-size:11px;color:var(--muted);font-weight:500}
.swatches{padding-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.lib-filters{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}
@media (max-width:520px){.lib-filters{grid-template-columns:1fr 1fr}.lib-filters input{grid-column:1/-1}}
.list{display:grid;gap:6px;max-height:520px;overflow:auto;padding-right:4px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;font-weight:400;background:transparent;border:1px solid transparent;padding:8px}
.item:hover{background:var(--chip);border-color:var(--line)}
.item[aria-current="true"]{background:var(--chip);border-color:var(--accent)}
.dot{width:28px;height:36px;border-radius:6px}
.item b{display:block;font-size:12px;font-family:var(--f-mono);font-weight:500;color:var(--muted)}
[hidden]{display:none!important}
.seg{width:max-content}
.art-tools{display:grid;gap:10px}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.thumb{aspect-ratio:3/4;width:100%;padding:0;border:2px solid transparent;border-radius:6px;background-image:url(art/thumbs.jpg);background-repeat:no-repeat}
.thumb[aria-pressed="true"]{border-color:var(--accent)}
.credit{font-size:12px;color:var(--muted)}
.item .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div><h1>Gradient Studio</h1><p>Text-on-gradient and text-on-artwork reels for <span class="handle">@zodiac.advice444</span>, 1080×1440.</p></div>
    <div class="row"><button id="rand">Random post</button></div>
  </header>

  <div class="bench">
    <div class="stage">
      <canvas id="view" width="1080" height="1440" aria-label="Post preview"></canvas>
      <div class="row">
        <button class="primary" id="savePng">Save PNG</button>
        <button id="saveVid">Save video</button>
        <button id="play" aria-pressed="true">Pause drift</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>

    <div style="display:grid;gap:20px;min-width:0">
      <section class="panel">
        <div class="field">
          <label class="lbl" for="txt">On-screen text</label>
          <textarea id="txt" spellcheck="true"></textarea>
          <div class="meta" id="count"></div>
        </div>
        <div class="field">
          <span class="lbl">Background</span>
          <div class="seg" id="bgmode"><button data-v="gradient" aria-pressed="true">Gradient</button><button data-v="art" aria-pressed="false">Artwork</button></div>
        </div>
        <div class="field art-tools" id="artTools" hidden>
          <div class="row">
            <button id="randArt">Random artwork</button>
            <select id="artPool" aria-label="Artwork set" style="width:auto"></select>
            <span class="meta" id="artCount"></span>
          </div>
          <div class="art-grid" id="artGrid"></div>
          <div class="credit" id="artCredit"></div>
        </div>
        <div class="field" id="gradTools">
          <span class="lbl">Gradient</span>
          <div class="swatches" id="sw"></div>
        </div>
        <div class="field">
          <span class="lbl">Sign-off</span>
          <div class="seg" id="tag"><button data-v="houston" aria-pressed="true">Join the Houston beta</button><button data-v="beta" aria-pressed="false">Join the beta</button><button data-v="none" aria-pressed="false">None</button></div>
        </div>
        <div class="field">
          <span class="lbl">Text look</span>
          <div class="seg" id="style"><button data-v="clean" aria-pressed="true">Clean</button><button data-v="outline" aria-pressed="false">Outline</button></div>
        </div>
        <div class="row" style="justify-content:flex-end">
          <div class="field" style="min-width:160px">
            <label class="lbl" for="size">Size</label>
            <input type="range" id="size" min="0.6" max="1.4" step="0.05" value="1">
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="cap">Caption</label>
          <textarea id="cap"></textarea>
          <div class="row"><button id="copyCap">Copy caption + hashtags</button><span class="meta" id="tags"></span></div>
        </div>
      </section>

      <section class="panel">
        <div class="row" style="justify-content:space-between"><span class="lbl">Library</span><span class="meta" id="libcount"></span></div>
        <div class="lib-filters">
          <select id="fset" aria-label="Set"></select>
          <select id="fsign" aria-label="Sign"></select>
          <input type="search" id="fq" placeholder="Search words, e.g. katy, soup, retrograde">
        </div>
        <div class="list" id="list"></div>
      </section>
    </div>
  </div>
</div>

<script>
const POSTS = [{"id":"aries-g01","set":"Signs","sign":"aries","text":"drop me in a hostage negotiation and i'll have every demand met in four minutes, mostly because my aries mars cannot physically sit through a second phone call. you're welcome, everyone is free x","caption":"Patience was never on the table","tags":["aries","hostagenegotiation","ariesmars","impatient"]},{"id":"aries-g02","set":"Signs","sign":"aries","text":"effective immediately, my aries placements are stepping down from the escape room. we got out in nine minutes by kicking the door, which staff are calling 'not the intended solution' x","caption":"Cardinal fire always finds the shortcut","tags":["aries","escaperoom","ariesplacements","impatience"]},{"id":"aries-g03","set":"Signs","sign":"aries","text":"dating an aries venus is incredible because they'll chase you across three states and a time zone, then the second you text back first they quietly lose interest and take up pottery","caption":"The chase was the whole personality","tags":["aries","ariesvenus","dating","firesign"]},{"id":"aries-g04","set":"Signs","sign":"aries","text":"my aries moon has a strict feelings policy: we yell for six minutes, apologise for none of it, then ask if you want tacos like the last ten minutes were a different weather system","caption":"Mood passed. Tacos remain.","tags":["aries","ariesmoon","feelings","astrologymemes"]},{"id":"aries-g05","set":"Signs","sign":"aries","text":"per my last email, my aries rising did not 'storm into the meeting'. i entered the room at my natural walking speed, which happens to be the speed of a minor emergency","caption":"Aries rising walks like the building is on fire","tags":["aries","ariesrising","corporate","astrologyhumor"]},{"id":"aries-g06","set":"Signs","sign":"aries","text":"put an aries on a jury and we'll have a verdict before the opening statements finish. guilty, not guilty, honestly whatever, the important thing is that we were first","caption":"Justice, but make it a race","tags":["aries","courtroom","competitive","cardinalfire"]},{"id":"aries-g07","set":"Signs","sign":"aries","text":"and here we observe the aries in its natural habitat, starting an argument in the group chat at 1am, winning it, forgetting it, then sleeping peacefully like a newborn ram","caption":"Zero thoughts after the victory lap","tags":["aries","naturedocumentary","groupchat","ariesenergy"]},{"id":"aries-g08","set":"Signs","sign":"aries","text":"as your aries coworker i'd like to clarify that i do not have a temper. i have a very fast reply-all button and a deep personal hatred of meetings that could have been settled by arm wrestling","caption":"Efficient, alarming and somehow still beloved","tags":["aries","coworker","officehumor","marsruled"]},{"id":"aries-g09","set":"Signs","sign":"aries","text":"by royal decree of the aries sun, the astrological new year begins in march, the calendar is wrong, and january has been formally downgraded to a soft launch","caption":"Aries season is the real new year, sorry","tags":["aries","ariesseason","astrologicalnewyear","royaldecree"]},{"id":"aries-g10","set":"Signs","sign":"aries","text":"airport security asked my aries mars to step aside for additional screening and honestly fair, i did sprint to the gate like it owed me money and our flight is in three hours","caption":"Boarding group: right now, actually","tags":["aries","airport","ariesmars","travel"]},{"id":"aries-g11","set":"Signs","sign":"aries","text":"as the aries best man i'd like to raise a glass to the happy couple, and to the fact that i objected out loud before the officiant even got to that part. i stand by the timing","caption":"Speaking first, thinking at some point","tags":["aries","weddingtoast","bestman","ariessun"]},{"id":"aries-g12","set":"Signs","sign":"aries","text":"an aries friend will drive across town at 2am to defend your honour, then call you the next morning like 'wait, what was his name again'. loyalty, not memory","caption":"Ride or die, mostly ride","tags":["aries","ariesfriend","loyalty","firesign"]},{"id":"aries-g13","set":"Signs","sign":"aries","text":"by entering a relationship with an aries you agree to the following terms: every board game is a blood sport, every walk is a race, and the loser buys dinner. there is no opt-out x","caption":"Read the fine print, if you can keep up","tags":["aries","termsandconditions","ariesinlove","competitive"]},{"id":"aries-g14","set":"Signs","sign":"aries","text":"today's forecast for your aries friend: sudden heat around noon, a brief and dramatic storm over someone parking badly, then clear skies by two with absolutely no memory of it","caption":"Fast front, short memory","tags":["aries","weatherforecast","ariestemper","astrologymemes"]},{"id":"aries-g15","set":"Signs","sign":"aries","text":"i have been summoned to small claims court by my own to-do list, which alleges my aries sun started eleven projects this month and abandoned all eleven with 'alarming enthusiasm'","caption":"Pleading enthusiastic, your honour","tags":["aries","courtsummons","ariessun","newprojects"]},{"id":"taurus-g01","set":"Signs","sign":"taurus","text":"i regret to announce that my taurus moon will not be attending the spontaneous road trip. i have a nap scheduled for 3pm and i do not negotiate with spontaneity x","caption":"Plans are for people without blankets","tags":["taurus","taurusmoon","naps","homebody"]},{"id":"taurus-g02","set":"Signs","sign":"taurus","text":"put a taurus on a heist crew and we'll spend four months planning, refuse to rush the vault, and walk out with the cash and the cheese board from the bank manager's office","caption":"Earth signs don't leave without snacks","tags":["taurus","heist","foodie","earthsign"]},{"id":"taurus-g03","set":"Signs","sign":"taurus","text":"dating a taurus venus means being taken to the same restaurant every friday for six years and slowly realising that this is, in fact, the most romantic thing anyone has ever done","caption":"Venus at home, loving on a loop","tags":["taurus","taurusvenus","romance","venusruled"]},{"id":"taurus-g04","set":"Signs","sign":"taurus","text":"your honour, my taurus client did not 'hold a grudge for nine years'. she simply never updated her opinion of him, which is very different and frankly far more efficient","caption":"Fixed sign, fixed opinions","tags":["taurus","courtroom","grudges","fixedsign"]},{"id":"taurus-g05","set":"Signs","sign":"taurus","text":"taurus coworker update: i will be adapting to the new software sometime between never and the day the old software is physically removed from my hands by a team of professionals","caption":"Change management has requested backup","tags":["taurus","coworker","stubborn","officehumor"]},{"id":"taurus-g06","set":"Signs","sign":"taurus","text":"the taurus has located a soft blanket. it will now remain on this sofa for the rainy season, emerging only to inspect the fridge and silently judge the thermostat","caption":"Please do not disturb the grazing","tags":["taurus","naturedocumentary","cozy","taurusenergy"]},{"id":"taurus-g07","set":"Signs","sign":"taurus","text":"i'd be useless as a hostage negotiator because i'm a taurus. my opening offer is my final offer, and i am fully prepared to sit here eating crisps until you agree with me","caption":"The bull does not counter-offer","tags":["taurus","hostagenegotiation","stubborn","taurussun"]},{"id":"taurus-g08","set":"Signs","sign":"taurus","text":"the dmv has finally met its match. my taurus sun brought a folding chair, a thermos, a novel and a mid-morning snack, and i am not leaving this building without my licence or a pension","caption":"Earth sign endurance remains undefeated","tags":["taurus","dmv","patience","taurussun"]},{"id":"taurus-g09","set":"Signs","sign":"taurus","text":"people with a taurus rising walk into a room like it's a spa they've already paid for, and somehow everyone else starts speaking more quietly and ordering the nice bread","caption":"Venus-ruled ascendant, expensive aura","tags":["taurus","taurusrising","aura","venusruled"]},{"id":"taurus-g10","set":"Signs","sign":"taurus","text":"a taurus friend won't text back for four days and then shows up at your door with soup, a plant and an opinion about your landlord. texting is not the love language. presence is","caption":"Shows up. Does not reply.","tags":["taurus","taurusfriend","lovelanguage","earthsign"]},{"id":"taurus-g11","set":"Signs","sign":"taurus","text":"terms and conditions for borrowing anything from a taurus: return it in its original condition, on the agreed date, with a small gift for the distress of being apart from it","caption":"Venus rules possessions, and it shows","tags":["taurus","termsandconditions","possessive","taurusplacements"]},{"id":"taurus-g12","set":"Signs","sign":"taurus","text":"let it be known across the kingdom that my taurus moon has opened a savings account for comfort. every payday a fixed amount goes directly to candles, linen and a very good olive oil","caption":"Financial planning, earth sign edition","tags":["taurus","royaldecree","taurusmoon","luxury"]},{"id":"taurus-g13","set":"Signs","sign":"taurus","text":"nobody warns you that a taurus mars is the calmest person alive for eleven months and then once a year someone takes their parking spot and the whole street learns what a stampede is","caption":"Slow to anger, impossible to stop","tags":["taurus","taurusmars","slowburn","fixedearth"]},{"id":"taurus-g14","set":"Signs","sign":"taurus","text":"as the taurus maid of honour my speech will be brief, because i have located the dessert table and i would like to be reunited with it before anyone cuts the cake","caption":"Priorities were set at birth","tags":["taurus","weddingtoast","dessert","taurussun"]},{"id":"taurus-g15","set":"Signs","sign":"taurus","text":"the weather forecast for taurus season: warm, grounded, zero chance of anyone changing their mind, and a high likelihood of someone 'just popping out for bread' and coming home with flowers","caption":"Fixed earth, high pressure system","tags":["taurus","taurusseason","weatherforecast","earthsign"]},{"id":"gemini-g01","set":"Signs","sign":"gemini","text":"i regret to announce that my gemini mercury has been asked to leave the book club after revealing the ending, three alternative endings, and a rumour about the author's neighbour","caption":"Information wants to be free, and so does Gemini","tags":["gemini","geminimercury","bookclub","mercuryruled"]},{"id":"gemini-g02","set":"Signs","sign":"gemini","text":"take a gemini to a museum and they'll read every plaque, invent a backstory for each portrait, befriend the security guard and leave knowing his ex's full name and his theory about the sculptures","caption":"Mutable air, unlimited curiosity","tags":["gemini","museum","curious","airsign"]},{"id":"gemini-g03","set":"Signs","sign":"gemini","text":"dating a gemini venus is incredible because the conversation never stops, the plans change hourly, and three dates in you realise you've been seeing at least two delightful people","caption":"Twice the charm, half the punctuality","tags":["gemini","geminivenus","dating","twins"]},{"id":"gemini-g04","set":"Signs","sign":"gemini","text":"my gemini moon handles feelings by turning them into a podcast. two hosts, both of them me, seven episodes in, still no conclusion, but the guest list is excellent","caption":"Analysed, discussed, never actually felt","tags":["gemini","geminimoon","feelings","astrologymemes"]},{"id":"gemini-g05","set":"Signs","sign":"gemini","text":"your honour, my gemini client did not lie. she told two different versions of the story to two different people, and both of them were completely true at the time","caption":"Mutable sign, mutable facts","tags":["gemini","courtroom","storyteller","mutableair"]},{"id":"gemini-g06","set":"Signs","sign":"gemini","text":"per my last email, my gemini sun is currently running forty-two browser tabs, three group chats and a side quest about medieval spoons. please hold, your question is tab forty-three","caption":"Mercury-ruled multitasking at full volume","tags":["gemini","geminisun","multitasking","corporate"]},{"id":"gemini-g07","set":"Signs","sign":"gemini","text":"airport security pulled me aside because my gemini rising made small talk with the scanner, the officer and the sniffer dog, and they assumed nobody is that chatty without hiding something","caption":"Just friendly, officer, promise","tags":["gemini","geminirising","airport","chatty"]},{"id":"gemini-g08","set":"Signs","sign":"gemini","text":"a gemini friend will forget your birthday but remember one throwaway sentence you said in 2019 and quote it back to you at the perfect moment for maximum devastation","caption":"Mercury files receipts in the strangest folders","tags":["gemini","geminifriend","memory","mercuryruled"]},{"id":"gemini-g09","set":"Signs","sign":"gemini","text":"honestly a gemini would make a great hostage negotiator. within ten minutes we'd know the kidnapper's star sign, his mum's maiden name, and he'd be rethinking his entire career path","caption":"Talked out of it in record time","tags":["gemini","hostagenegotiation","geminisun","talker"]},{"id":"gemini-g10","set":"Signs","sign":"gemini","text":"a formal statement to mercury retrograde from my gemini placements: we were not consulted, we do not support this, and we will be sending seven voice notes a day in protest","caption":"Our ruling planet, our rules","tags":["gemini","mercuryretrograde","geminiplacements","voicenotes"]},{"id":"gemini-g11","set":"Signs","sign":"gemini","text":"tonight's forecast for gemini: scattered opinions, a sudden change of plans around 8pm, and a ninety percent chance of a brand new hobby by morning that will be gone before the weekend","caption":"Mutable air, variable conditions","tags":["gemini","weatherforecast","newhobby","airsign"]},{"id":"gemini-g12","set":"Signs","sign":"gemini","text":"as your gemini coworker i'd like to apologise for the 'quick question' that became forty minutes on your childhood, your landlord, and whether birds have favourite people","caption":"No question is ever quick","tags":["gemini","coworker","officehumor","geminienergy"]},{"id":"gemini-g13","set":"Signs","sign":"gemini","text":"having a gemini mars means i don't fight, i debate. you will not leave this argument angry, you will leave confused, slightly impressed and unsure which side you were on","caption":"Mars in Gemini wins on vocabulary","tags":["gemini","geminimars","debate","astrologyhumor"]},{"id":"gemini-g14","set":"Signs","sign":"gemini","text":"by royal decree, my gemini sun reserves the right to change her mind about dinner up to and including the moment the waiter is holding his pen. this is a constitutional matter x","caption":"Indecision is a sovereign right","tags":["gemini","royaldecree","indecisive","geminisun"]},{"id":"gemini-g15","set":"Signs","sign":"gemini","text":"and here in the waiting room we observe the gemini. having exhausted its phone, it turns to the stranger beside it, and within six minutes they are planning a trip to lisbon together","caption":"Strangers are just friends who haven't been interviewed","tags":["gemini","naturedocumentary","socialbutterfly","mutableair"]},{"id":"cancer-g01","set":"Signs","sign":"cancer","text":"i regret to announce that my cancer moon has once again saved a screenshot of a nice thing someone said to me in 2017. it has been archived, laminated and placed in the vault x","caption":"The Moon rules memory, apparently forever","tags":["cancer","cancermoon","nostalgia","moonchild"]},{"id":"cancer-g02","set":"Signs","sign":"cancer","text":"put a cancer on a heist crew and we'll pack everyone snacks, knit the balaclavas, refuse to leave anyone behind, and by the getaway the security guard is calling me mum","caption":"Mother of the crew, always","tags":["cancer","heist","momfriend","watersign"]},{"id":"cancer-g03","set":"Signs","sign":"cancer","text":"dating a cancer venus means they remember your coffee order after one date, cook your grandma's recipe by the third, and have a drawer at your place by the fourth","caption":"Venus in Cancer moves in emotionally first","tags":["cancer","cancervenus","dating","nurturing"]},{"id":"cancer-g04","set":"Signs","sign":"cancer","text":"your honour, my cancer client is not 'avoiding the issue'. she is approaching it sideways, at her own pace, like a crab, which is her legal right as a cardinal water sign","caption":"Sideways is still forward","tags":["cancer","courtroom","crab","cardinalwater"]},{"id":"cancer-g05","set":"Signs","sign":"cancer","text":"the cancer friend will host the party, feed thirty people, refill every drink, ask everyone how their mum is doing, then hide in the kitchen because there are too many people at the party","caption":"Hostess with the mostest, now in the pantry","tags":["cancer","cancerfriend","momfriend","homebody"]},{"id":"cancer-g06","set":"Signs","sign":"cancer","text":"drop me in a museum and i'll walk straight past the famous painting to stand in front of a chipped old teacup for forty minutes, wondering whose kitchen it lived in. cancer sun things x","caption":"Nostalgic for strangers' grandmothers","tags":["cancer","museum","cancersun","nostalgia"]},{"id":"cancer-g07","set":"Signs","sign":"cancer","text":"a formal notice from my cancer placements: the moon is full tonight, our ruler is in charge, and any feelings expressed between 9pm and midnight are non-binding and cannot be used against us","caption":"The Moon has the floor","tags":["cancer","fullmoon","cancerplacements","moonruled"]},{"id":"cancer-g08","set":"Signs","sign":"cancer","text":"people with a cancer rising walk into your flat and within five minutes they've found the good blanket, refilled your water and fed your cat, and somehow you're the guest now","caption":"Cancer rising turns any room into home","tags":["cancer","cancerrising","cozy","nurturing"]},{"id":"cancer-g09","set":"Signs","sign":"cancer","text":"as your cancer coworker i have brought in homemade banana bread, remembered everyone's birthday, and quietly written down the name of whoever took the last slice without saying thank you","caption":"Sweet, nurturing, keeping records","tags":["cancer","coworker","officehumor","cancersun"]},{"id":"cancer-g10","set":"Signs","sign":"cancer","text":"as the cancer maid of honour i've prepared a short speech. it's forty minutes long, there is a slideshow, and i was in tears by slide two. the groom's uncle has now joined me","caption":"Emotional range of a water sign","tags":["cancer","weddingtoast","maidofhonour","watersign"]},{"id":"cancer-g11","set":"Signs","sign":"cancer","text":"cancer mars energy is being far too polite to confront you directly, so instead i will cook you a beautiful dinner and bring it up very calmly over dessert while you have nowhere to go","caption":"Mars in Cancer fights with casseroles","tags":["cancer","cancermars","conflict","astrologyhumor"]},{"id":"cancer-g12","set":"Signs","sign":"cancer","text":"the forecast for your cancer friend: overcast mornings, a sudden warm front when someone mentions their childhood dog, and tides that rise and fall entirely according to the moon","caption":"Ruled by the Moon, tidal by design","tags":["cancer","weatherforecast","moonchild","cancerfriend"]},{"id":"cancer-g13","set":"Signs","sign":"cancer","text":"a cancer hostage negotiator would ask the kidnapper if he's eaten today, make him a sandwich, ask about his mother, and twenty minutes later everyone is home and he's sending me christmas cards","caption":"Soft power, and a very good sandwich","tags":["cancer","hostagenegotiation","nurturing","cancersun"]},{"id":"cancer-g14","set":"Signs","sign":"cancer","text":"by becoming friends with a cancer you agree to receive unsolicited soup, check-in texts after every thunderstorm, and a lifetime of being introduced as 'basically family' to strangers","caption":"No cancellation policy, just love","tags":["cancer","termsandconditions","cancerfriend","loyalty"]},{"id":"cancer-g15","set":"Signs","sign":"cancer","text":"the estate agent asked why my cancer moon was saying goodbye to each room individually before handing back the keys, and i don't know how to explain that the kitchen and i have history","caption":"Cardinal water, deeply attached","tags":["cancer","movinghouse","cancermoon","sentimental"]},{"id":"aries-m01","set":"Boomer","sign":"aries","text":"Happy Hump Day!!\nMy grandson says I am an Aries which is the Ram....\nI was FIRST in line at the Bank at 8:59 so that tracks LOL\nSHARE if you are also a Ram!!\nLove, Barb","caption":"Aries is the first sign of the zodiac and the Ram likes to be first at everything, including the bank. Ruled by Mars, they hate waiting and love a head start. Are you the first one in line?","tags":["aries","ariesseason","firesigns","boomerhumor","astrologymemes"],"palette":"sunset","ink":"dark"},{"id":"aries-m02","set":"Boomer","sign":"aries","text":"Not on Facebook much but my Horoscope in the newspaper said Aries should \"slow down and think before acting\"\nToo late I already bought the Boat....\nLOL Gary","caption":"Aries runs on Mars energy, which means acting first and reading the instructions later. Their impulsive streak makes life exciting and sometimes very nautical. What's the most Aries purchase you've ever made?","tags":["aries","ariessun","marsruled","zodiacmemes","astrologyhumor"],"palette":"lime","ink":"dark"},{"id":"aries-m03","set":"Boomer","sign":"aries","text":"COPY and PASTE if you are an Aries who has honked at a light that turned green 1 second ago!!!\nMost people won't....\nbut my REAL friends will\nDebbie","caption":"Aries is a cardinal fire sign with zero patience for anything that moves slower than they do, traffic lights included. The impatience comes from a genuine love of momentum. Do you know an Aries who honks first?","tags":["aries","firesign","impatient","zodiacsigns","boomermemes"],"palette":"aqua"},{"id":"aries-m04","set":"Boomer","sign":"aries","text":"Linda this comment was for Carol not you.\nAnyway Aries men will ask you to marry them on the 2nd date.\nYour Uncle Ron did. Fifty one years now LOL\nMom","caption":"Aries falls fast and commits faster, because hesitation just isn't in their chart. That bold, all-in energy can make for a whirlwind romance that actually lasts. Would you say yes on the second date?","tags":["aries","ariesinlove","datingadvice","zodiaccompatibility","astrology"],"palette":"magenta"},{"id":"taurus-m01","set":"Boomer","sign":"taurus","text":"I am a Taurus which is the Bull and I would like to say I am NOT stubborn.\nI have said this since 1971 and I am not changing it now.\nSHARE if you agree!!\nLOL Diane","caption":"Taurus is a fixed earth sign, which means once they decide something, that decision is basically carved in stone. Their stubbornness is really loyalty to what works. What's a Taurus in your life never budging on?","tags":["taurus","taurusseason","earthsigns","stubborn","astrologymemes"],"palette":"classic"},{"id":"taurus-m02","set":"Boomer","sign":"taurus","text":"Happy Friday Eve!!!\nTaurus is the sign of comfort and good food...\nMy husband is a Taurus he has worn the Recliner into the exact shape of himself.\nThis is so true!!!\nPat","caption":"Ruled by Venus, Taurus is all about comfort, routine and the simple pleasures, like one perfect chair. They build a cozy life and settle into it fully. Does your Taurus have a designated seat?","tags":["taurus","venusruled","cozy","zodiacmemes","boomerhumor"],"palette":"deep"},{"id":"taurus-m03","set":"Boomer","sign":"taurus","text":"Took a quiz on here that said Taurus loves Luxury.....\nI do enjoy the GOOD paper towels\nType YES if you are a Taurus who will not buy the off brand!!\nRhonda","caption":"Taurus has a famously refined taste for quality, even in everyday things. Venus gives them an eye for what feels good and lasts. What's the one thing you refuse to buy the cheap version of?","tags":["taurus","taurussun","luxury","zodiacsigns","astrologyhumor"],"palette":"rainbow"},{"id":"taurus-m04","set":"Boomer","sign":"taurus","text":"Dating tip for my Granddaughter (Kayleigh please read)\nA Taurus man will not text back fast but he WILL show up with a casserole and fix your fence\nThat is how you know\nLove Nana","caption":"Taurus shows love through steady actions rather than fast replies. They're dependable, practical and quietly devoted once they're in. Would you take a fixed fence over a quick text?","tags":["taurus","taurusinlove","datingadvice","earthsign","astrology"],"palette":"sunset","ink":"dark"},{"id":"gemini-m01","set":"Boomer","sign":"gemini","text":"Gemini is the Twins.....\nI do not have a twin but I DO have two Facebooks because I forgot the password to the first one\nPlease like my NEW page!!\nTerri","caption":"Gemini is symbolized by the Twins, and they really do seem to live two lives at once. Their curious, restless minds are always starting something new. How many accounts does the Gemini in your life have?","tags":["gemini","geminiseason","airsigns","boomermemes","astrologymemes"],"palette":"lime","ink":"dark"},{"id":"gemini-m02","set":"Boomer","sign":"gemini","text":"Not on Facebook much but\nGemini people can talk to ANYBODY.\nI talked to the man at the Hardware store for 45 minutes about his daughter's wedding. Never got the Mulch\nSHARE if this is you LOL\nJoyce","caption":"Mercury-ruled Gemini can strike up a conversation with literally anyone, anywhere, about anything. The errand is optional; the chat is not. Who's the Gemini that always gets lost in conversation?","tags":["gemini","mercuryruled","chatty","zodiacsigns","boomerhumor"],"palette":"aqua"},{"id":"gemini-m03","set":"Boomer","sign":"gemini","text":"Happy Hump Day!! My horoscope in the paper said Geminis \"have many interests\"\nThis week: pickleball, sourdough, family tree research, the Ukulele and Italian lessons on my phone\nCiao!!\nSandy","caption":"Gemini is a mutable air sign that loves learning a little bit about everything. Their hobbies change as quickly as their interests do, and that's half the fun. What hobby did you pick up this week?","tags":["gemini","geminienergy","hobbies","zodiacmemes","astrology"],"palette":"magenta"},{"id":"gemini-m04","set":"Boomer","sign":"gemini","text":"Phil you asked what sign I am. I am Gemini which means I have two sides...\nOne side wants to go to the Italian place and one wants to stay home\nWe can do both\nLOL Cheryl","caption":"Geminis have a split personality reputation because they genuinely want to try every option. Dating one means saying yes to plans that change and evolve. Would you rather go out or stay in with a Gemini?","tags":["gemini","geminiinlove","datenight","zodiaccompatibility","astrologyhumor"],"palette":"classic"},{"id":"cancer-m01","set":"Boomer","sign":"cancer","text":"I am a Cancer which is the Crab and I am a Homebody.\nWhy go Out when I have my Afghan, my Hallmark movie and 400 photos of the grandkids to look at...\nSHARE if you agree!!\nPeggy","caption":"Cancer is ruled by the Moon and finds its happiest place at home, wrapped in something soft. Like the crab, they carry their comfort zone with them. What's your perfect night in?","tags":["cancer","cancerseason","homebody","watersigns","boomermemes"],"palette":"deep"},{"id":"cancer-m02","set":"Boomer","sign":"cancer","text":"My horoscope says Cancers are very emotional....\nI cried at a diaper commercial, the Olympics, AND when the waitress remembered my name\nThis is so true!!!\nLOL Marlene","caption":"Cancer is a water sign that feels everything deeply, from big moments to tiny kindnesses. Their sensitivity is exactly what makes them such caring partners and friends. What always makes you tear up?","tags":["cancer","moonchild","emotional","zodiacmemes","astrologyhumor"],"palette":"rainbow"},{"id":"cancer-m03","set":"Boomer","sign":"cancer","text":"Type AMEN if you are a Cancer who still has every birthday card anyone ever sent you since 1974!!!\nMost people will scroll past...\nBut a Crab never lets go\nJudy","caption":"Cancer is the zodiac's sentimental keeper, holding onto memories, keepsakes and people for life. That crab grip is pure loyalty. What's the oldest keepsake you still have?","tags":["cancer","cancersun","sentimental","zodiacsigns","boomerhumor"],"palette":"sunset","ink":"dark"},{"id":"cancer-m04","set":"Boomer","sign":"cancer","text":"Kevin I told you if you are dating a Cancer you bring her MOTHER flowers too.\nThey are very close to family\nThis is how I got your Father\n(Kevin please call your mother)\nMom","caption":"Family comes first for Cancer, so winning them over usually means winning over their people too. They're nurturing, protective and deeply loyal in love. Have you ever had to impress the whole family?","tags":["cancer","cancerinlove","datingadvice","familyfirst","astrology"],"palette":"lime","ink":"dark"},{"id":"leo-m01","set":"Boomer","sign":"leo","text":"I am a Leo which is the Lion.....\nThat is why I have the big hair\nRuled by the SUN!!\nPlease like my page, I posted 41 photos from the cruise\nLove, Donna","caption":"Leo is ruled by the Sun and loves to shine, ideally from multiple angles in a full photo album. Their confidence and flair are part of their warmth. How many vacation photos is too many for a Leo?","tags":["leo","leoseason","firesigns","boomermemes","astrologymemes"],"palette":"aqua"},{"id":"leo-m02","set":"Boomer","sign":"leo","text":"Happy Hump Day to everyone EXCEPT the people who did not wish me happy birthday in August\nJust kidding I love you all\nA Leo never forgets LOL\nSharon","caption":"Leos treat their birthday like a national holiday and they absolutely notice who showed up. Underneath the drama is a big, generous heart that wants to celebrate everyone. Did you remember your Leo's birthday?","tags":["leo","leobirthday","leoseason","zodiacmemes","boomerhumor"],"palette":"magenta"},{"id":"leo-m03","set":"Boomer","sign":"leo","text":"Leos are VERY generous.\nI paid for the whole table at the seafood restaurant and only mentioned it for 3 weeks\nThis is so true!!! SHARE\nRick","caption":"Leo is one of the most generous signs in the zodiac and loves treating the people they care about. A little applause afterward never hurts either. Has a Leo ever picked up the whole check for you?","tags":["leo","leosun","generous","zodiacsigns","astrologyhumor"],"palette":"classic"},{"id":"leo-m04","set":"Boomer","sign":"leo","text":"Brenda I saw your new boyfriend is a Leo.\nHe will need lots of compliments...\nTell him his Truck is nice\nThis is how Leos stay happy\nLOL Aunt Kathy","caption":"Leos thrive on appreciation, and a sincere compliment goes a very long way with them. Give them admiration and they'll give you loyalty and warmth in return. What's your go-to compliment for a Leo?","tags":["leo","leoinlove","datingadvice","zodiaccompatibility","astrology"],"palette":"deep"},{"id":"virgo-m01","set":"Boomer","sign":"virgo","text":"I am a Virgo which is the Lady holding the Wheat....\nI have reorganized the Tupperware drawer 3 times today and the lids STILL don't match\nSHARE if you're a Virgo!!\nElaine","caption":"Virgo is the zodiac's organizer, a Mercury-ruled earth sign that finds peace in putting things in order. Mismatched lids are their natural enemy. What drawer would a Virgo fix first in your house?","tags":["virgo","virgoseason","organized","earthsigns","astrologymemes"],"palette":"rainbow"},{"id":"virgo-m02","set":"Boomer","sign":"virgo","text":"Not on Facebook much but I found 4 spelling mistakes in the neighborhood Newsletter and my horoscope said Virgos \"notice details others miss\"\nI have circled them in red pen\nThis is so true!!!\nBev","caption":"Virgos have an eye for detail that catches what everyone else skims past. It comes from a genuine desire to make things better. Have you ever been corrected by a Virgo?","tags":["virgo","virgosun","detailoriented","zodiacmemes","boomerhumor"],"palette":"sunset","ink":"dark"},{"id":"virgo-m03","set":"Boomer","sign":"virgo","text":"Virgos are very Helpful...\nI helped my son load the dishwasher. Then I re-loaded it the right way.\nHe's welcome!!\nType YES if you are a Virgo\nLOL Mom","caption":"Helping is a Virgo's love language, even when the help involves quietly redoing your work. They just want everything done right. Does someone in your house reload the dishwasher after you?","tags":["virgo","virgoenergy","helpful","zodiacsigns","astrologyhumor"],"palette":"lime","ink":"dark"},{"id":"virgo-m04","set":"Boomer","sign":"virgo","text":"Dating a Virgo??\nHe will make a list about you\nYour Uncle Don did this in 1978 on actual paper\nIt had pros and cons and I had more pros\nSHARE this to a Virgo!!\nAuntie Lou","caption":"Virgos approach love thoughtfully and analytically, weighing every detail before they commit. Once you make the list, you're in for good. Would you want to see a Virgo's pros and cons list about you?","tags":["virgo","virgoinlove","datingadvice","zodiaccompatibility","astrology"],"palette":"aqua"},{"id":"libra-m01","set":"Boomer","sign":"libra","text":"I am a Libra which is the Scale. Not the bathroom kind LOL!!!\nWe like everything Fair and Balanced...\nI cut the pie into 8 EXACT pieces and still nobody was happy\nCarol","caption":"Libra is symbolized by the Scales and craves fairness and harmony in every situation, dessert included. They work hard to keep everyone happy. Who's the Libra in your family who cuts the pie?","tags":["libra","libraseason","airsigns","boomermemes","astrologymemes"],"palette":"magenta"},{"id":"libra-m02","set":"Boomer","sign":"libra","text":"Libras can not make decisions.\nWe have been at the restaurant 40 min. The waitress has come by 5 times. I am thinking about the soup OR the salad\nSHARE if you agree.... or don't, either is fine\nNancy","caption":"Libras see every side of every option, which makes choosing anything a real event. Their indecision comes from wanting the best possible outcome. How long does it take your Libra to order?","tags":["libra","indecisive","librasun","zodiacmemes","boomerhumor"],"palette":"classic"},{"id":"libra-m03","set":"Boomer","sign":"libra","text":"Happy Hump Day!! My horoscope in the Newspaper says Libras love Romance and Pretty things...\nMy husband got me a Card with a lighthouse on it\nVery nice I will put it on the fridge\nLOL Gail","caption":"Venus-ruled Libra is a true romantic with a love for beauty and thoughtful gestures. Even a simple card can feel like a love letter to them. What's the sweetest small gesture you've received?","tags":["libra","venusruled","romance","zodiacsigns","astrologyhumor"],"palette":"deep"},{"id":"libra-m04","set":"Boomer","sign":"libra","text":"Libras hate an argument...\nI have agreed with BOTH my sisters about the Thanksgiving thing\nPlease do not tell either one\nDelete this if you are Darlene\nLove Connie","caption":"Libra is the zodiac's peacekeeper, and they'll go to great lengths to avoid taking sides. Keeping harmony matters more to them than being right. Do you know a Libra who agrees with everyone?","tags":["libra","peacemaker","familydrama","zodiaccompatibility","astrology"],"palette":"rainbow"},{"id":"scorpio-m01","set":"Boomer","sign":"scorpio","text":"I am a Scorpion which is the most Mysterious sign...\nMy grandson says it's \"Scorpio\" but I like Scorpion better it is scarier\nDo NOT cross me at Bingo\nLOL Marge","caption":"Scorpio is a fixed water sign known for intensity, mystery and a competitive streak that runs deep. They play to win, even at bingo. Who's the most intense Scorpio you know?","tags":["scorpio","scorpioseason","watersigns","boomermemes","astrologymemes"],"palette":"sunset","ink":"dark"},{"id":"scorpio-m02","set":"Boomer","sign":"scorpio","text":"Not on Facebook much but I see EVERYTHING.\nI saw you un-liked my post Tammy.\nA Scorpio always knows....\nHappy Hump Day!!\nRuth","caption":"Scorpios are famously observant and notice the smallest shifts in how people act. Very little gets past them, online or off. Has a Scorpio ever caught something you thought nobody saw?","tags":["scorpio","scorpiosun","observant","zodiacmemes","boomerhumor"],"palette":"lime","ink":"dark"},{"id":"scorpio-m03","set":"Boomer","sign":"scorpio","text":"WARNING to all Scorpios:\nCopy and Paste this in the next 10 min or your Secrets will be revealed!!!\nJust kidding a Scorpio would never tell you their secrets\nMost of my friends won't even share this\nDeb","caption":"Scorpio is ruled by Pluto and guards its private life closely, sharing secrets only with people who've earned it. That privacy is part of their magnetic mystery. What's one thing a Scorpio has never told you?","tags":["scorpio","plutoruled","secretive","zodiacsigns","astrologyhumor"],"palette":"aqua"},{"id":"scorpio-m04","set":"Boomer","sign":"scorpio","text":"Darryl please read\nIf you are dating a Scorpio do NOT fib about where you were.\nShe already knows.\nShe is just waiting to see if you will tell her\nThis is so true!!!\nAunt Patty","caption":"Scorpios value honesty and loyalty above almost anything in a relationship, and their intuition is sharp. Being upfront is the fastest way to earn their trust. Would you ever try to keep a secret from a Scorpio?","tags":["scorpio","scorpioinlove","datingadvice","zodiaccompatibility","astrology"],"palette":"magenta"},{"id":"sagittarius-m01","set":"Boomer","sign":"sagittarius","text":"I am a Sagittarian which is the Archer.....\nOr the half Horse man? Either way I LOVE to travel!!\nHere are 212 pictures from Branson\nPlease like my page!!\nLove, Rita","caption":"Sagittarius is the zodiac's traveler, a fire sign ruled by Jupiter that is always planning the next adventure. Their symbol is the centaur archer, aiming for somewhere new. Where's your next trip?","tags":["sagittarius","sagittariusseason","firesigns","boomermemes","astrologymemes"],"palette":"classic"},{"id":"sagittarius-m02","set":"Boomer","sign":"sagittarius","text":"Sagittarius people say what they think!!\nI told my neighbor her potato salad needed salt\nShe agreed!!\nHonesty is the best policy\nSHARE if you're Blunt\nLOL Vern","caption":"Sagittarians are famously honest, sometimes a little too honest, but always with good intentions. They believe the truth is a kindness. Has a Sagittarius ever given you a review you didn't ask for?","tags":["sagittarius","sagsun","honest","zodiacmemes","boomerhumor"],"palette":"deep"},{"id":"sagittarius-m03","set":"Boomer","sign":"sagittarius","text":"My Horoscope in the newspaper says Sagittarius needs FREEDOM\nThat is why we bought the RV\nWe are in New Mexico I think...\nHappy Hump Day or whatever day it is!!\nDon and Sheila","caption":"Freedom is a Sagittarius essential, and they're happiest when the road ahead is wide open. Plans are loose and the vibes are optimistic. Would you hop in the RV with a Sagittarius?","tags":["sagittarius","wanderlust","freedom","zodiacsigns","astrologyhumor"],"palette":"rainbow"},{"id":"sagittarius-m04","set":"Boomer","sign":"sagittarius","text":"Jen you said this new fella is a Sagittarius.\nHe will not want to settle down until he has seen every National Park\nGet comfy walking shoes honey\nThis is so true!!!\nGrandma","caption":"Sagittarius brings adventure into relationships and wants a partner who'll explore alongside them. Keep up and you'll have the best stories of anyone you know. Are you ready for a Sagittarius road trip?","tags":["sagittarius","sagittariusinlove","datingadvice","adventure","astrology"],"palette":"sunset","ink":"dark"},{"id":"capricorn-m01","set":"Boomer","sign":"capricorn","text":"I am a Capricorn which is the Goat.\nI worked at the same company 38 years and never once missed a Monday\nSHARE if you are a hard working Goat!!\nDale","caption":"Capricorn is the zodiac's hardest worker, a Saturn-ruled earth sign built for long-term commitment and steady climbing. Like the mountain goat, they keep going until they reach the top. Who's the most dedicated Capricorn you know?","tags":["capricorn","capricornseason","earthsigns","boomermemes","astrologymemes"],"palette":"lime","ink":"dark"},{"id":"capricorn-m02","set":"Boomer","sign":"capricorn","text":"Capricorns are very good with Money.\nI still have the twist tie from the bread in 1996\nYou never know!!\nType YES if you agree\nLOL Phyllis","caption":"Capricorns are practical planners who believe in saving for later, whatever later might bring. Their thriftiness is how they build security. What's the most Capricorn thing you've ever saved?","tags":["capricorn","capricornsun","frugal","zodiacmemes","boomerhumor"],"palette":"aqua"},{"id":"capricorn-m03","set":"Boomer","sign":"capricorn","text":"Not on Facebook much but my Horoscope said Capricorns \"seem serious but have a dry sense of humor\"\nI do not know what they mean by that\n(That was the joke)\nBob","caption":"Capricorns often come across as serious, but they hide one of the driest, sharpest senses of humor in the zodiac. You just have to listen closely. Did you get the joke on the first read?","tags":["capricorn","saturnruled","dryhumor","zodiacsigns","astrologyhumor"],"palette":"magenta"},{"id":"capricorn-m04","set":"Boomer","sign":"capricorn","text":"Dating advice from your Grandpa (a Capricorn):\nBring a 5 year plan to the first date\nI brought mine on a legal pad in 1969\nYour Grandma said yes on the 3rd date\nPlan worked\nLove Grandpa Walt","caption":"Capricorns date with the future in mind and like to know where things are headed. That reliability makes them steady, committed partners. Would you be charmed or nervous if a date brought a five-year plan?","tags":["capricorn","capricorninlove","datingadvice","zodiaccompatibility","astrology"],"palette":"classic"},{"id":"aquarius-m01","set":"Boomer","sign":"aquarius","text":"I am an Aquarius which is the Water sign!!!\n(my grandson says it's actually an AIR sign??? But it's got Water in the name...)\nAnyway I'm very Unique\nSHARE if you are one of a kind\nLOL Janet","caption":"Aquarius is the Water Bearer but actually an air sign, which is fitting for the zodiac's most delightfully unconventional sign. They love being one of a kind. Did you know Aquarius was an air sign?","tags":["aquarius","aquariusseason","airsigns","boomermemes","astrologymemes"],"palette":"deep"},{"id":"aquarius-m02","set":"Boomer","sign":"aquarius","text":"Aquarius people are ahead of their time....\nI had a Cell phone in 1994. It was the size of a Brick and lived in the car\nThis is so true!!!\nHappy Hump Day\nGlenn","caption":"Ruled by Uranus, Aquarius loves innovation and is usually first to try the newest thing. They're the early adopters of the zodiac. What gadget did your Aquarius buy before anyone else?","tags":["aquarius","uranusruled","innovator","zodiacmemes","boomerhumor"],"palette":"rainbow"},{"id":"aquarius-m03","set":"Boomer","sign":"aquarius","text":"Aquarius likes to help the WHOLE World but needs alone time also.\nI organized the neighborhood food drive and then did not answer the door for 2 days\nSHARE if you agree!!\nLorraine","caption":"Aquarius is a humanitarian at heart, but they also need plenty of space to recharge. Big community energy, then a quiet retreat. Do you know an Aquarius who disappears after a good deed?","tags":["aquarius","aquariussun","humanitarian","zodiacsigns","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"aquarius-m04","set":"Boomer","sign":"aquarius","text":"Cindy this is for the Aquarius man you are seeing...\nHe will say \"I just need my Space\"\nDo not worry. He will come back with a Very interesting fact about Octopuses\nLove you\nMom","caption":"Aquarians value independence in love and need room to think their own thoughts. Give them space and they'll return with fascinating ideas to share. What's the best random fact an Aquarius has told you?","tags":["aquarius","aquariusinlove","datingadvice","zodiaccompatibility","astrology"],"palette":"lime","ink":"dark"},{"id":"pisces-m01","set":"Boomer","sign":"pisces","text":"I am a Pisces which is the Fish...\nTwo Fish actually, swimming in different directions\nThat is why I walked in the kitchen and started daydreaming\nHappy Hump Day!!\nLOL Lorna","caption":"Pisces is symbolized by two fish swimming in opposite directions, a perfect picture of their dreamy, drifting mind. They're always half here and half somewhere lovely. Where does your mind wander?","tags":["pisces","piscesseason","watersigns","boomermemes","astrologymemes"],"palette":"aqua"},{"id":"pisces-m02","set":"Boomer","sign":"pisces","text":"Pisces are very sensitive....\nI cried at a Minion movie. TWICE.\nDon't judge me, they were trying their best\nSHARE if you are a Fish with a big heart!!\nTina","caption":"Pisces is the zodiac's most empathetic sign and feels for everyone, even small yellow cartoon characters. Their big heart is their superpower. What movie always gets you?","tags":["pisces","piscessun","empath","zodiacmemes","boomerhumor"],"palette":"magenta"},{"id":"pisces-m03","set":"Boomer","sign":"pisces","text":"My Horoscope in the Newspaper says Pisces are \"Dreamers and Romantics\"\nI have been planning my dream trip to Italy since 1982\nI have the brochure right here\nType YES if you are a Dreamer\nBonnie","caption":"Neptune-ruled Pisces lives for big dreams and romantic visions of the future. They may take the scenic route, but they never stop believing. What dream trip have you been planning forever?","tags":["pisces","neptuneruled","dreamer","zodiacsigns","astrologyhumor"],"palette":"classic"},{"id":"pisces-m04","set":"Boomer","sign":"pisces","text":"Pisces will fall in love with anybody who is nice to them for 5 min\nThe mailman waved at me and I have already picked out our Song\nThis is so true!!!\nLOL Darla","caption":"Pisces are hopeless romantics who fall fast and imagine the whole love story rig 'm not mad\"\n\"do whatever you want\"\n\nyou're safe if a scorpio says\n\n\"\"\n\n(silence means they're planning your birthday surprise)","caption":"Scorpio is all-or-nothing, so their calm words can mean a storm and their silence can mean devotion. They love with total focus, including secret planning. Can you tell when your Scorpio is actually mad?","tags":["scorpio","cooked","scorpiolove","zodiacdating","astrology"],"palette":"rainbow","style":"outline"},{"id":"sagittarius-b01","set":"Brainrot","sign":"sagittarius","text":"sagittarius side quest log\n\nwent out for coffee\nended up at a pottery class in another city\nmade 3 new best friends\nnever got the coffee\n\nmain quest: abandoned. side quests: legendary","caption":"Sagittarius is the mutable fire sign ruled by Jupiter, the planet of adventure and luck. They never stick to the plan, and somehow the detour is always better. What is the wildest side quest a Sag has taken you on?","tags":["sagittarius","sidequest","firesigns","adventure","astrologymemes"],"palette":"lime","ink":"dark","style":"outline"},{"id":"sagittarius-b02","set":"Brainrot","sign":"sagittarius","text":"chat is this real\n\na sagittarius just told their friend's new date \"i give it two months\"\n\nat dinner\n\nout loud\n\nthey were right. they're always right. that's the worst part","caption":"Sagittarius is the zodiac's truth teller, honest to the point of accidental chaos. Their bluntness comes from optimism, not malice, but it still stings. What is the most brutal truth a Sag has told you?","tags":["sagittarius","chatisthisreal","honesty","sagseason","zodiacmemes"],"palette":"classic","style":"outline"},{"id":"sagittarius-b03","set":"Brainrot","sign":"sagittarius","text":"sagittarius rizz tier list\n\ns tier: making you laugh until you choke on your drink\na tier: inviting you on a road trip on date 1\nb tier: actually going on the road trip\nf tier: making plans for next weekend (too far away)","caption":"Sagittarius flirts with humor and spontaneity, so dating them feels like a travel vlog. Freedom matters more to them than planning ahead. Would you say yes to a first date road trip?","tags":["sagittarius","rizz","zodiacdating","sagittariuslove","astrology"],"palette":"aqua","style":"outline"},{"id":"sagittarius-b04","set":"Brainrot","sign":"sagittarius","text":"sagittarius crashing out when someone says \"let's just stay in\"\n\nfriday. 9pm. they're pacing. they've opened 4 flight apps.\n\nthe crash out is literally just a vacation","caption":"Sagittarius needs movement, novelty and open roads, so a quiet weekend feels like a cage. Jupiter makes them restless in the most fun way. Is your Sag already planning an escape?","tags":["sagittarius","crashingout","wanderlust","relatable","astrologyhumor"],"palette":"sunset","ink":"dark","style":"outline"},{"id":"capricorn-b01","set":"Brainrot","sign":"capricorn","text":"capricorn has been locked in since birth\n\nage 7: lemonade stand business plan\nage 15: 5 year plan\nage 25: still on schedule\n\nthe lore is just a spreadsheet and they're winning","caption":"Capricorn is the cardinal earth sign ruled by Saturn, the planet of discipline and long-term goals. They were born with a planner in hand and they actually use it. What was your Capricorn's first business?","tags":["capricorn","lockedin","earthsigns","goals","astrologymemes"],"palette":"deep","style":"outline"},{"id":"capricorn-b02","set":"Brainrot","sign":"capricorn","text":"capricorn rizz tier list\n\ns tier: remembering your goals and asking about them\na tier: sending you a linkedin article\nb tier: replying \"noted\" to your paragraph\nf tier: saying \"i love you\" before the 6 month review","caption":"Capricorn flirts through reliability, ambition and showing up exactly when they said they would. Romance runs on a timeline, but once they commit, it is permanent. Would a LinkedIn article win you over?","tags":["capricorn","rizz","zodiacdating","capricornsun","astrology"],"palette":"sunset","ink":"dark","style":"outline"},{"id":"capricorn-b03","set":"Brainrot","sign":"capricorn","text":"capricorn moon aura scoring\n\nanswering emails on vacation: -1000 aura\nanswering them from a beach chair in a nice coat: +3000 aura\ntaking a real day off: error. aura not found","caption":"A Capricorn moon feels safest when they are being productive, so true rest feels almost suspicious. They are working on it, probably with a schedule. When was your last real day off?","tags":["capricornmoon","capricorn","aurapoints","workaholic","zodiacmemes"],"palette":"magenta","style":"outline"},{"id":"capricorn-b04","set":"Brainrot","sign":"capricorn","text":"chat is this real\n\na capricorn said \"i'm taking the day off\"\n\nthey reorganized their closet\nupdated their resume\nand meal prepped for 3 weeks\n\nthis is what rest looks like for them. respect it","caption":"Capricorns define relaxation as finally getting to the tasks nobody assigned them. Saturn keeps them disciplined, even on a Saturday. What does your Capricorn do on a day off?","tags":["capricorn","chatisthisreal","capricornseason","hustle","astrologyhumor"],"palette":"rainbow","style":"outline"},{"id":"aquarius-b01","set":"Brainrot","sign":"aquarius","text":"aquarius at the party\n\neveryone else: small talk\naquarius: \"do you think octopuses have dreams\"\n\nnot an npc. never was. they're on a completely different server","caption":"Aquarius is the fixed air sign ruled by Uranus, so their mind runs on big questions and odd facts. Small talk bores them, but deep tangents light them up. What random question has an Aquarius asked you?","tags":["aquarius","npc","airsigns","aquariussun","astrologymemes"],"palette":"aqua","style":"outline"},{"id":"aquarius-b02","set":"Brainrot","sign":"aquarius","text":"aquarius lore drop\n\nloves humanity\nleft you on read for 9 days\nwas researching ancient roman plumbing\nwill explain it to you for 2 hours\n\nnot cooked. just on a side quest","caption":"Aquarius cares about the whole world and somehow forgets to text back, because their brain is busy with something fascinating. Detached does not mean uncaring. What is your Aquarius researching right now?","tags":["aquarius","lore","sidequest","leftonread","zodiacmemes"],"palette":"classic","style":"outline"},{"id":"aquarius-b03","set":"Brainrot","sign":"aquarius","text":"aquarius aura report\n\nwearing something weird on purpose: +3000 aura\neveryone copying it 6 months later: +10000 aura\nsaying \"i did it first\": -1000 aura (but they did)","caption":"Aquarius is the zodiac's trendsetter, always ahead of the curve and slightly misunderstood until everyone catches up. Originality is their whole brand. What trend did your Aquarius start first?","tags":["aquarius","aurapoints","trendsetter","aquariusseason","astrologyhumor"],"palette":"lime","ink":"dark","style":"outline"},{"id":"aquarius-b04","set":"Brainrot","sign":"aquarius","text":"pov: you're trying to understand an aquarius moon\n\nthey care about you deeply\nthey will not say it\nthey'll send you a 40 minute documentary instead\n\nthat's the love language. press play","caption":"An Aquarius moon expresses feelings through ideas, sharing what fascinates them instead of saying it outright. If they send you a long video, it means you matter. What has an Aquarius sent you instead of saying I miss you?","tags":["aquariusmoon","aquarius","pov","lovelanguage","astrology"],"palette":"deep","style":"outline"},{"id":"pisces-b01","set":"Brainrot","sign":"pisces","text":"pisces sun is delulu and it's working\n\nmanifested a parking spot: real\nmanifested a free coffee: real\nmanifested their crush texting back: (loading)\n\nchat, the universe is cooking","caption":"Pisces is the mutable water sign ruled by Neptune, the planet of dreams, so manifesting is basically their cardio. Their optimism sounds delusional until it works. What have you manifested lately?","tags":["pisces","delulu","manifesting","watersigns","astrologymemes"],"palette":"magenta","style":"outline"},{"id":"pisces-b02","set":"Brainrot","sign":"pisces","text":"pisces crash out vibes\n\nput on a sad playlist\nstared out a rainy window\nwrote a poem\ncried about the poem\n\nfelt amazing after. that wasn't a crash out. that was a full movie","caption":"Pisces processes big emotions through art, music and a little bit of drama, and it genuinely helps. Neptune turns every feeling into a soundtrack. What is on your Pisces sad playlist?","tags":["pisces","crashingout","piscessun","sadplaylist","zodiacmemes"],"palette":"rainbow","style":"outline"},{"id":"pisces-b03","set":"Brainrot","sign":"pisces","text":"pisces moon aura scoring\n\nknowing what you feel before you do: +5000 aura\ngetting lost in the same mall for the 6th time: -1000 aura\nfinding a cute bookstore while lost: +2000 aura","caption":"A Pisces moon is deeply intuitive about people and famously vague about directions. They might get lost, but they always find something magical on the way. Is your Pisces the one who always gets lost?","tags":["piscesmoon","pisces","aurapoints","intuition","astrologyhumor"],"palette":"sunset","ink":"dark","style":"outline"},{"id":"pisces-b04","set":"Brainrot","sign":"pisces","text":"pov: you vented to a pisces for 5 minutes\n\nthey're crying\nthey're crying harder than you\nnow you're comforting them\n\nsomehow you both feel better. the empath lore is real","caption":"Pisces is the most empathic sign in the zodiac, soaking up other people's feelings like a sponge. It sounds chaotic, but being felt that deeply is healing. Who is the Pisces you vent to?","tags":["pisces","pov","empath","watersign","astrology"],"palette":"aqua","style":"outline"},{"id":"aries-f01","set":"Formats","sign":"aries","text":"Would you Rather:\n\nhave an aries fall for you in 4 minutes\n\nOR\n\nhave an aries fall off a scooter in 4 minutes\n\n(it's the same aries. it's the same 4 minutes)","caption":"Aries is the cardinal fire sign that does everything at full speed, including falling in love and falling off rental scooters. Ruled by Mars, they commit instantly and think about it later. Which one would you pick?","tags":["aries","ariesseason","firesigns","wouldyourather","astrologymemes"],"palette":"lime","ink":"dark"},{"id":"aries-f02","set":"Formats","sign":"aries","text":"Warning: Aries has the power to start a fight, win the fight, forget the fight, and ask you why you're being so quiet at dinner.","caption":"Aries placements burn hot and cool off fast, which is great for them and confusing for everyone else at the table. Mars energy means the argument is over the second they decide it is. Has an Aries ever done this to you?","tags":["aries","ariessun","zodiacmemes","astrologyhumor","marsruled"],"palette":"sunset"},{"id":"aries-f03","set":"Formats","sign":"aries","text":"Why you should let an aries plan the trip\n\n1) we'll leave in 20 minutes\n2) we will not have a hotel\n3) we will race a stranger at the airport\n4) we will win\n\nAnyway we're leaving in 20 minutes","caption":"Aries is the first sign of the zodiac and treats every vacation like a starting gun. Spontaneous, competitive and allergic to itineraries, they will get you there first even if nobody knows where there is. Would you get in the car?","tags":["aries","ariesenergy","travelmemes","zodiacsigns","astrology"],"palette":"classic"},{"id":"aries-f04","set":"Formats","sign":"aries","text":"Life as an aries moon\n\nOne second i'm starting a new hobby\n\nThe next i'm selling the equipment on marketplace\n\nGreat condition. used once. with passion","caption":"An Aries moon falls in love with new projects at first sight and leaves just as fast. The passion is real, it just has a short shelf life. What hobby did you quit within a week?","tags":["ariesmoon","aries","moonsign","astrologymemes","relatable"],"palette":"rainbow"},{"id":"taurus-f01","set":"Formats","sign":"taurus","text":"yes that 5'7 taurus sun who has eaten the same breakfast for six years and refuses to walk faster than 2mph is definitely your soulmate go ask them where they want to eat right now\n\n(they already know. it's the usual)","caption":"Taurus is the fixed earth sign ruled by Venus, which means comfort, routine and very strong opinions about food. They are slow to change and even slower to walk, but endlessly loyal once they pick you. Does your Taurus order the same thing every time?","tags":["taurus","taurussun","earthsigns","soulmate","zodiacdating"],"palette":"aqua"},{"id":"taurus-f02","set":"Formats","sign":"taurus","text":"Venus in Taurus core is saying i'm on a budget and then spending $38 on a candle because it smelled like a cabin i've never been to","caption":"Venus is at home in Taurus, so these placements love luxury, texture and anything that smells expensive. The budget was real, the candle was just more real. What is your Venus in Taurus purchase?","tags":["venusintaurus","taurus","venussign","astrologymemes","treatyourself"],"palette":"magenta"},{"id":"taurus-f03","set":"Formats","sign":"taurus","text":"PSA: a taurus is not ignoring you. a taurus is lying horizontally and has entered power saving mode. please try again after snacks.","caption":"Taurus energy is famously grounded, sensual and deeply committed to rest. When a bull is recharging, there is no rushing them, only feeding them. What snack brings your Taurus back online?","tags":["taurus","taurusseason","zodiacpsa","earthsign","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"taurus-f04","set":"Formats","sign":"taurus","text":"Taurus logic\n\nEither i get my way\n\nOr i simply do not move until the world gets tired\n\nSo technically i always get my way","caption":"Taurus is the most stubborn fixed sign in the zodiac, and they know patience is a weapon. They do not argue, they outlast. Have you ever won a standoff with a Taurus?","tags":["taurus","stubborn","fixedsign","zodiacmemes","astrology"],"palette":"deep"},{"id":"gemini-f01","set":"Formats","sign":"gemini","text":"Things a gemini is doing right now\n\n1) texting you\n2) texting three group chats\n3) learning portuguese\n4) quitting portuguese\n5) starting a podcast about quitting portuguese\n\nThey will reply in 3-5 business years","caption":"Gemini is the mutable air sign ruled by Mercury, so their brain is basically forty open tabs and a podcast mic. Curious about everything and committed to nothing for long, they are never boring. How many tabs does your Gemini have open?","tags":["gemini","geminisun","airsigns","astrologymemes","zodiacsigns"],"palette":"classic"},{"id":"gemini-f02","set":"Formats","sign":"gemini","text":"Warning: Gemini has the power to forget your birthday and then remember a sentence you said in 2019 word for word, including the punctuation.","caption":"Mercury rules Gemini, which gives them a memory that is selective, weirdly detailed and mostly about words. Dates fall out, quotes stay forever. What has a Gemini quoted back to you?","tags":["gemini","geminimemes","mercuryruled","zodiachumor","astrology"],"palette":"rainbow"},{"id":"gemini-f03","set":"Formats","sign":"gemini","text":"Would you Rather:\n\nhear a gemini's side of the story\n\nOR\n\nhear both of a gemini's sides of the story\n\nOR\n\nbe a sandwich","caption":"Gemini is the sign of the twins, so every story comes with at least two versions and a director's cut. Honestly it is entertaining every single time. Which option are you choosing?","tags":["gemini","wouldyourather","geminitwins","astrologymemes","airsign"],"palette":"lime","ink":"dark"},{"id":"gemini-f04","set":"Formats","sign":"gemini","text":"Gemini rising core is having eleven hobbies, zero of them finished, and somehow still being the most interesting person at the party because i can explain all eleven","caption":"A Gemini rising meets the world with curiosity, quick wit and a conversation for every room. They may not finish the pottery class, but they will tell you everything they learned in week one. How many unfinished hobbies are you carrying?","tags":["geminirising","gemini","risingsign","relatable","astrology"],"palette":"magenta"},{"id":"cancer-f01","set":"Formats","sign":"cancer","text":"PSA: if a cancer says \"i'm fine\" please check the fridge. if they made soup, they are not fine. if they made soup for you, you are now family and you cannot leave.","caption":"Cancer is the cardinal water sign ruled by the moon, so feelings come out as home cooking. They nurture everyone around them, especially when they are quietly struggling. What does your Cancer make when they are not fine?","tags":["cancer","cancersign","watersigns","zodiacpsa","astrologymemes"],"palette":"sunset","ink":"dark"},{"id":"cancer-f02","set":"Formats","sign":"cancer","text":"Being a cancer moon is wild\n\nOne second i'm healed\n\nThe next i'm looking at a photo of a bench we sat on in 2017\n\nIt's a nice bench. i miss the bench","caption":"The moon is at home in Cancer, which makes these placements the most nostalgic people in the zodiac. Healing is real, but so is that one bench. What random object makes you emotional?","tags":["cancermoon","cancer","moonsign","nostalgia","astrology"],"palette":"deep"},{"id":"cancer-f03","set":"Formats","sign":"cancer","text":"yes that 5'4 cancer sun who saves every receipt from your first date, calls their mom twice a day and cries at dog food commercials is definitely your soulmate go let them cook for you right now","caption":"Cancer suns are sentimental, family-oriented and loyal to the bone. They will remember your coffee order, your bad week and the exact restaurant from your first date. Do you know a Cancer who keeps every receipt?","tags":["cancer","cancersun","soulmate","zodiacdating","watersign"],"palette":"aqua"},{"id":"cancer-f04","set":"Formats","sign":"cancer","text":"Warning: Cancer has the power to remember the exact thing you said at 11:42pm three summers ago and bring it up gently, with snacks, during a nice moment.","caption":"Cancer placements have emotional memory like a filing cabinet, and every file is labeled with a date and time. They never forget, but they are very sweet about it. What has a Cancer brought up years later?","tags":["cancer","cancerseason","zodiacmemes","astrologyhumor","crab"],"palette":"classic"},{"id":"leo-f01","set":"Formats","sign":"leo","text":"Leo sun core is getting a compliment on my hair and then thinking about it for the next 4-6 business days like it was a lifetime achievement award","caption":"Leo is ruled by the sun, so a single sincere compliment can power them for a week. They shine brightest when they feel seen, and their hair is usually the headline. What compliment has lived in your head rent free?","tags":["leo","leosun","firesigns","leoseason","astrologymemes"],"palette":"rainbow"},{"id":"leo-f02","set":"Formats","sign":"leo","text":"Why you should date a leo\n\n1) we'll hype you up in public\n2) we'll hype you up in private\n3) we'll make you a playlist\n4) the playlist is mostly us\n\nAnyway the playlist slaps","caption":"Leo is the most generous, warm and affectionate fixed fire sign, and they love loudly. You will feel like a celebrity, and they will feel like the headliner. Would you listen to the Leo playlist?","tags":["leo","leolove","zodiacdating","fixedfire","astrology"],"palette":"magenta"},{"id":"leo-f03","set":"Formats","sign":"leo","text":"Would you Rather:\n\nbe adored by a leo\n\nOR\n\nbe a lion's favorite throw pillow\n\n(it's a lot of the same responsibilities)","caption":"Being loved by a Leo means constant affection, big gestures and occasionally being sat on for attention. Ruled by the sun, they give warmth and expect a little in return. Which one are you choosing?","tags":["leo","wouldyourather","leoseason","zodiacmemes","lion"],"palette":"lime","ink":"dark"},{"id":"leo-f04","set":"Formats","sign":"leo","text":"Warning: Leo has the power to walk into a room, find the best lighting in under 3 seconds, and stand in it for the entire evening.","caption":"Leo placements have a natural instinct for the spotlight, literally. Their main character energy comes with an internal light meter. Have you ever watched a Leo find their angle?","tags":["leo","leorising","maincharacter","astrologyhumor","firesign"],"palette":"sunset"},{"id":"virgo-f01","set":"Formats","sign":"virgo","text":"Things my virgo moon did today\n\n1) reorganized the spice rack\n2) alphabetized the spice rack\n3) worried about the spice rack\n4) fixed your life, unprompted\n\nYou're welcome. also you're out of cumin","caption":"A Virgo moon finds emotional peace through order, routines and helping whether you asked or not. Ruled by Mercury, they notice every detail, including what is missing from your kitchen. What has a Virgo fixed for you unprompted?","tags":["virgomoon","virgo","moonsign","earthsigns","astrologymemes"],"palette":"aqua"},{"id":"virgo-f02","set":"Formats","sign":"virgo","text":"PSA: when a virgo says \"just one small note\" please sit down. there are fourteen notes. they are color coded. they are correct.","caption":"Virgo is the mutable earth sign of precision, analysis and helpful feedback. Their criticism comes from caring, and annoyingly, it is usually right. How many notes did your Virgo leave last time?","tags":["virgo","virgoseason","zodiacpsa","perfectionist","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"virgo-f03","set":"Formats","sign":"virgo","text":"yes that 5'6 virgo sun who reads the terms and conditions, carries three kinds of hand cream and has rewritten your resume without asking is definitely your soulmate go let them fix your spreadsheet right now","caption":"Virgo suns show love through acts of service, which is a fancy way of saying they will reorganize your whole life. Practical, devoted and always prepared, they are the partner who packs the band-aids. Has a Virgo ever read the fine print for you?","tags":["virgo","virgosun","soulmate","actsofservice","zodiacdating"],"palette":"classic"},{"id":"virgo-f04","set":"Formats","sign":"virgo","text":"Virgo logic\n\nIf i plan every detail nothing can go wrong\n\nAnd if something goes wrong it means i didn't plan enough\n\nSo anyway i'm up at 3am planning brunch","caption":"Virgo placements treat anxiety like a project management tool. Their Mercury-ruled minds never fully clock out, especially before a group event. What are you overplanning this week?","tags":["virgo","virgoenergy","overthinking","relatable","astrology"],"palette":"deep"},{"id":"libra-f01","set":"Formats","sign":"libra","text":"Would you Rather:\n\nhave a libra pick the restaurant\n\nOR\n\nhave a raccoon pick the restaurant\n\n(the raccoon will decide faster)","caption":"Libra is the cardinal air sign of balance, which means every choice gets weighed from twelve angles. They want everyone to be happy, so nobody gets to eat. Who is picking dinner in your friend group?","tags":["libra","wouldyourather","indecisive","airsigns","astrologymemes"],"palette":"lime","ink":"dark"},{"id":"libra-f02","set":"Formats","sign":"libra","text":"Venus in Libra core is agreeing with both sides of an argument, sincerely, and then going home and making a pros and cons list about which friend to text first","caption":"Venus rules Libra, which makes these placements natural diplomats who hate conflict and love harmony. They see every perspective and feel every one of them. Are you the friend who stays neutral?","tags":["venusinlibra","libra","venussign","peoplepleaser","astrology"],"palette":"magenta"},{"id":"libra-f03","set":"Formats","sign":"libra","text":"Warning: Libra has the power to make you feel like the most fascinating person alive and then not text back for three days because they couldn't pick an emoji.","caption":"Libra charm is legendary, and so is the indecision behind it. They are trying to send the perfect reply, it just takes a few business days. Has a Libra ever left you waiting?","tags":["libra","librasign","zodiacdating","astrologyhumor","texting"],"palette":"rainbow"},{"id":"

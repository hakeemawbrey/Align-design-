<title>Gradient Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a studio bench. Preview frame on the left, controls and the post library on the right; stacks on phones. */
:root{
  --bg:#f6f3fb; --panel:#ffffff; --fg:#1d1530; --muted:#6c6380; --line:#e4ddef;
  --accent:#7b3afd; --accent-ink:#ffffff; --chip:#efe9f8;
  --f-ui:"Figtree",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130f1c; --panel:#1c1628; --fg:#f1ecfa; --muted:#a49bb8; --line:#2e2640;
  --accent:#a77cff; --accent-ink:#130f1c; --chip:#261e36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f1c; --panel:#1c1628; --fg:#f1ecfa; --muted:#a49bb8; --line:#2e2640;
  --accent:#a77cff; --accent-ink:#130f1c; --chip:#261e36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
.handle{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bench{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px}
@media (max-width:820px){.stage{position:static}}
canvas#view{width:100%;max-width:100%;aspect-ratio:3/4;border-radius:14px;display:block;background:var(--chip);box-shadow:0 10px 40px -18px rgba(60,20,120,.45)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
textarea,input[type=search],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:150px;resize:vertical;font-weight:600}
textarea#cap{min-height:90px;font-weight:400}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.field{display:grid;gap:6px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[disabled]{opacity:.5;cursor:default}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:10px;padding:0;border:2px solid transparent;position:relative}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.sw span{position:absolute;inset:auto 0 -18px;font-size:11px;color:var(--muted);font-weight:500}
.swatches{padding-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.lib-filters{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}
@media (max-width:520px){.lib-filters{grid-template-columns:1fr 1fr}.lib-filters input{grid-column:1/-1}}
.list{display:grid;gap:6px;max-height:520px;overflow:auto;padding-right:4px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;font-weight:400;background:transparent;border:1px solid transparent;padding:8px}
.item:hover{background:var(--chip);border-color:var(--line)}
.item[aria-current="true"]{background:var(--chip);border-color:var(--accent)}
.dot{width:28px;height:36px;border-radius:6px}
.item b{display:block;font-size:12px;font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.item .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div><h1>Gradient Studio</h1><p>Text-on-gradient reels for <span class="handle">@zodiac.advice444</span>, 1080×1440.</p></div>
    <div class="row"><button id="rand">Random post</button></div>
  </header>

  <div class="bench">
    <div class="stage">
      <canvas id="view" width="1080" height="1440" aria-label="Post preview"></canvas>
      <div class="row">
        <button class="primary" id="savePng">Save PNG</button>
        <button id="saveVid">Save video</button>
        <button id="play" aria-pressed="true">Pause drift</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>

    <div style="display:grid;gap:20px;min-width:0">
      <section class="panel">
        <div class="field">
          <label class="lbl" for="txt">On-screen text</label>
          <textarea id="txt" spellcheck="true"></textarea>
          <div class="meta" id="count"></div>
        </div>
        <div class="field">
          <span class="lbl">Gradient</span>
          <div class="swatches" id="sw"></div>
        </div>
        <div class="row" style="justify-content:space-between">
          <div class="field">
            <span class="lbl">Text</span>
            <div class="seg" id="ink"><button data-v="light" aria-pressed="true">White</button><button data-v="dark" aria-pressed="false">Black</button></div>
          </div>
          <div class="field" style="min-width:160px">
            <label class="lbl" for="size">Size</label>
            <input type="range" id="size" min="0.6" max="1.4" step="0.05" value="1">
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="cap">Caption</label>
          <textarea id="cap"></textarea>
          <div class="row"><button id="copyCap">Copy caption + hashtags</button><span class="meta" id="tags"></span></div>
        </div>
      </section>

      <section class="panel">
        <div class="row" style="justify-content:space-between"><span class="lbl">Library</span><span class="meta" id="libcount"></span></div>
        <div class="lib-filters">
          <select id="fset" aria-label="Set"></select>
          <select id="fsign" aria-label="Sign"></select>
          <input type="search" id="fq" placeholder="Search words, e.g. katy, soup, retrograde">
        </div>
        <div class="list" id="list"></div>
      </section>
    </div>
  </div>
</div>

<script>
const POSTS = [{"id":"aries-g01","set":"Signs","sign":"aries","text":"drop me in a hostage negotiation and i'll have every demand met in four minutes, mostly because my aries mars cannot physically sit through a second phone call. you're welcome, everyone is free x","caption":"Patience was never on the table","tags":["aries","hostagenegotiation","ariesmars","impatient"]},{"id":"aries-g02","set":"Signs","sign":"aries","text":"effective immediately, my aries placements are stepping down from the escape room. we got out in nine minutes by kicking the door, which staff are calling 'not the intended solution' x","caption":"Cardinal fire always finds the shortcut","tags":["aries","escaperoom","ariesplacements","impatience"]},{"id":"aries-g03","set":"Signs","sign":"aries","text":"dating an aries venus is incredible because they'll chase you across three states and a time zone, then the second you text back first they quietly lose interest and take up pottery","caption":"The chase was the whole personality","tags":["aries","ariesvenus","dating","firesign"]},{"id":"aries-g04","set":"Signs","sign":"aries","text":"my aries moon has a strict feelings policy: we yell for six minutes, apologise for none of it, then ask if you want tacos like the last ten minutes were a different weather system","caption":"Mood passed. Tacos remain.","tags":["aries","ariesmoon","feelings","astrologymemes"]},{"id":"aries-g05","set":"Signs","sign":"aries","text":"per my last email, my aries rising did not 'storm into the meeting'. i entered the room at my natural walking speed, which happens to be the speed of a minor emergency","caption":"Aries rising walks like the building is on fire","tags":["aries","ariesrising","corporate","astrologyhumor"]},{"id":"aries-g06","set":"Signs","sign":"aries","text":"put an aries on a jury and we'll have a verdict before the opening statements finish. guilty, not guilty, honestly whatever, the important thing is that we were first","caption":"Justice, but make it a race","tags":["aries","courtroom","competitive","cardinalfire"]},{"id":"aries-g07","set":"Signs","sign":"aries","text":"and here we observe the aries in its natural habitat, starting an argument in the group chat at 1am, winning it, forgetting it, then sleeping peacefully like a newborn ram","caption":"Zero thoughts after the victory lap","tags":["aries","naturedocumentary","groupchat","ariesenergy"]},{"id":"aries-g08","set":"Signs","sign":"aries","text":"as your aries coworker i'd like to clarify that i do not have a temper. i have a very fast reply-all button and a deep personal hatred of meetings that could have been settled by arm wrestling","caption":"Efficient, alarming and somehow still beloved","tags":["aries","coworker","officehumor","marsruled"]},{"id":"aries-g09","set":"Signs","sign":"aries","text":"by royal decree of the aries sun, the astrological new year begins in march, the calendar is wrong, and january has been formally downgraded to a soft launch","caption":"Aries season is the real new year, sorry","tags":["aries","ariesseason","astrologicalnewyear","royaldecree"]},{"id":"aries-g10","set":"Signs","sign":"aries","text":"airport security asked my aries mars to step aside for additional screening and honestly fair, i did sprint to the gate like it owed me money and our flight is in three hours","caption":"Boarding group: right now, actually","tags":["aries","airport","ariesmars","travel"]},{"id":"aries-g11","set":"Signs","sign":"aries","text":"as the aries best man i'd like to raise a glass to the happy couple, and to the fact that i objected out loud before the officiant even got to that part. i stand by the timing","caption":"Speaking first, thinking at some point","tags":["aries","weddingtoast","bestman","ariessun"]},{"id":"aries-g12","set":"Signs","sign":"aries","text":"an aries friend will drive across town at 2am to defend your honour, then call you the next morning like 'wait, what was his name again'. loyalty, not memory","caption":"Ride or die, mostly ride","tags":["aries","ariesfriend","loyalty","firesign"]},{"id":"aries-g13","set":"Signs","sign":"aries","text":"by entering a relationship with an aries you agree to the following terms: every board game is a blood sport, every walk is a race, and the loser buys dinner. there is no opt-out x","caption":"Read the fine print, if you can keep up","tags":["aries","termsandconditions","ariesinlove","competitive"]},{"id":"aries-g14","set":"Signs","sign":"aries","text":"today's forecast for your aries friend: sudden heat around noon, a brief and dramatic storm over someone parking badly, then clear skies by two with absolutely no memory of it","caption":"Fast front, short memory","tags":["aries","weatherforecast","ariestemper","astrologymemes"]},{"id":"aries-g15","set":"Signs","sign":"aries","text":"i have been summoned to small claims court by my own to-do list, which alleges my aries sun started eleven projects this month and abandoned all eleven with 'alarming enthusiasm'","caption":"Pleading enthusiastic, your honour","tags":["aries","courtsummons","ariessun","newprojects"]},{"id":"taurus-g01","set":"Signs","sign":"taurus","text":"i regret to announce that my taurus moon will not be attending the spontaneous road trip. i have a nap scheduled for 3pm and i do not negotiate with spontaneity x","caption":"Plans are for people without blankets","tags":["taurus","taurusmoon","naps","homebody"]},{"id":"taurus-g02","set":"Signs","sign":"taurus","text":"put a taurus on a heist crew and we'll spend four months planning, refuse to rush the vault, and walk out with the cash and the cheese board from the bank manager's office","caption":"Earth signs don't leave without snacks","tags":["taurus","heist","foodie","earthsign"]},{"id":"taurus-g03","set":"Signs","sign":"taurus","text":"dating a taurus venus means being taken to the same restaurant every friday for six years and slowly realising that this is, in fact, the most romantic thing anyone has ever done","caption":"Venus at home, loving on a loop","tags":["taurus","taurusvenus","romance","venusruled"]},{"id":"taurus-g04","set":"Signs","sign":"taurus","text":"your honour, my taurus client did not 'hold a grudge for nine years'. she simply never updated her opinion of him, which is very different and frankly far more efficient","caption":"Fixed sign, fixed opinions","tags":["taurus","courtroom","grudges","fixedsign"]},{"id":"taurus-g05","set":"Signs","sign":"taurus","text":"taurus coworker update: i will be adapting to the new software sometime between never and the day the old software is physically removed from my hands by a team of professionals","caption":"Change management has requested backup","tags":["taurus","coworker","stubborn","officehumor"]},{"id":"taurus-g06","set":"Signs","sign":"taurus","text":"the taurus has located a soft blanket. it will now remain on this sofa for the rainy season, emerging only to inspect the fridge and silently judge the thermostat","caption":"Please do not disturb the grazing","tags":["taurus","naturedocumentary","cozy","taurusenergy"]},{"id":"taurus-g07","set":"Signs","sign":"taurus","text":"i'd be useless as a hostage negotiator because i'm a taurus. my opening offer is my final offer, and i am fully prepared to sit here eating crisps until you agree with me","caption":"The bull does not counter-offer","tags":["taurus","hostagenegotiation","stubborn","taurussun"]},{"id":"taurus-g08","set":"Signs","sign":"taurus","text":"the dmv has finally met its match. my taurus sun brought a folding chair, a thermos, a novel and a mid-morning snack, and i am not leaving this building without my licence or a pension","caption":"Earth sign endurance remains undefeated","tags":["taurus","dmv","patience","taurussun"]},{"id":"taurus-g09","set":"Signs","sign":"taurus","text":"people with a taurus rising walk into a room like it's a spa they've already paid for, and somehow everyone else starts speaking more quietly and ordering the nice bread","caption":"Venus-ruled ascendant, expensive aura","tags":["taurus","taurusrising","aura","venusruled"]},{"id":"taurus-g10","set":"Signs","sign":"taurus","text":"a taurus friend won't text back for four days and then shows up at your door with soup, a plant and an opinion about your landlord. texting is not the love language. presence is","caption":"Shows up. Does not reply.","tags":["taurus","taurusfriend","lovelanguage","earthsign"]},{"id":"taurus-g11","set":"Signs","sign":"taurus","text":"terms and conditions for borrowing anything from a taurus: return it in its original condition, on the agreed date, with a small gift for the distress of being apart from it","caption":"Venus rules possessions, and it shows","tags":["taurus","termsandconditions","possessive","taurusplacements"]},{"id":"taurus-g12","set":"Signs","sign":"taurus","text":"let it be known across the kingdom that my taurus moon has opened a savings account for comfort. every payday a fixed amount goes directly to candles, linen and a very good olive oil","caption":"Financial planning, earth sign edition","tags":["taurus","royaldecree","taurusmoon","luxury"]},{"id":"taurus-g13","set":"Signs","sign":"taurus","text":"nobody warns you that a taurus mars is the calmest person alive for eleven months and then once a year someone takes their parking spot and the whole street learns what a stampede is","caption":"Slow to anger, impossible to stop","tags":["taurus","taurusmars","slowburn","fixedearth"]},{"id":"taurus-g14","set":"Signs","sign":"taurus","text":"as the taurus maid of honour my speech will be brief, because i have located the dessert table and i would like to be reunited with it before anyone cuts the cake","caption":"Priorities were set at birth","tags":["taurus","weddingtoast","dessert","taurussun"]},{"id":"taurus-g15","set":"Signs","sign":"taurus","text":"the weather forecast for taurus season: warm, grounded, zero chance of anyone changing their mind, and a high likelihood of someone 'just popping out for bread' and coming home with flowers","caption":"Fixed earth, high pressure system","tags":["taurus","taurusseason","weatherforecast","earthsign"]},{"id":"gemini-g01","set":"Signs","sign":"gemini","text":"i regret to announce that my gemini mercury has been asked to leave the book club after revealing the ending, three alternative endings, and a rumour about the author's neighbour","caption":"Information wants to be free, and so does Gemini","tags":["gemini","geminimercury","bookclub","mercuryruled"]},{"id":"gemini-g02","set":"Signs","sign":"gemini","text":"take a gemini to a museum and they'll read every plaque, invent a backstory for each portrait, befriend the security guard and leave knowing his ex's full name and his theory about the sculptures","caption":"Mutable air, unlimited curiosity","tags":["gemini","museum","curious","airsign"]},{"id":"gemini-g03","set":"Signs","sign":"gemini","text":"dating a gemini venus is incredible because the conversation never stops, the plans change hourly, and three dates in you realise you've been seeing at least two delightful people","caption":"Twice the charm, half the punctuality","tags":["gemini","geminivenus","dating","twins"]},{"id":"gemini-g04","set":"Signs","sign":"gemini","text":"my gemini moon handles feelings by turning them into a podcast. two hosts, both of them me, seven episodes in, still no conclusion, but the guest list is excellent","caption":"Analysed, discussed, never actually felt","tags":["gemini","geminimoon","feelings","astrologymemes"]},{"id":"gemini-g05","set":"Signs","sign":"gemini","text":"your honour, my gemini client did not lie. she told two different versions of the story to two different people, and both of them were completely true at the time","caption":"Mutable sign, mutable facts","tags":["gemini","courtroom","storyteller","mutableair"]},{"id":"gemini-g06","set":"Signs","sign":"gemini","text":"per my last email, my gemini sun is currently running forty-two browser tabs, three group chats and a side quest about medieval spoons. please hold, your question is tab forty-three","caption":"Mercury-ruled multitasking at full volume","tags":["gemini","geminisun","multitasking","corporate"]},{"id":"gemini-g07","set":"Signs","sign":"gemini","text":"airport security pulled me aside because my gemini rising made small talk with the scanner, the officer and the sniffer dog, and they assumed nobody is that chatty without hiding something","caption":"Just friendly, officer, promise","tags":["gemini","geminirising","airport","chatty"]},{"id":"gemini-g08","set":"Signs","sign":"gemini","text":"a gemini friend will forget your birthday but remember one throwaway sentence you said in 2019 and quote it back to you at the perfect moment for maximum devastation","caption":"Mercury files receipts in the strangest folders","tags":["gemini","geminifriend","memory","mercuryruled"]},{"id":"gemini-g09","set":"Signs","sign":"gemini","text":"honestly a gemini would make a great hostage negotiator. within ten minutes we'd know the kidnapper's star sign, his mum's maiden name, and he'd be rethinking his entire career path","caption":"Talked out of it in record time","tags":["gemini","hostagenegotiation","geminisun","talker"]},{"id":"gemini-g10","set":"Signs","sign":"gemini","text":"a formal statement to mercury retrograde from my gemini placements: we were not consulted, we do not support this, and we will be sending seven voice notes a day in protest","caption":"Our ruling planet, our rules","tags":["gemini","mercuryretrograde","geminiplacements","voicenotes"]},{"id":"gemini-g11","set":"Signs","sign":"gemini","text":"tonight's forecast for gemini: scattered opinions, a sudden change of plans around 8pm, and a ninety percent chance of a brand new hobby by morning that will be gone before the weekend","caption":"Mutable air, variable conditions","tags":["gemini","weatherforecast","newhobby","airsign"]},{"id":"gemini-g12","set":"Signs","sign":"gemini","text":"as your gemini coworker i'd like to apologise for the 'quick question' that became forty minutes on your childhood, your landlord, and whether birds have favourite people","caption":"No question is ever quick","tags":["gemini","coworker","officehumor","geminienergy"]},{"id":"gemini-g13","set":"Signs","sign":"gemini","text":"having a gemini mars means i don't fight, i debate. you will not leave this argument angry, you will leave confused, slightly impressed and unsure which side you were on","caption":"Mars in Gemini wins on vocabulary","tags":["gemini","geminimars","debate","astrologyhumor"]},{"id":"gemini-g14","set":"Signs","sign":"gemini","text":"by royal decree, my gemini sun reserves the right to change her mind about dinner up to and including the moment the waiter is holding his pen. this is a constitutional matter x","caption":"Indecision is a sovereign right","tags":["gemini","royaldecree","indecisive","geminisun"]},{"id":"gemini-g15","set":"Signs","sign":"gemini","text":"and here in the waiting room we observe the gemini. having exhausted its phone, it turns to the stranger beside it, and within six minutes they are planning a trip to lisbon together","caption":"Strangers are just friends who haven't been interviewed","tags":["gemini","naturedocumentary","socialbutterfly","mutableair"]},{"id":"cancer-g01","set":"Signs","sign":"cancer","text":"i regret to announce that my cancer moon has once again saved a screenshot of a nice thing someone said to me in 2017. it has been archived, laminated and placed in the vault x","caption":"The Moon rules memory, apparently forever","tags":["cancer","cancermoon","nostalgia","moonchild"]},{"id":"cancer-g02","set":"Signs","sign":"cancer","text":"put a cancer on a heist crew and we'll pack everyone snacks, knit the balaclavas, refuse to leave anyone behind, and by the getaway the security guard is calling me mum","caption":"Mother of the crew, always","tags":["cancer","heist","momfriend","watersign"]},{"id":"cancer-g03","set":"Signs","sign":"cancer","text":"dating a cancer venus means they remember your coffee order after one date, cook your grandma's recipe by the third, and have a drawer at your place by the fourth","caption":"Venus in Cancer moves in emotionally first","tags":["cancer","cancervenus","dating","nurturing"]},{"id":"cancer-g04","set":"Signs","sign":"cancer","text":"your honour, my cancer client is not 'avoiding the issue'. she is approaching it sideways, at her own pace, like a crab, which is her legal right as a cardinal water sign","caption":"Sideways is still forward","tags":["cancer","courtroom","crab","cardinalwater"]},{"id":"cancer-g05","set":"Signs","sign":"cancer","text":"the cancer friend will host the party, feed thirty people, refill every drink, ask everyone how their mum is doing, then hide in the kitchen because there are too many people at the party","caption":"Hostess with the mostest, now in the pantry","tags":["cancer","cancerfriend","momfriend","homebody"]},{"id":"cancer-g06","set":"Signs","sign":"cancer","text":"drop me in a museum and i'll walk straight past the famous painting to stand in front of a chipped old teacup for forty minutes, wondering whose kitchen it lived in. cancer sun things x","caption":"Nostalgic for strangers' grandmothers","tags":["cancer","museum","cancersun","nostalgia"]},{"id":"cancer-g07","set":"Signs","sign":"cancer","text":"a formal notice from my cancer placements: the moon is full tonight, our ruler is in charge, and any feelings expressed between 9pm and midnight are non-binding and cannot be used against us","caption":"The Moon has the floor","tags":["cancer","fullmoon","cancerplacements","moonruled"]},{"id":"cancer-g08","set":"Signs","sign":"cancer","text":"people with a cancer rising walk into your flat and within five minutes they've found the good blanket, refilled your water and fed your cat, and somehow you're the guest now","caption":"Cancer rising turns any room into home","tags":["cancer","cancerrising","cozy","nurturing"]},{"id":"cancer-g09","set":"Signs","sign":"cancer","text":"as your cancer coworker i have brought in homemade banana bread, remembered everyone's birthday, and quietly written down the name of whoever took the last slice without saying thank you","caption":"Sweet, nurturing, keeping records","tags":["cancer","coworker","officehumor","cancersun"]},{"id":"cancer-g10","set":"Signs","sign":"cancer","text":"as the cancer maid of honour i've prepared a short speech. it's forty minutes long, there is a slideshow, and i was in tears by slide two. the groom's uncle has now joined me","caption":"Emotional range of a water sign","tags":["cancer","weddingtoast","maidofhonour","watersign"]},{"id":"cancer-g11","set":"Signs","sign":"cancer","text":"cancer mars energy is being far too polite to confront you directly, so instead i will cook you a beautiful dinner and bring it up very calmly over dessert while you have nowhere to go","caption":"Mars in Cancer fights with casseroles","tags":["cancer","cancermars","conflict","astrologyhumor"]},{"id":"cancer-g12","set":"Signs","sign":"cancer","text":"the forecast for your cancer friend: overcast mornings, a sudden warm front when someone mentions their childhood dog, and tides that rise and fall entirely according to the moon","caption":"Ruled by the Moon, tidal by design","tags":["cancer","weatherforecast","moonchild","cancerfriend"]},{"id":"cancer-g13","set":"Signs","sign":"cancer","text":"a cancer hostage negotiator would ask the kidnapper if he's eaten today, make him a sandwich, ask about his mother, and twenty minutes later everyone is home and he's sending me christmas cards","caption":"Soft power, and a very good sandwich","tags":["cancer","hostagenegotiation","nurturing","cancersun"]},{"id":"cancer-g14","set":"Signs","sign":"cancer","text":"by becoming friends with a cancer you agree to receive unsolicited soup, check-in texts after every thunderstorm, and a lifetime of being introduced as 'basically family' to strangers","caption":"No cancellation policy, just love","tags":["cancer","termsandconditions","cancerfriend","loyalty"]},{"id":"cancer-g15","set":"Signs","sign":"cancer","text":"the estate agent asked why my cancer moon was saying goodbye to each room individually before handing back the keys, and i don't know how to explain that the kitchen and i have history","caption":"Cardinal water, deeply attached","tags":["cancer","movinghouse","cancermoon","sentimental"]},{"id":"aries-f01","set":"Formats","sign":"aries","text":"Would you Rather:\n\nhave an aries fall for you in 4 minutes\n\nOR\n\nhave an aries fall off a scooter in 4 minutes\n\n(it's the same aries. it's the same 4 minutes)","caption":"Aries is the cardinal fire sign that does everything at full speed, including falling in love and falling off rental scooters. Ruled by Mars, they commit instantly and think about it later. Which one would you pick?","tags":["aries","ariesseason","firesigns","wouldyourather","astrologymemes"],"palette":"lime","ink":"dark"},{"id":"aries-f02","set":"Formats","sign":"aries","text":"Warning: Aries has the power to start a fight, win the fight, forget the fight, and ask you why you're being so quiet at dinner.","caption":"Aries placements burn hot and cool off fast, which is great for them and confusing for everyone else at the table. Mars energy means the argument is over the second they decide it is. Has an Aries ever done this to you?","tags":["aries","ariessun","zodiacmemes","astrologyhumor","marsruled"],"palette":"sunset"},{"id":"aries-f03","set":"Formats","sign":"aries","text":"Why you should let an aries plan the trip\n\n1) we'll leave in 20 minutes\n2) we will not have a hotel\n3) we will race a stranger at the airport\n4) we will win\n\nAnyway we're leaving in 20 minutes","caption":"Aries is the first sign of the zodiac and treats every vacation like a starting gun. Spontaneous, competitive and allergic to itineraries, they will get you there first even if nobody knows where there is. Would you get in the car?","tags":["aries","ariesenergy","travelmemes","zodiacsigns","astrology"],"palette":"classic"},{"id":"aries-f04","set":"Formats","sign":"aries","text":"Life as an aries moon\n\nOne second i'm starting a new hobby\n\nThe next i'm selling the equipment on marketplace\n\nGreat condition. used once. with passion","caption":"An Aries moon falls in love with new projects at first sight and leaves just as fast. The passion is real, it just has a short shelf life. What hobby did you quit within a week?","tags":["ariesmoon","aries","moonsign","astrologymemes","relatable"],"palette":"rainbow"},{"id":"taurus-f01","set":"Formats","sign":"taurus","text":"yes that 5'7 taurus sun who has eaten the same breakfast for six years and refuses to walk faster than 2mph is definitely your soulmate go ask them where they want to eat right now\n\n(they already know. it's the usual)","caption":"Taurus is the fixed earth sign ruled by Venus, which means comfort, routine and very strong opinions about food. They are slow to change and even slower to walk, but endlessly loyal once they pick you. Does your Taurus order the same thing every time?","tags":["taurus","taurussun","earthsigns","soulmate","zodiacdating"],"palette":"aqua"},{"id":"taurus-f02","set":"Formats","sign":"taurus","text":"Venus in Taurus core is saying i'm on a budget and then spending $38 on a candle because it smelled like a cabin i've never been to","caption":"Venus is at home in Taurus, so these placements love luxury, texture and anything that smells expensive. The budget was real, the candle was just more real. What is your Venus in Taurus purchase?","tags":["venusintaurus","taurus","venussign","astrologymemes","treatyourself"],"palette":"magenta"},{"id":"taurus-f03","set":"Formats","sign":"taurus","text":"PSA: a taurus is not ignoring you. a taurus is lying horizontally and has entered power saving mode. please try again after snacks.","caption":"Taurus energy is famously grounded, sensual and deeply committed to rest. When a bull is recharging, there is no rushing them, only feeding them. What snack brings your Taurus back online?","tags":["taurus","taurusseason","zodiacpsa","earthsign","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"taurus-f04","set":"Formats","sign":"taurus","text":"Taurus logic\n\nEither i get my way\n\nOr i simply do not move until the world gets tired\n\nSo technically i always get my way","caption":"Taurus is the most stubborn fixed sign in the zodiac, and they know patience is a weapon. They do not argue, they outlast. Have you ever won a standoff with a Taurus?","tags":["taurus","stubborn","fixedsign","zodiacmemes","astrology"],"palette":"deep"},{"id":"gemini-f01","set":"Formats","sign":"gemini","text":"Things a gemini is doing right now\n\n1) texting you\n2) texting three group chats\n3) learning portuguese\n4) quitting portuguese\n5) starting a podcast about quitting portuguese\n\nThey will reply in 3-5 business years","caption":"Gemini is the mutable air sign ruled by Mercury, so their brain is basically forty open tabs and a podcast mic. Curious about everything and committed to nothing for long, they are never boring. How many tabs does your Gemini have open?","tags":["gemini","geminisun","airsigns","astrologymemes","zodiacsigns"],"palette":"classic"},{"id":"gemini-f02","set":"Formats","sign":"gemini","text":"Warning: Gemini has the power to forget your birthday and then remember a sentence you said in 2019 word for word, including the punctuation.","caption":"Mercury rules Gemini, which gives them a memory that is selective, weirdly detailed and mostly about words. Dates fall out, quotes stay forever. What has a Gemini quoted back to you?","tags":["gemini","geminimemes","mercuryruled","zodiachumor","astrology"],"palette":"rainbow"},{"id":"gemini-f03","set":"Formats","sign":"gemini","text":"Would you Rather:\n\nhear a gemini's side of the story\n\nOR\n\nhear both of a gemini's sides of the story\n\nOR\n\nbe a sandwich","caption":"Gemini is the sign of the twins, so every story comes with at least two versions and a director's cut. Honestly it is entertaining every single time. Which option are you choosing?","tags":["gemini","wouldyourather","geminitwins","astrologymemes","airsign"],"palette":"lime","ink":"dark"},{"id":"gemini-f04","set":"Formats","sign":"gemini","text":"Gemini rising core is having eleven hobbies, zero of them finished, and somehow still being the most interesting person at the party because i can explain all eleven","caption":"A Gemini rising meets the world with curiosity, quick wit and a conversation for every room. They may not finish the pottery class, but they will tell you everything they learned in week one. How many unfinished hobbies are you carrying?","tags":["geminirising","gemini","risingsign","relatable","astrology"],"palette":"magenta"},{"id":"cancer-f01","set":"Formats","sign":"cancer","text":"PSA: if a cancer says \"i'm fine\" please check the fridge. if they made soup, they are not fine. if they made soup for you, you are now family and you cannot leave.","caption":"Cancer is the cardinal water sign ruled by the moon, so feelings come out as home cooking. They nurture everyone around them, especially when they are quietly struggling. What does your Cancer make when they are not fine?","tags":["cancer","cancersign","watersigns","zodiacpsa","astrologymemes"],"palette":"sunset","ink":"dark"},{"id":"cancer-f02","set":"Formats","sign":"cancer","text":"Being a cancer moon is wild\n\nOne second i'm healed\n\nThe next i'm looking at a photo of a bench we sat on in 2017\n\nIt's a nice bench. i miss the bench","caption":"The moon is at home in Cancer, which makes these placements the most nostalgic people in the zodiac. Healing is real, but so is that one bench. What random object makes you emotional?","tags":["cancermoon","cancer","moonsign","nostalgia","astrology"],"palette":"deep"},{"id":"cancer-f03","set":"Formats","sign":"cancer","text":"yes that 5'4 cancer sun who saves every receipt from your first date, calls their mom twice a day and cries at dog food commercials is definitely your soulmate go let them cook for you right now","caption":"Cancer suns are sentimental, family-oriented and loyal to the bone. They will remember your coffee order, your bad week and the exact restaurant from your first date. Do you know a Cancer who keeps every receipt?","tags":["cancer","cancersun","soulmate","zodiacdating","watersign"],"palette":"aqua"},{"id":"cancer-f04","set":"Formats","sign":"cancer","text":"Warning: Cancer has the power to remember the exact thing you said at 11:42pm three summers ago and bring it up gently, with snacks, during a nice moment.","caption":"Cancer placements have emotional memory like a filing cabinet, and every file is labeled with a date and time. They never forget, but they are very sweet about it. What has a Cancer brought up years later?","tags":["cancer","cancerseason","zodiacmemes","astrologyhumor","crab"],"palette":"classic"},{"id":"leo-f01","set":"Formats","sign":"leo","text":"Leo sun core is getting a compliment on my hair and then thinking about it for the next 4-6 business days like it was a lifetime achievement award","caption":"Leo is ruled by the sun, so a single sincere compliment can power them for a week. They shine brightest when they feel seen, and their hair is usually the headline. What compliment has lived in your head rent free?","tags":["leo","leosun","firesigns","leoseason","astrologymemes"],"palette":"rainbow"},{"id":"leo-f02","set":"Formats","sign":"leo","text":"Why you should date a leo\n\n1) we'll hype you up in public\n2) we'll hype you up in private\n3) we'll make you a playlist\n4) the playlist is mostly us\n\nAnyway the playlist slaps","caption":"Leo is the most generous, warm and affectionate fixed fire sign, and they love loudly. You will feel like a celebrity, and they will feel like the headliner. Would you listen to the Leo playlist?","tags":["leo","leolove","zodiacdating","fixedfire","astrology"],"palette":"magenta"},{"id":"leo-f03","set":"Formats","sign":"leo","text":"Would you Rather:\n\nbe adored by a leo\n\nOR\n\nbe a lion's favorite throw pillow\n\n(it's a lot of the same responsibilities)","caption":"Being loved by a Leo means constant affection, big gestures and occasionally being sat on for attention. Ruled by the sun, they give warmth and expect a little in return. Which one are you choosing?","tags":["leo","wouldyourather","leoseason","zodiacmemes","lion"],"palette":"lime","ink":"dark"},{"id":"leo-f04","set":"Formats","sign":"leo","text":"Warning: Leo has the power to walk into a room, find the best lighting in under 3 seconds, and stand in it for the entire evening.","caption":"Leo placements have a natural instinct for the spotlight, literally. Their main character energy comes with an internal light meter. Have you ever watched a Leo find their angle?","tags":["leo","leorising","maincharacter","astrologyhumor","firesign"],"palette":"sunset"},{"id":"virgo-f01","set":"Formats","sign":"virgo","text":"Things my virgo moon did today\n\n1) reorganized the spice rack\n2) alphabetized the spice rack\n3) worried about the spice rack\n4) fixed your life, unprompted\n\nYou're welcome. also you're out of cumin","caption":"A Virgo moon finds emotional peace through order, routines and helping whether you asked or not. Ruled by Mercury, they notice every detail, including what is missing from your kitchen. What has a Virgo fixed for you unprompted?","tags":["virgomoon","virgo","moonsign","earthsigns","astrologymemes"],"palette":"aqua"},{"id":"virgo-f02","set":"Formats","sign":"virgo","text":"PSA: when a virgo says \"just one small note\" please sit down. there are fourteen notes. they are color coded. they are correct.","caption":"Virgo is the mutable earth sign of precision, analysis and helpful feedback. Their criticism comes from caring, and annoyingly, it is usually right. How many notes did your Virgo leave last time?","tags":["virgo","virgoseason","zodiacpsa","perfectionist","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"virgo-f03","set":"Formats","sign":"virgo","text":"yes that 5'6 virgo sun who reads the terms and conditions, carries three kinds of hand cream and has rewritten your resume without asking is definitely your soulmate go let them fix your spreadsheet right now","caption":"Virgo suns show love through acts of service, which is a fancy way of saying they will reorganize your whole life. Practical, devoted and always prepared, they are the partner who packs the band-aids. Has a Virgo ever read the fine print for you?","tags":["virgo","virgosun","soulmate","actsofservice","zodiacdating"],"palette":"classic"},{"id":"virgo-f04","set":"Formats","sign":"virgo","text":"Virgo logic\n\nIf i plan every detail nothing can go wrong\n\nAnd if something goes wrong it means i didn't plan enough\n\nSo anyway i'm up at 3am planning brunch","caption":"Virgo placements treat anxiety like a project management tool. Their Mercury-ruled minds never fully clock out, especially before a group event. What are you overplanning this week?","tags":["virgo","virgoenergy","overthinking","relatable","astrology"],"palette":"deep"},{"id":"libra-f01","set":"Formats","sign":"libra","text":"Would you Rather:\n\nhave a libra pick the restaurant\n\nOR\n\nhave a raccoon pick the restaurant\n\n(the raccoon will decide faster)","caption":"Libra is the cardinal air sign of balance, which means every choice gets weighed from twelve angles. They want everyone to be happy, so nobody gets to eat. Who is picking dinner in your friend group?","tags":["libra","wouldyourather","indecisive","airsigns","astrologymemes"],"palette":"lime","ink":"dark"},{"id":"libra-f02","set":"Formats","sign":"libra","text":"Venus in Libra core is agreeing with both sides of an argument, sincerely, and then going home and making a pros and cons list about which friend to text first","caption":"Venus rules Libra, which makes these placements natural diplomats who hate conflict and love harmony. They see every perspective and feel every one of them. Are you the friend who stays neutral?","tags":["venusinlibra","libra","venussign","peoplepleaser","astrology"],"palette":"magenta"},{"id":"libra-f03","set":"Formats","sign":"libra","text":"Warning: Libra has the power to make you feel like the most fascinating person alive and then not text back for three days because they couldn't pick an emoji.","caption":"Libra charm is legendary, and so is the indecision behind it. They are trying to send the perfect reply, it just takes a few business days. Has a Libra ever left you waiting?","tags":["libra","librasign","zodiacdating","astrologyhumor","texting"],"palette":"rainbow"},{"id":"libra-f04","set":"Formats","sign":"libra","text":"Being a libra is wild\n\nOne second i'm fighting for justice\n\nThe next i've spent 40 minutes picking a font for my grocery list\n\nBoth were urgent honestly","caption":"Libra carries the scales of justice and an elite eye for aesthetics, often at the same time. Fairness and beauty both matter, and they refuse to rank them. What do you spend way too long making pretty?","tags":["libra","libraseason","aesthetic","relatable","zodiacmemes"],"palette":"aqua"},{"id":"scorpio-f01","set":"Formats","sign":"scorpio","text":"Warning: Scorpio has the power to find your childhood soccer team photo in under 6 minutes using only your first name and a vibe.","caption":"Scorpio is the fixed water sign ruled by Pluto, and their research skills belong in a detective agency. Nothing stays hidden from a curious Scorpio for long. How fast can your Scorpio find something?","tags":["scorpio","scorpiosign","watersigns","astrologymemes","detective"],"palette":"deep"},{"id":"scorpio-f02","set":"Formats","sign":"scorpio","text":"yes that 5'10 scorpio moon who has said nine words to you total, remembers all of yours, and owns exclusively black hoodies is definitely your soulmate go tell them one secret right now\n\n(they already know it)","caption":"A Scorpio moon is intense, private and quietly observant, so they are always listening even when they are silent. They give little away and notice everything. Who is the quiet Scorpio in your life?","tags":["scorpiomoon","scorpio","soulmate","zodiacdating","moonsign"],"palette":"magenta"},{"id":"scorpio-f03","set":"Formats","sign":"scorpio","text":"Why you should tell a scorpio your secrets\n\n1) we'll never tell anyone\n2) we'll never forget it\n3) we'll never tell you our secrets\n4) that's the deal\n\nSigned under a full moon, no refunds","caption":"Scorpio is the most loyal vault in the zodiac, but trust is a one-way door until they decide otherwise. Ruled by Pluto, they value depth, privacy and very long memories. Would you take the deal?","tags":["scorpio","scorpioseason","trust","zodiacmemes","astrology"],"palette":"classic"},{"id":"scorpio-f04","set":"Formats","sign":"scorpio","text":"PSA: a scorpio did not \"just happen\" to see your story 4 seconds after you posted it. a scorpio has been sitting there. a scorpio was waiting. a scorpio is fine.","caption":"Scorpio placements play it cool, but their notifications are always on for the people they care about. Intensity is their love language, even when they pretend otherwise. Is your Scorpio always first to view your story?","tags":["scorpio","zodiacpsa","scorpiomemes","watersign","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"sagittarius-f01","set":"Formats","sign":"sagittarius","text":"Sagittarius logic\n\nEither i find myself in another country\n\nOr i lose myself in another country\n\nEither way i'm booking the flight tonight","caption":"Sagittarius is the mutable fire sign ruled by Jupiter, the planet of expansion, adventure and slightly reckless optimism. Every problem looks smaller from a window seat. Where would your Sagittarius book tonight?","tags":["sagittarius","sagittariussun","firesigns","wanderlust","astrology"],"palette":"sunset"},{"id":"sagittarius-f02","set":"Formats","sign":"sagittarius","text":"Would you Rather:\n\ntie down a sagittarius\n\nOR\n\ntie a bow on a weather balloon\n\n(the balloon has better odds)","caption":"Sagittarius values freedom above almost everything, so commitment needs room to roam. They love deeply, just with the windows open. Which one are you choosing?","tags":["sagittarius","wouldyourather","commitmentissues","zodiacmemes","sagseason"],"palette":"lime","ink":"dark"},{"id":"sagittarius-f03","set":"Formats","sign":"sagittarius","text":"Sagittarius sun core is saying \"i'm so blunt it's a gift\" and then telling the barista their latte art looks like a sad little horse","caption":"Sagittarius is the zodiac's truth teller, honest to the point of accidental comedy. Their symbol is the centaur archer, so honestly the horse comment is personal. What is the bluntest thing a Sag has said to you?","tags":["sagittarius","sagittariussun","honesty","relatable","astrologyhumor"],"palette":"rainbow"},{"id":"sagittarius-f04","set":"Formats","sign":"sagittarius","text":"Warning: Sagittarius has the power to say the most accurate, unforgivable thing about your situationship and then immediately ask if you want to go on a road trip.","caption":"Sagittarius friends deliver hard truths with zero warning and an adventure as the chaser. Jupiter makes them blunt, generous and impossible to stay mad at. Has a Sag ever read your situationship like this?","tags":["sagittarius","situationship","zodiacfriends","astrologymemes","sag"],"palette":"classic"},{"id":"capricorn-f01","set":"Formats","sign":"capricorn","text":"yes that 6'0 capricorn sun who replies \"noted\" to your paragraph, owns one good coat and has a five year plan with your name in pencil is definitely your soulmate go schedule a meeting about it right now","caption":"Capricorn is the cardinal earth sign ruled by Saturn, so romance comes with a timeline and a budget. They are reserved at first, but once you make the plan, it is permanent ink. Has a Capricorn ever replied noted to your paragraph?","tags":["capricorn","capricornsun","earthsigns","soulmate","zodiacdating"],"palette":"deep"},{"id":"capricorn-f02","set":"Formats","sign":"capricorn","text":"My capricorn moon's self care routine\n\n1) answer emails\n2) answer emails in a candlelit bath\n3) make a spreadsheet of my feelings\n4) close the spreadsheet\n\nGreat session. see you next fiscal year","caption":"A Capricorn moon processes emotions through productivity, structure and the occasional spreadsheet. Rest feels suspicious, so they make it efficient. What does self care actually look like for you?","tags":["capricornmoon","capricorn","selfcare","moonsign","astrologymemes"],"palette":"aqua"},{"id":"capricorn-f03","set":"Formats","sign":"capricorn","text":"PSA: a capricorn is not emotionally unavailable. they are emotionally available by appointment, between 6:15 and 6:30pm, after the gym, if you book in advance.","caption":"Capricorns get called emotionally unavailable, but really their feelings just run on a calendar. Saturn-ruled and disciplined, they show up consistently once you are on the schedule. Have you booked your slot?","tags":["capricorn","zodiacpsa","emotionallyunavailable","capricornseason","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"capricorn-f04","set":"Formats","sign":"capricorn","text":"Capricorn math\n\nIf i rest i'll fall behind\n\nIf i don't rest i'll burn out\n\nSo i've decided to burn out efficiently, ahead of schedule","caption":"Capricorn ambition is legendary, and so is their complicated relationship with taking a day off. They are the zodiac's CEO even on vacation. Are you resting this weekend or optimizing?","tags":["capricorn","hustleculture","workaholic","relatable","zodiacmemes"],"palette":"magenta"},{"id":"aquarius-f01","set":"Formats","sign":"aquarius","text":"Warning: Aquarius has the power to care deeply about the future of humanity and also leave you on read for nine days because they were thinking about octopuses.","caption":"Aquarius is the fixed air sign ruled by Uranus, and their brains live somewhere between a science documentary and a protest sign. They love humanity in general and texting back less in particular. What is your Aquarius obsessed with this week?","tags":["aquarius","aquariussign","airsigns","astrologymemes","leftonread"],"palette":"rainbow"},{"id":"aquarius-f02","set":"Formats","sign":"aquarius","text":"Would you Rather:\n\nunderstand an aquarius\n\nOR\n\nunderstand a dolphin's group chat\n\n(the dolphin will at least reply)","caption":"Aquarius is famously unpredictable, original and a little bit unreachable. They are worth the effort, but you need patience and possibly sonar. Which one are you picking?","tags":["aquarius","wouldyourather","aquariusseason","zodiacmemes","dolphins"],"palette":"lime","ink":"dark"},{"id":"aquarius-f03","set":"Formats","sign":"aquarius","text":"Aquarius moon core is ignoring a text from someone i love and then spending two hours explaining my feelings to a stranger on a train. it felt easier. we're basically family now","caption":"An Aquarius moon processes feelings with a bit of distance, which is why strangers sometimes get the full story first. Detached does not mean uncaring, it means it is complicated. Are you this Aquarius moon?","tags":["aquariusmoon","aquarius","moonsign","relatable","astrology"],"palette":"deep"},{"id":"aquarius-f04","set":"Formats","sign":"aquarius","text":"Why you should date an aquarius\n\n1) we're unpredictable\n2) we're very loyal\n3) we have a theory about the pyramids\n4) we'll explain it on the first date\n\nThe second date is also about the pyramids","caption":"Dating an Aquarius means loyalty, originality and at least one documentary-level theory per dinner. Uranus gives them strange, brilliant minds that never stop asking questions. What theory would your Aquarius bring to the first date?","tags":["aquarius","zodiacdating","aquariuslove","astrologyhumor","airsign"],"palette":"classic"},{"id":"pisces-f01","set":"Formats","sign":"pisces","text":"yes that 5'5 pisces moon who cried at a car commercial, believes in your potential more than you do and has fourteen half-written songs about the moon is definitely your soulmate go send them a voice memo right now","caption":"A Pisces moon feels everything, dreams big and loves people for who they could become. Neptune makes them romantic, creative and a little bit psychic. Which commercial made your Pisces cry this week?","tags":["piscesmoon","pisces","soulmate","watersigns","zodiacdating"],"palette":"magenta"},{"id":"pisces-f02","set":"Formats","sign":"pisces","text":"Being a pisces is wild\n\nOne second i'm psychic\n\nThe next i've walked into a glass door i walk through every day\n\nThe universe gives and the universe takes","caption":"Pisces is the mutable water sign ruled by Neptune, so intuition is strong but spatial awareness is optional. They can read your mind but not the room layout. What is your most Pisces moment?","tags":["pisces","piscessun","intuition","relatable","astrologymemes"],"palette":"aqua"},{"id":"pisces-f03","set":"Formats","sign":"pisces","text":"PSA: a pisces staring into space is not ignoring you. a pisces is living a full second life in which they own a bakery in portugal. please wait for them to come back.","caption":"Pisces placements are the zodiac's daydreamers, with a rich inner world that is frequently more interesting than a meeting. Neptune rules imagination and escape, so they visit often. What is your daydream life?","tags":["pisces","zodiacpsa","daydreamer","piscesseason","astrologyhumor"],"palette":"sunset","ink":"dark"},{"id":"pisces-f04","set":"Formats","sign":"pisces","text":"Warning: Pisces has the power to absorb the mood of every single person in the room and then go home and need a nap about it.","caption":"Pisces is the most empathic sign in the zodiac, soaking up every feeling like an emotional sponge. That sensitivity is a gift, but it does come with mandatory recovery naps. Do you need a nap after every party too?","tags":["pisces","empath","watersign","zodiacmemes","astrology"],"palette":"deep"},{"id":"htx-aries-01","set":"Houston","sign":"aries","text":"my aries mars does not 'miss the exit'. i take the feeder, catch the light, u-turn under the overpass and rejoin the katy freeway forty seconds ahead of you, which is the only number i care about","caption":"The feeder road was built for people like us","tags":["aries","houston","htx","katyfreeway","ariesmars"]},{"id":"htx-aries-02","set":"Houston","sign":"aries","text":"your honor, my aries client did not 'cut across four lanes of 610'. she saw the galleria exit at the last possible second and made a leadership decision. the other drivers are simply not leaders","caption":"The West Loop rewards commitment","tags":["aries","houston","610","houstontraffic","cardinalfire"]},{"id":"htx-aries-03","set":"Houston","sign":"aries","text":"i got an ez tag for the same reason i do everything as an aries: so i never have to slow down. not for the toll plaza on beltway 8, not for traffic, and definitely not for my own feelings","caption":"Toll paid. Emotions skipped.","tags":["aries","houston","eztag","beltway8","htx"]},{"id":"htx-aries-04","set":"Houston","sign":"aries","text":"i was told mutton bustin at the rodeo is for children under a certain weight. as an aries i heard the word 'competition' and stopped listening. security at nrg has asked me to sit down twice","caption":"Cardinal fire versus one very confused sheep","tags":["aries","houston","rodeohouston","muttonbustin","houstonastrology"]},{"id":"htx-aries-05","set":"Houston","sign":"aries","text":"every hurricane season my aries sun buys zero supplies until the first cone of uncertainty, then i'm at h-e-b at 6am treating the water aisle like game seven. i do not need forty cases. i need to win","caption":"Hurricane prep, but make it a contact sport","tags":["aries","houston","hurricaneseason","heb","htx"]},{"id":"htx-aries-06","set":"Houston","sign":"aries","text":"an aries will leave an astros game at daikin park in the seventh inning to beat traffic on 59, hear the comeback on the radio, and genuinely feel like they won both","caption":"First out of the garage is still first","tags":["aries","houston","astros","daikinpark","houstontx"]},{"id":"htx-taurus-01","set":"Houston","sign":"taurus","text":"my taurus love language is pulling off i-10 at the katy buc-ee's, buying you a brisket sandwich and saying nothing. if i hand you the beaver nuggets first, we are basically engaged","caption":"Venus-ruled and fluent in gas station brisket","tags":["taurus","houston","bucees","katytx","taurusvenus"]},{"id":"htx-taurus-02","set":"Houston","sign":"taurus","text":"your honor, my taurus client did not 'refuse to leave the line at the breakfast klub'. she had already waited forty minutes for chicken and waffles and now considers that spot her legal residence","caption":"Fixed earth does not abandon a queue","tags":["taurus","houston","breakfastklub","midtownhouston","htx"]},{"id":"htx-taurus-03","set":"Houston","sign":"taurus","text":"a taurus in houston has two seasons: crawfish season and waiting for crawfish season. please do not invite my taurus moon anywhere in july unless there is a viet-cajun boil on bellaire involved","caption":"Weather is irrelevant. Mudbugs are the calendar.","tags":["taurus","houston","crawfishseason","vietcajun","taurusmoon"]},{"id":"htx-taurus-04","set":"Houston","sign":"taurus","text":"minutes from the katy hoa meeting: the taurus in cinco ranch has been asked for the fourth time to repaint her shutters. she has replied for the fourth time that she likes them. item closed","caption":"The HOA met a fixed sign and lost","tags":["taurus","houston","katy","hoa","fixedearth"]},{"id":"htx-taurus-05","set":"Houston","sign":"taurus","text":"my taurus sun has ordered the same number one at the same whataburger off the north freeway since 2009. they announced new menu items. i was informed. i was not moved","caption":"Loyalty, with grilled onions","tags":["taurus","houston","whataburger","taurussun","htx"]},{"id":"htx-taurus-06","set":"Houston","sign":"taurus","text":"my taurus placements walked into gallery furniture 'just to look' and left four hours later with a recliner, a mattress and a deep respect for mattress mack. for a taurus, comfort is not a purchase. it's a value system","caption":"He did, in fact, save me money","tags":["taurus","houston","galleryfurniture","mattressmack","houstontx"]},{"id":"htx-gemini-01","set":"Houston","sign":"gemini","text":"a gemini will tell you everything in houston is twenty minutes away. the heights, twenty minutes. sugar land, twenty minutes. galveston, twenty minutes. my gemini mercury is not lying. it simply believes in me","caption":"H-Town distance is measured in optimism","tags":["gemini","houston","htx","geminimercury","houstontraffic"]},{"id":"htx-gemini-02","set":"Houston","sign":"gemini","text":"my gemini sun has a 713 number for the friends i met in montrose and a 281 number for the friends i met in katy, and those two group chats have never once been in the same room","caption":"Two area codes, one very busy twin","tags":["gemini","houston","713","281","geminisun"]},{"id":"htx-gemini-03","set":"Houston","sign":"gemini","text":"as a gemini i change lanes on 59 the way i change opinions: constantly, confidently, and with a turn signal that is technically on but has not been relevant since bellaire","caption":"Mutable air, mutable lane","tags":["gemini","houston","houstondrivers","htx","mutableair"]},{"id":"htx-gemini-04","set":"Houston","sign":"gemini","text":"i went to the rothko chapel to sit in silence with my thoughts, which as a gemini meant sitting in silence with eleven thoughts all talking at once, two of them about tacos after","caption":"The chapel was quiet. The gemini was not.","tags":["gemini","houston","rothkochapel","montrose","houstonastrology"]},{"id":"htx-gemini-05","set":"Houston","sign":"gemini","text":"at the rodeo my gemini rising did the cook-off, the carnival, the pig races and the concert. when someone asked which one i actually came for, i said yes, obviously, all of them, in that order and also reversed","caption":"RodeoHouston, but every tab open at once","tags":["gemini","houston","rodeohouston","geminirising","htx"]},{"id":"htx-gemini-06","set":"Houston","sign":"gemini","text":"dating a gemini is skating laps at the galleria ice rink while they narrate the love lives of every couple under the giant tree. they have never met any of them. they have detailed theories about all of them","caption":"Mercury-ruled and very invested in strangers","tags":["gemini","houston","galleria","iceskating","geminienergy"]},{"id":"htx-cancer-01","set":"Houston","sign":"cancer","text":"every june my cancer moon updates her hurricane kit: water, batteries, flashlight, our old texts, the hoodie you left in my car and a photo of us at the hermann park reflection pool, in case of emotional landfall","caption":"Prepared for every storm except you","tags":["cancer","houston","hurricaneseason","hermannpark","cancermoon"]},{"id":"htx-cancer-02","set":"Houston","sign":"cancer","text":"a cancer will move across the country and still keep the 713 number, purely so my mom's phone shows the same contact photo it has since 2008. that is not a phone plan. that is an heirloom","caption":"Moon-ruled and permanently area code 713","tags":["cancer","houston","713","htx","cancersun"]},{"id":"htx-cancer-03","set":"Houston","sign":"cancer","text":"my cancer sun cannot drive past a shipley do-nuts without remembering every saturday my dad bought a dozen glazed and let me hold the box in the back seat. i'm not crying. it's the humidity","caption":"Glazed, warm and deeply sentimental","tags":["cancer","houston","shipleydonuts","houstontx","watersign"]},{"id":"htx-cancer-04","set":"Houston","sign":"cancer","text":"as a crab, my cancer sun feels a complicated kinship at every viet-cajun crawfish boil. i still eat four pounds. i just make eye contact with the tray and say 'nothing personal' first","caption":"Crustacean solidarity has its limits","tags":["cancer","houston","crawfish","vietcajun","cancerseason"]},{"id":"htx-cancer-05","set":"Houston","sign":"cancer","text":"my cancer moon still waves at the astrodome every time i drive past it on 610. it's not doing anything. neither am i. we are just two old souls holding onto the good years","caption":"The Eighth Wonder and its most loyal fan","tags":["cancer","houston","astrodome","cancermoon","houstontx"]},{"id":"htx-cancer-06","set":"Houston","sign":"cancer","text":"inviting a cancer to a party outside the loop is a two-step process. first you invite her. then you wait three business days while she decides if her feelings can survive beltway 8 after dark","caption":"The shell does not travel past the Beltway lightly","tags":["cancer","houston","insidetheloop","beltway8","homebody"]},{"id":"htx-leo-01","set":"Houston","sign":"leo","text":"my leo sun did not get candy paint and swangas because i 'wanted attention'. the houston sun is out most of the year and frankly it deserves something to look at","caption":"Slab culture, but make it sun-ruled","tags":["leo","houston","slab","candypaint","leosun"]},{"id":"htx-leo-02","set":"Houston","sign":"leo","text":"i entered the art car parade on allen parkway and as a leo i'd like to clarify that it is no longer a car. it is a float with my face on both doors and a speaker that only plays applause","caption":"Main character, now street legal","tags":["leo","houston","artcarparade","allenparkway","leoenergy"]},{"id":"htx-leo-03","set":"Houston","sign":"leo","text":"a leo does not 'go to the galleria'. a leo arrives at the galleria, does one slow lap of the ice rink so the second floor can see, buys nothing and leaves completely fulfilled","caption":"The rink is a runway if you believe","tags":["leo","houston","galleria","uptownhouston","fixedfire"]},{"id":"htx-leo-04","set":"Houston","sign":"leo","text":"go texan day is the one day a year my leo rising can wear rhinestone boots, fringe and a hat the size of a satellite dish to a quarterly budget meeting, and hr has to call it heritage","caption":"Western wear, Leo volume","tags":["leo","houston","gotexanday","rodeohouston","leorising"]},{"id":"htx-leo-05","set":"Houston","sign":"leo","text":"my leo venus has one dating rule: if we go to a rockets game at toyota center and the kiss cam finds us, you commit. you do not wave it off. you do not laugh. you give the people a show","caption":"The Jumbotron is a sacred contract","tags":["leo","houston","rockets","toyotacenter","leovenus"]},{"id":"htx-leo-06","set":"Houston","sign":"leo","text":"as a leo i fully understand mattress mack. if i owned a furniture store i would also stand in front of the camera and promise to save you money with my whole chest. that's not marketing. that's a leo sun with a warehouse","caption":"Respect to the most Leo energy in H-Town","tags":["leo","houston","mattressmack","galleryfurniture","leosun"]},{"id":"htx-virgo-01","set":"Houston","sign":"virgo","text":"my virgo moon will eat the sausage kolache from shipley, enjoy it, then gently explain to the whole office that technically it's a klobasnik. nobody asked. next time i'm bringing a pamphlet","caption":"Correct, unprompted and holding a glazed","tags":["virgo","houston","kolache","klobasnik","virgomoon"]},{"id":"htx-virgo-02","set":"Houston","sign":"virgo","text":"a virgo will sit down for tex-mex, order the fajitas, and walk the table through the history of ninfa's on navigation before the queso arrives. we are not fun at dinner. we are, however, correct","caption":"Tex-Mex, served with footnotes and a citation","tags":["virgo","houston","texmex","fajitas","houstonfood"]},{"id":"htx-virgo-03","set":"Houston","sign":"virgo","text":"my virgo sun has tracked the i-45 construction in a color-coded spreadsheet for years. i have no authority. no one asked. but somebody has to know which lanes are closed tonight and it might as well be me","caption":"TxDOT has a project manager. So do I.","tags":["virgo","houston","i45","houstontraffic","virgosun"]},{"id":"htx-virgo-04","set":"Houston","sign":"virgo","text":"the hurricane kit of a houston virgo: labeled water, sorted batteries, a laminated evacuation route and a spare kit for the friend who has been 'meaning to get to it' for six seasons. that friend is a sagittarius","caption":"Prepared for the storm and for you","tags":["virgo","houston","hurricaneprep","htx","mutableearth"]},{"id":"htx-virgo-05","set":"Houston","sign":"virgo","text":"a virgo runs the memorial park loop at 6am, logs the exact three miles, then drafts a polite note to the conservancy about a mile marker that feels four feet off. we love the park. we love accuracy more","caption":"Personal best, professional concerns","tags":["virgo","houston","memorialpark","running","virgoplacements"]},{"id":"htx-virgo-06","set":"Houston","sign":"virgo","text":"my virgo rising spent ninety minutes on my hair, walked from the car to a patio in midtown and arrived looking gently microwaved. houston humidity is the only thing that has ever corrected a virgo","caption":"Ninety minutes of work, undone in one block","tags":["virgo","houston","humidity","virgorising","htx"]},{"id":"htx-x-01","set":"Houston","sign":"","text":"mercury retrograde in houston just means the feeder is closed, the u-turn is closed, the detour is closed, and the gps lady has started sounding like she personally needs a hug","caption":"Retrograde, or just Tuesday in H-Town","tags":["houston","mercuryretrograde","htx","houstontraffic","astrologymemes"]},{"id":"htx-x-02","set":"Houston","sign":"","text":"every houston birth chart has the same hidden placement: the urge to wear a puffer jacket to h-e-b the second it drops below 65 degrees. we have never needed the puffer. we know this. we wear it anyway","caption":"Two seasons, one emotionally necessary jacket","tags":["houston","coldfront","htx","houstonweather","astrologyhumor"]},{"id":"htx-x-03","set":"Houston","sign":"","text":"you can read a houstonian's whole birth chart from their answer to 'how far is the galleria'. 'fifteen minutes' is fire. 'depends on 610' is earth. a long sigh is water. 'i've never been' is a lie","caption":"Element assigned by commute","tags":["houston","galleria","houstontx","houstonastrology","zodiachumor"]},{"id":"htx-x-04","set":"Houston","sign":"","text":"the astrologer said my venus is in a tense aspect this month and honestly so is everyone on the katy freeway at 5:15. we are all just trying to merge with someone who has made it clear they are not letting us in","caption":"Venus and I-10 are both difficult right now","tags":["houston","katyfreeway","venus","htx","houstontraffic"]},{"id":"htx-libra-01","set":"Houston","sign":"libra","text":"my libra sun and i have been idling on the feeder for forty minutes because the group asked me to pick between pappasito's and ninfa's on navigation, and choosing one would be a public statement against the other","caption":"Nobody ate. Everyone felt respected.","tags":["libra","houston","htx","houstonfood"]},{"id":"htx-libra-02","set":"Houston","sign":"libra","text":"a libra cannot order at whataburger without first polling the table, then the car, then the person holding table tent number 47, who frankly has strong feelings about spicy ketchup and deserves to be heard","caption":"Democracy, served 24 hours a day","tags":["libra","houston","whataburger","houstonastrology"]},{"id":"htx-libra-03","set":"Houston","sign":"libra","text":"as a libra venus i planned the perfect first date at the rothko chapel. beautiful, quiet, free. we sat in sacred silence for an hour. i called it intimacy. they called it the longest job interview of their life","caption":"Venus picked the venue. Venus did not read the room.","tags":["libra","libravenus","houston","montrose"]},{"id":"htx-libra-04","set":"Houston","sign":"libra","text":"put a libra on the judging panel at the rodeo bar-b-que contest and i will taste 250 briskets, tell every team theirs was the most moving, and submit a scorecard that just says 'yes'","caption":"The scales are balanced. The brisket is not ranked.","tags":["libra","houston","rodeohouston","bbq"]},{"id":"htx-libra-05","set":"Houston","sign":"libra","text":"my libra rising keeps two phone numbers, one 713 and one 281, so whoever i'm talking to feels like i'm from their side of the beltway. this is not deception. this is venus doing community outreach","caption":"Inside the loop, outside the loop, always on your side","tags":["libra","librarising","houston","htx"]},{"id":"htx-libra-06","set":"Houston","sign":"libra","text":"my libra moon and i rented a pedal boat on mcgovern lake in hermann park and spent the full thirty minutes making sure we were both pedaling exactly equally. we did not move. but it was fair","caption":"Thirty minutes, zero distance, perfect balance","tags":["libra","libramoon","houston","hermannpark"]},{"id":"htx-scorpio-01","set":"Houston","sign":"scorpio","text":"my scorpio moon does not check the weather app. i simply know which underpasses on shepherd and memorial are about to flood, the same way i know which of my friends is about to lie to me","caption":"Pluto has better radar than the news","tags":["scorpio","scorpiomoon","houston","houstonweather"]},{"id":"htx-scorpio-02","set":"Houston","sign":"scorpio","text":"a scorpio does not go to the galleria to shop. a scorpio goes to the galleria to sit by the ice rink, nurse one coffee for four hours and quietly learn everything about everyone","caption":"Window shopping, but the windows are people","tags":["scorpio","houston","galleria","houstontx"]},{"id":"htx-scorpio-03","set":"Houston","sign":"scorpio","text":"the scorpio in me reads my ez tag statement like a detective reads a crime scene. you said you were at your mom's in pearland all weekend. the hardy toll road would like a word","caption":"Every toll is a receipt. Every receipt is evidence.","tags":["scorpio","houston","eztag","houstonastrology"]},{"id":"htx-scorpio-04","set":"Houston","sign":"scorpio","text":"your honor, my client is a scorpio mars. she did not 'refuse to let him merge' on the katy freeway. she simply remembered that he cut her off at that exact exit in 2019, and she has been waiting","caption":"The defense rests. The grudge does not.","tags":["scorpio","scorpiomars","houston","katyfreeway"]},{"id":"htx-scorpio-05","set":"Houston","sign":"scorpio","text":"a scorpio at a viet-cajun crawfish spot on bellaire is silent, focused and surrounded by a terrifying pile of shells. we are not antisocial. we are getting to the bottom of something, which is our entire personality","caption":"Pluto rules the underworld and the bottom of the bag","tags":["scorpio","houston","crawfish","houstonfood"]},{"id":"htx-scorpio-06","set":"Houston","sign":"scorpio","text":"scorpio is a fixed water sign, which explains why i thrive in houston in august. the air is ninety percent water, nobody can see clearly, and everyone is sweating about something they refuse to talk about","caption":"Humidity is just the city keeping secrets","tags":["scorpio","houston","houstonweather","watersign"]},{"id":"htx-sagittarius-01","set":"Houston","sign":"sagittarius","text":"my sagittarius sun cannot pass a buc-ee's on i-10 without stopping. not for gas, not for the bathroom. i go in for one brisket sandwich and come out with beaver nuggets, a deer feeder and a plan to move to wyoming","caption":"Jupiter expands everything, including the cart","tags":["sagittarius","houston","bucees","roadtrip"]},{"id":"htx-sagittarius-02","set":"Houston","sign":"sagittarius","text":"as a sagittarius i will tell you everything in houston is twenty minutes away. kemah, twenty minutes. the woodlands, twenty minutes. this is not a lie. it is jupiter, the planet of optimism, doing my directions","caption":"Twenty minutes is a feeling, not a distance","tags":["sagittarius","houston","htx","houstontraffic"]},{"id":"htx-sagittarius-03","set":"Houston","sign":"sagittarius","text":"put a sagittarius at a woodlands covenants meeting and i will be the one who stands up during the mailbox color debate to ask, respectfully, whether any of us are actually happy","caption":"Point of order: what is the meaning of life","tags":["sagittarius","houston","thewoodlands","hoa"]},{"id":"htx-sagittarius-04","set":"Houston","sign":"sagittarius","text":"my sagittarius moon booked a spontaneous beach trip to find myself and ended up in galveston, which counts. i stood on the seawall, ate a funnel cake on the pleasure pier and said 'honestly, this is basically europe'","caption":"Passport not required. Confidence was.","tags":["sagittarius","sagittariusmoon","houston","galveston"]},{"id":"htx-sagittarius-05","set":"Houston","sign":"sagittarius","text":"my sagittarius rising will drive to bush intercontinental at 4am for a cheaper flight to anywhere, even though hobby is closer, because the airport with 'intercontinental' in the name simply feels more like destiny","caption":"Hobby is for errands. IAH is for prophecy.","tags":["sagittarius","sagittariusrising","houston","travel"]},{"id":"htx-sagittarius-06","set":"Houston","sign":"sagittarius","text":"a sagittarius heard about the rodeo trail rides camping in memorial park and immediately asked where to get a horse. i have never ridden one. i am, however, half horse, which jupiter says counts as experience","caption":"The centaur has entered the trail ride group chat","tags":["sagittarius","houston","rodeohouston","firesign"]},{"id":"htx-capricorn-01","set":"Houston","sign":"capricorn","text":"a capricorn does not get stuck on the katy freeway. a capricorn studies it for five years, buys a townhouse two exits closer, and leaves at 5:52am, smiling, while you are still looking for your keys","caption":"Saturn does not do rush hour","tags":["capricorn","houston","katyfreeway","houstontraffic"]},{"id":"htx-capricorn-02","set":"Houston","sign":"capricorn","text":"the capricorn at space center houston is not here for the rockets. we are reading the mission control org chart, noting who reported to whom, and quietly drafting a ten year plan to run the moon","caption":"One small step for man, one quarterly review for the goat","tags":["capricorn","houston","spacecity","nasa"]},{"id":"htx-capricorn-03","set":"Houston","sign":"capricorn","text":"every hurricane season my capricorn sun has the water, batteries and canned goods bought by may. when the storm finally shows up on the news and everyone sprints to h-e-b, i simply sit at home and feel correct","caption":"Prepared since May. Smug since June.","tags":["capricorn","houston","hurricaneseason","heb"]},{"id":"htx-capricorn-04","set":"Houston","sign":"capricorn","text":"my capricorn saturn deeply admires mattress mack. a man who bets on the astros, hedges the bet, then refunds the whole city is not gambling. that is a capricorn with a microphone and a furniture store","caption":"Risk management, but make it local legend","tags":["capricorn","houston","astros","houstontx"]},{"id":"htx-capricorn-05","set":"Houston","sign":"capricorn","text":"the astros do not really do rain delays at daikin park, because someone built a roof over the problem. that is not baseball. that is my capricorn rising, removing weather from the equation and calling it a plan","caption":"Saturn would like to thank the roof","tags":["capricorn","capricornrising","houston","astros"]},{"id":"htx-capricorn-06","set":"Houston","sign":"capricorn","text":"the i-45 expansion is expected to take about eighteen years, which my capricorn sun respects. that is not a delay. that is a construction project with capricorn energy: slow, expensive and finishing just to prove you wrong","caption":"Patience is a freeway","tags":["capricorn","houston","i45","houstontraffic"]},{"id":"htx-aquarius-01","set":"Houston","sign":"aquarius","text":"an aquarius does not attend the art car parade. an aquarius has been building a car shaped like a giant mood ring in the garage for three years and refuses to explain it to the neighbors","caption":"Uranus approved the permit. The HOA did not.","tags":["aquarius","houston","artcarparade","houstonart"]},{"id":"htx-aquarius-02","set":"Houston","sign":"aquarius","text":"as an aquarius i refuse to say feeder road. i say frontage road, out loud, in houston, at full volume, and i will plant my flag on this hill, which to be fair is the only hill houston has","caption":"Fixed air, fixed opinion, flat city","tags":["aquarius","houston","htx","houstonastrology"]},{"id":"htx-aquarius-03","set":"Houston","sign":"aquarius","text":"my aquarius moon respects slab culture deeply, because a candy painted car rolling slow down the block, trunk open, playing a song slowed to half speed is the most unbothered thing humanity has ever invented","caption":"Detached, but make it swangin","tags":["aquarius","aquariusmoon","houston","slab"]},{"id":"htx-aquarius-04","set":"Houston","sign":"aquarius","text":"an aquarius friend will ignore your texts for a week, then appear at a 2am pho spot on bellaire with three strangers from a philosophy forum and act like this was always the plan","caption":"Unreachable until suddenly very reachable","tags":["aquarius","houston","bellaireblvd","houstonfood"]},{"id":"htx-aquarius-05","set":"Houston","sign":"aquarius","text":"my aquarius placements have a fully drafted, deeply unsolicited plan for the astrodome. it involves an indoor rainforest, a community garden and a co-op. nobody asked. i have emailed the county twice","caption":"The Eighth Wonder needs a ninth idea","tags":["aquarius","houston","astrodome","houstontx"]},{"id":"htx-aquarius-06","set":"Houston","sign":"aquarius","text":"put an aquarius at johnson space center and i will skip the gift shop, find an

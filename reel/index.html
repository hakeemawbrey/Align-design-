<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Align Reel</title>
<style>
  @font-face { font-family: 'EB Garamond'; font-weight: 400; src: url(fonts/eb-garamond-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'EB Garamond'; font-weight: 500; src: url(fonts/eb-garamond-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'EB Garamond'; font-weight: 600; src: url(fonts/eb-garamond-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'EB Garamond'; font-weight: 400; font-style: italic; src: url(fonts/eb-garamond-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'EB Garamond'; font-weight: 500; font-style: italic; src: url(fonts/eb-garamond-latin-500-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-weight: 400; src: url(fonts/space-mono-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-weight: 700; src: url(fonts/space-mono-latin-700-normal.woff2) format('woff2'); }
  :root { --bg: #05030f; --fg: #efe6d6; --mute: #7d6f94; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px 'Space Mono', monospace; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .wrap { display: grid; gap: 12px; justify-items: center; width: min(100%, 460px); }
  canvas { width: 100%; height: auto; aspect-ratio: 9 / 16; max-height: calc(100vh - 110px); width: auto; max-width: 100%; display: block; border-radius: 10px; }
  .bar { display: flex; gap: 10px; align-items: center; width: 100%; }
  input[type=range] { flex: 1; accent-color: #f2c75c; }
  button { font: inherit; background: #1e1240; color: var(--fg); border: 1px solid #34235f; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #tc { color: var(--mute); min-width: 7ch; text-align: right; }
  body.export .bar { display: none; }
  body.export { padding: 0; display: block; }
  body.export canvas { width: 1080px; height: 1920px; max-height: none; border-radius: 0; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage"></canvas>
  <div class="bar"><button id="play">Pause</button><input id="scrub" type="range" min="0" value="0" /><span id="tc">0.00s</span></div>
</div>
<script src="lib/timeline.js"></script>
<script src="lib/core.js"></script>
<script src="lib/chakras.js"></script>
<script src="lib/zodiac.js"></script>
<script src="scenes/01-intro.js"></script>
<script src="scenes/02-chakras.js"></script>
<script src="scenes/03-zodiac.js"></script>
<script src="scenes/04-montage.js"></script>
<script src="scenes/05-outro.js"></script>
<script src="lib/render.js"></script>
<script>
  const A = window.ALIGN
  if (location.hash === '#export') document.body.classList.add('export')
  A.ready.then(() => {
    window.__ready = true
    if (document.body.classList.contains('export')) return
    const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), btn = document.getElementById('play')
    const N = A.totalFrames()
    scrub.max = N - 1
    let playing = true, f = 0, last = performance.now(), acc = 0
    const audio = new Audio('out/soundtrack.wav'); audio.loop = false
    const t0 = parseFloat(new URLSearchParams(location.search).get('t') || '0'); f = Math.round(t0 * A.FPS)
    function show() { A.renderFrame(f); scrub.value = f; tc.textContent = (f / A.FPS).toFixed(2) + 's' }
    btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; if (playing) { audio.currentTime = f / A.FPS; audio.play().catch(() => {}) } else audio.pause() }
    scrub.oninput = () => { f = +scrub.value; audio.currentTime = f / A.FPS; show() }
    document.body.addEventListener('click', () => { if (playing && audio.paused) { audio.currentTime = f / A.FPS; audio.play().catch(() => {}) } }, { once: true })
    function loop(now) {
      if (playing) { acc += now - last; while (acc > 1000 / A.FPS) { acc -= 1000 / A.FPS; f = (f + 1) % N; if (f === 0) { audio.currentTime = 0 } } show() }
      last = now; requestAnimationFrame(loop)
    }
    show(); requestAnimationFrame(loop)
  })
</script>
</body>
</html>
